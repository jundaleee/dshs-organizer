<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Sorganizer</title>
<meta name="theme-color" content="#0B0B0E">
<link rel="icon" href="favicon.ico?v=4" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png?v=4">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png?v=4">
<link rel="apple-touch-icon" href="assets/icon-180.png?v=4">
<link rel="manifest" href="manifest.json?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sorganizer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    /* 이 앱엔 라이트 모드가 없이 항상 다크라서, 브라우저가 대신 그려주는 요소(select 팝업
       목록, 날짜 picker, 스크롤바 등)도 다크로 맞춰야 함 — 안 그러면 페이지는 어두운데
       select를 열었을 때 나오는 목록만 흰 배경으로 튀는 문제가 생김(실사용 중 발견). */
    color-scheme: dark;
    --bg:#0B0B0E;
    --glass:rgba(255,255,255,.08); --glass-strong:rgba(255,255,255,.15); --glass-press:rgba(255,255,255,.2);
    --border:rgba(255,255,255,.13); --border-strong:rgba(255,255,255,.22); --border-hi:rgba(255,255,255,.36);
    --text:#FFFFFF; --text-2:rgba(255,255,255,.76); --text-3:rgba(255,255,255,.52);
    --blue:#0A84FF; --red:#FF453A; --green:#30D158; --orange:#FF9F0A; --purple:#BF5AF2; --pink:#FF375F; --indigo:#5E5CE6; --teal:#64D2FF;
    --accent:var(--blue);
    --danger:var(--red); --good:var(--green);
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Pretendard Variable','Pretendard','Malgun Gothic',sans-serif;
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --blur:26px;
    --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 620px at 12% -8%, rgba(10,132,255,.20), transparent 60%),
      radial-gradient(ellipse 780px 680px at 105% 8%, rgba(191,90,242,.14), transparent 55%),
      radial-gradient(ellipse 700px 640px at 25% 108%, rgba(255,69,58,.08), transparent 58%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1;
  }
  ::selection{background:rgba(10,132,255,.35);}
  button,input,textarea{font-family:inherit;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}
  button{cursor:pointer;}

  /* ---- glass utility ---- */
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);
    backdrop-filter:blur(var(--blur)) saturate(1.7);
    border:1px solid var(--border);
    border-top-color:var(--border-hi);
  }

  /* ---- shell / nav ---- */
  .app-shell{min-height:100vh;}
  .topbar{display:flex;align-items:center;justify-content:space-between;max-width:720px;margin:0 auto;padding:24px 32px 0;}
  .topbar-brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;letter-spacing:-.01em;}
  .topbar-brand .mark{width:26px;height:26px;border-radius:9px;flex-shrink:0;background:var(--blue);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.5), 0 2px 5px rgba(0,0,0,.3);}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .main{min-width:0;}
  .main-inner{max-width:720px;margin:0 auto;padding:16px 32px 110px;}

  .notif-badge{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;}
  .notif-row{font-size:13px;line-height:1.6;padding:9px 0;border-bottom:1px solid var(--border);}
  .notif-row:last-child{border-bottom:none;}
  /* 알림 — 모달이 아니라 벨 버튼 근처에서 살짝 스르륵 내려오는 팝오버 */
  .notif-pop{position:fixed;top:16px;right:20px;width:320px;max-width:calc(100vw - 32px);z-index:85;
    background:rgba(22,23,28,.95);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.6);backdrop-filter:blur(var(--blur)) saturate(1.6);
    border:1px solid var(--border-strong);border-top-color:var(--border-hi);border-radius:var(--r-lg);
    box-shadow:0 18px 44px rgba(0,0,0,.5);transform-origin:top right;
    animation:notifPopIn 220ms cubic-bezier(.16,1,.3,1);overflow:hidden;}
  @keyframes notifPopIn{from{opacity:0;transform:translateY(-8px) scale(.97);}to{opacity:1;transform:none;}}
  .notif-pop--leaving{animation:notifPopOut 160ms cubic-bezier(.6,.04,.98,.34) forwards;pointer-events:none;}
  @keyframes notifPopOut{from{opacity:1;transform:none;}to{opacity:0;transform:translateY(-8px) scale(.97);}}
  .notif-pop-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px 8px;font-size:13px;font-weight:600;}
  .notif-pop-body{padding:0 13px 12px;max-height:min(70vh,460px);overflow-y:auto;}
  .notif-pop-sec{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--text-3);text-transform:uppercase;margin:10px 0 4px;}
  @media(prefers-reduced-motion:reduce){
    .notif-pop{animation:none;}
    .notif-pop--leaving{animation:none;opacity:0;}
  }
  .iconbtn{background:var(--glass);border:1px solid var(--border);color:var(--text-2);font-size:12.5px;padding:7px 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px;transition:all var(--dur) var(--ease);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));}
  .iconbtn:hover{color:var(--text);border-color:var(--border-strong);background:var(--glass-strong);}

  @media(max-width:639px){
    .topbar{padding:20px 16px 0;}
    .main-inner{padding:14px 16px 80px;max-width:100%;}
  }

  /* ---- page header ---- */
  .page-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:30px;flex-wrap:wrap;}
  .page-head h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0;}
  .page-head .sub{font-size:13px;color:var(--text-3);}

  /* ---- 디데이 ---- */
  .dday-card{
    background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);backdrop-filter:blur(var(--blur)) saturate(1.7);
    border:1px solid var(--border);border-top-color:var(--border-hi);border-radius:var(--r-lg);
    padding:16px 20px;margin-bottom:20px;
  }
  .dday-card-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .dday-card-head{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .dday-add-toggle{display:flex;align-items:center;gap:3px;background:none;border:none;color:var(--text-3);font-size:11.5px;font-weight:600;cursor:pointer;padding:2px 2px;transition:color var(--dur) var(--ease);}
  .dday-add-toggle:hover{color:var(--text);}
  .dday-add-chevron{display:inline-flex;transition:transform var(--dur) var(--ease);}
  .dday-add-toggle.open .dday-add-chevron{transform:rotate(90deg);}
  .dday-empty{padding:6px 0;}
  .dday-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
  .dday-item:last-of-type{border-bottom:none;}
  .dday-item-name{flex:1;font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dday-item-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue);flex-shrink:0;}
  .dday-item-val.masked{font-size:12.5px;font-weight:600;color:var(--text-3);}
  .dday-eye,.dday-del{width:24px;height:24px;border-radius:50%;border:none;background:none;color:var(--text-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:color var(--dur) var(--ease);padding:0;}
  .dday-eye:hover{color:var(--text);}
  .dday-del:hover{color:var(--red);}
  .dday-add-panel{overflow:hidden;max-height:0;transition:max-height 260ms var(--ease);}
  .dday-add-panel.open{max-height:170px;}
  .dday-add-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .dday-add-input{flex:1;min-width:100px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:7px 13px;font-size:12.5px;}
  .dday-add-date{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:7px 13px;font-size:12.5px;}

  .empty{color:var(--text-3);font-size:13.5px;padding:18px 0;}

  .row-link{color:var(--blue);text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
  .row-link:hover{text-decoration:underline;}
  .row-link svg{opacity:.8;flex-shrink:0;}

  /* ---- assignment rows ---- */
  .asg-row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--border);}
  .asg-row:last-child{border-bottom:none;}
  .asg-row.done{opacity:.4;}
  .asg-check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border-strong);flex-shrink:0;background:var(--glass);display:flex;align-items:center;justify-content:center;padding:0;transition:all var(--dur) var(--ease);}
  .asg-row.done .asg-check{background:var(--green);border-color:var(--green);}
  .asg-check svg{opacity:0;transform:scale(.4);transition:all var(--dur) var(--ease);}
  .asg-row.done .asg-check svg{opacity:1;transform:scale(1);}
  .asg-main{flex:1;min-width:0;}
  .asg-tag{font-size:12px;color:var(--text-3);}
  .asg-title{font-size:14.5px;margin-top:1px;word-break:break-word;}
  .asg-row.done .asg-title{text-decoration:line-through;text-decoration-color:var(--border-strong);}
  .asg-due{font-size:12.5px;color:var(--text-2);flex-shrink:0;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .asg-due.urgent{color:var(--orange);font-weight:600;}
  .asg-due.overdue{color:var(--red);font-weight:600;}
  .asg-del{width:24px;height:24px;border-radius:50%;border:none;background:none;color:var(--text-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--dur);}
  .asg-row:hover .asg-del{opacity:1;}
  .asg-del:hover{color:var(--red);}
  .asg-row.asg-complete-anim{pointer-events:none;overflow:hidden;animation:asgCollapse 260ms cubic-bezier(.4,0,.2,1) 260ms forwards;}
  .asg-row.asg-complete-anim .asg-check{background:var(--green);border-color:var(--green);transform:scale(1.08);transition:all 240ms cubic-bezier(.34,1.56,.64,1);}
  .asg-row.asg-complete-anim .asg-check svg{opacity:1;transform:scale(1);transition:all 240ms cubic-bezier(.34,1.56,.64,1) 30ms;}
  .asg-row.asg-complete-anim .asg-title{text-decoration:line-through;text-decoration-color:var(--border-strong);transition:text-decoration-color 200ms var(--ease);}
  @keyframes asgCollapse{
    0%{opacity:1;max-height:200px;transform:translateX(0);}
    60%{opacity:0;max-height:200px;transform:translateX(48px);}
    100%{opacity:0;max-height:0;margin-top:0;margin-bottom:0;padding-top:0;padding-bottom:0;border-bottom-width:0;transform:translateX(48px);}
  }
  .asg-priority{display:flex;align-items:center;gap:6px;margin-top:7px;}
  .asg-priority-label{font-size:11px;color:var(--text-3);}
  .pri-btn{background:var(--glass);border:1px solid var(--border);color:var(--text-3);border-radius:var(--r-pill);padding:3px 11px;font-size:11px;font-weight:600;}
  .pri-btn.active[data-val="high"]{background:var(--red);border-color:var(--red);color:#fff;}
  .pri-btn.active[data-val="mid"]{background:var(--blue);border-color:var(--blue);color:#fff;}
  .pri-btn.active[data-val="low"]{background:rgba(255,255,255,.22);border-color:var(--border-strong);color:var(--text);}

  .sync-health{font-size:12px;color:var(--text-3);padding:0 0 14px;}
  .sync-health.warn{color:var(--orange);font-weight:600;}


  /* ---- D-day 역산 타임라인 ---- */
  .dday-legend{font-size:11.5px;color:var(--text-3);margin:0 14px 6px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .dday-legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);flex-shrink:0;}
  .dday-legend-dot.overdue{background:var(--red);}
  .dday-timeline{position:relative;height:92px;margin:4px 14px 28px;}
  .dday-track{position:absolute;left:0;right:0;bottom:26px;height:2px;background:var(--border);}
  .dday-today{position:absolute;bottom:20px;width:2px;height:14px;background:var(--blue);box-shadow:0 0 8px rgba(10,132,255,.7);}
  .dday-cluster{position:absolute;bottom:26px;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;transform:translateX(-50%);cursor:default;}
  .dday-dot{width:9px;height:9px;border-radius:50%;background:var(--orange);flex-shrink:0;border:1.5px solid var(--bg);box-shadow:0 0 0 1px var(--border);}
  .dday-dot.overdue{background:var(--red);}
  .dday-count{font-size:9.5px;color:var(--text-3);}
  .dday-label{position:absolute;bottom:0;font-size:10.5px;color:var(--text-3);white-space:nowrap;}
  .dday-label.start{left:0;color:var(--blue);font-weight:600;}
  .dday-label.end{right:0;}

  .asg-form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--border);align-items:center;}
  .asg-form input{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:9px 14px;font-size:13px;}
  .asg-form input.title{flex:2;min-width:180px;}
  .asg-form input.date{flex:1;min-width:130px;}
  .asg-form input.tag{flex:1;min-width:110px;}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:filter var(--dur) var(--ease),transform var(--dur) var(--ease);}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}
  .btn:hover{filter:brightness(1.12);}
  .btn:active{transform:scale(.97);}
  .btn-outline{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border-strong);color:var(--text);border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:all var(--dur) var(--ease);}
  .btn-outline:hover{background:var(--glass-strong);}
  .btn-outline:active{transform:scale(.97);}
  .btn-danger{background:var(--red);color:#fff;border:none;border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:filter var(--dur) var(--ease);}
  .btn-danger:hover{filter:brightness(1.12);}

  .corner-tabs{display:inline-flex;gap:2px;margin-bottom:16px;padding:3px;border-radius:var(--r-pill);background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border);}
  .corner-tab{background:none;border:none;padding:7px 14px;border-radius:var(--r-pill);font-size:12.5px;color:var(--text-2);transition:all var(--dur) var(--ease);}
  .corner-tab.active{color:var(--text);background:var(--glass-strong);font-weight:600;}
  .corner-tab .n{color:inherit;opacity:.6;font-weight:400;}

  .add-row{display:flex;gap:8px;margin-bottom:14px;}
  .add-row input,.add-row select{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:9px 15px;font-size:13px;min-width:0;}
  .add-row input::placeholder{color:var(--text-3);}

  /* ---- settings modal ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;}
  .modal{background:rgba(28,28,32,.72);-webkit-backdrop-filter:blur(34px) saturate(1.8);backdrop-filter:blur(34px) saturate(1.8);border:1px solid var(--border-strong);border-top-color:var(--border-hi);border-radius:var(--r-lg);max-width:520px;width:100%;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
  .modal-head h2{margin:0;font-size:16.5px;font-weight:700;}
  .modal-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--glass);color:var(--text-2);display:flex;align-items:center;justify-content:center;}
  .modal-close:hover{background:var(--glass-strong);color:var(--text);}
  .modal-body{padding:8px 22px 24px;overflow-y:auto;}
  .settings-group{padding:20px 0;border-bottom:1px solid var(--border);}
  .settings-group:last-child{border-bottom:none;}
  .settings-group h3{font-size:13px;font-weight:600;margin:0 0 4px;}
  .settings-group .desc{font-size:12px;color:var(--text-3);line-height:1.6;margin-bottom:12px;}
  .settings-group .desc b{color:var(--text-2);}
  .settings-group input[type=password],.settings-group input[type=text]{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:10px 15px;font-size:13px;margin-bottom:10px;}
  .settings-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .settings-status{font-size:11.5px;color:var(--green);margin-left:2px;}
  .settings-status.err{color:var(--orange);}

  .asg-editing{display:block;padding:12px 4px;}
  .asg-edit-form{display:flex;flex-direction:column;gap:8px;}
  .asg-edit-line{display:flex;gap:8px;flex-wrap:wrap;}
  .asg-edit-line .add-input{flex:1;min-width:130px;}

  .fade-in{animation:fadeIn 220ms var(--ease);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>
<div class="app-shell" id="shell">
  <div id="topbarSlot"></div>
  <main class="main"><div class="main-inner" id="app"></div></main>
</div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
(function(){
  "use strict";

  /* ============ 과목/교사 구조 ============ */
  const DAYNAME = ['일','월','화','수','목','금','토'];
  const MONTHNAME = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  function genId(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function buildSkeleton(){
    return { assignments:[], importedClassroomIds:[], ddays:[] };
  }

  /* ============ 오늘 정보 ============ */
  const now = new Date();
  const todayMid = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  function toISODate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

  /* ============ 저장소 ============ */
  const STORAGE_KEY = 'organizer-data-v2';
  const GITHUB_TOKEN_STORAGE_KEY = 'organizer-github-token';
  const CLASSROOM_SYNC_API_URL = 'https://api.github.com/repos/jundaleee/dshs-organizer-data/contents/data/assignments-sync.json?ref=main';
  let storageOK = true;
  (function testStorage(){
    try{
      const probe = '__organizer_probe__';
      localStorage.setItem(probe, '1');
      localStorage.removeItem(probe);
    }catch(e){ storageOK = false; }
  })();
  function loadData(){
    if(!storageOK) return null;
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function persist(){
    if(!storageOK) return;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }
    catch(e){ storageOK = false; render(); }
  }
  function getGithubToken(){ try{ return localStorage.getItem(GITHUB_TOKEN_STORAGE_KEY) || ''; }catch(e){ return ''; } }
  function setGithubToken(token){
    try{ if(token) localStorage.setItem(GITHUB_TOKEN_STORAGE_KEY, token); else localStorage.removeItem(GITHUB_TOKEN_STORAGE_KEY); }catch(e){}
  }


  /* ============ 상태 ============ */
  const state = {
    modal:null,
    asgSortMode:'due',
    editingAssignment:null,
    ddayAddOpen:false,
    data:buildSkeleton()
  };

  /* ============ 아이콘 ============ */
  function icon(name){
    const p = {
      settings:'<circle cx="10" cy="10" r="2.6"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5 5l1.4 1.4M13.6 13.6 15 15M15 5l-1.4 1.4M6.4 13.6 5 15"/>',
      check:'<path d="M4 8.5 7 11.5 12 5"/>',
      close:'<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
      trash:'<path d="M4 5.5h8M7 5.5V4h2v1.5M5 5.5l.5 6.5h5l.5-6.5"/>',
      chevron:'<path d="M6 4l4 4-4 4"/>',
      arrowRight:'<path d="M7 4l4 4-4 4"/>',
      external:'<path d="M8 5H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-3"/><path d="M11 4h5v5"/><path d="M9.5 10.5 16 4"/>',
      pencil:'<path d="M4 16v-2.5L13.5 4l2.5 2.5L6.5 16H4z"/><path d="M12 5.5 14.5 8"/>',
      bell:'<path d="M6 8.5a4 4 0 0 1 8 0c0 3 1 4 1.5 4.5H4.5C5 12.5 6 11.5 6 8.5z"/><path d="M8.3 15.5a1.9 1.9 0 0 0 3.4 0"/>'
    }[name] || '';
    return `<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  }

  /* ============ 렌더 ============
     남은 화면이 "과제" 하나뿐이라 탭 전환도 스크롤 체인도 필요 없다 —
     매 렌더마다 그 화면 하나를 통째로 다시 그린다. */
  function renderOverlaysOnly(){
    document.querySelectorAll('.modal-overlay, .notif-pop').forEach(el=>el.remove());
    if(state.modal==='settings') document.body.insertAdjacentHTML('beforeend', renderSettingsModal());
    else if(state.modal==='notifications') document.body.insertAdjacentHTML('beforeend', renderNotificationsModal());
    const githubTokenInput = document.getElementById('githubTokenInput');
    if(githubTokenInput) githubTokenInput.value = getGithubToken();
    applyA11yLabels();
  }
  function render(){
    const topbarSlot = document.getElementById('topbarSlot');
    topbarSlot.innerHTML = renderTopbar();

    const app = document.getElementById('app');
    let html = '';
    if(!storageOK) html += `<div class="empty" style="color:var(--danger);">이 브라우저에서는 로컬 저장이 안 돼(시크릿 모드이거나 저장 공간이 꽉 찼을 수 있어). 작업 후 꼭 설정에서 내보내기로 백업해줘.</div>`;
    html += renderAssignmentsPage();
    app.innerHTML = html;

    document.querySelectorAll('.modal-overlay, .notif-pop').forEach(el=>el.remove());
    if(state.modal==='settings') document.body.insertAdjacentHTML('beforeend', renderSettingsModal());
    else if(state.modal==='notifications') document.body.insertAdjacentHTML('beforeend', renderNotificationsModal());

    applyA11yLabels();
    const githubTokenInput = document.getElementById('githubTokenInput');
    if(githubTokenInput) githubTokenInput.value = getGithubToken();
  }

  /* 아이콘만 있는 버튼은 스크린리더에서 그냥 "버튼"으로 읽힌다. title이 있는 건
     aria-label로 옮기고, 닫기/완료/알림/설정처럼 title이 없는 것만 이름을 지어준다. */
  const A11Y_FALLBACK = [
    ['.modal-close', '닫기'],
    ['.asg-check', '완료 처리'],
    ['[data-action="openNotifications"]', '알림'],
    ['[data-action="openSettings"]', '설정']
  ];
  function applyA11yLabels(){
    A11Y_FALLBACK.forEach(([sel, label])=>{
      document.querySelectorAll(sel).forEach(el=>{
        if(!el.getAttribute('aria-label') && !el.getAttribute('title')) el.setAttribute('aria-label', label);
      });
    });
    document.querySelectorAll('button[title]:not([aria-label])').forEach(b=>{
      b.setAttribute('aria-label', b.getAttribute('title'));
    });
  }

  function renderTopbar(){
    return `<div class="topbar">
      <div class="topbar-brand"><div class="mark"></div><b>Sorganizer</b></div>
      <div class="topbar-actions">
        ${renderTopbarMini()}
        <button class="iconbtn" data-action="openSettings">${icon('settings')}</button>
      </div>
    </div>`;
  }
  // 알림 — 디데이 일주일 전, 과제 마감 3일/1일 전에만(그 외엔 조용히 아무것도 안 뜸),
  // 그리고 이번 주 통지표를 바로 받을 수 있는 통로. 오른쪽 위 종 아이콘 하나로 통합.
  function computeNotifications(){
    const list = [];
    (state.data.ddays||[]).forEach(d=>{
      if(d.hidden) return;
      const dueMid = new Date(d.date+'T00:00:00').getTime();
      const daysLeft = Math.round((dueMid-todayMid)/86400000);
      if(daysLeft===7) list.push(`"${d.name}" 디데이가 일주일 남았어 (D-7)`);
    });
    (state.data.assignments||[]).filter(a=>!a.done && DATE_RE.test(a.dueDate)).forEach(a=>{
      const dueMid = new Date(a.dueDate+'T00:00:00').getTime();
      const daysLeft = Math.round((dueMid-todayMid)/86400000);
      if(daysLeft===3) list.push(`"${a.title}" 마감이 3일 남았어`);
      if(daysLeft===1) list.push(`"${a.title}" 마감이 내일이야`);
    });
    return list;
  }
  function renderTopbarMini(){
    const n = computeNotifications().length;
    return `<div class="topbar-mini"><button class="iconbtn" data-action="openNotifications">${icon('bell')}${n>0?`<span class="notif-badge">${n>9?'9+':n}</span>`:''}</button></div>`;
  }
  function renderNotificationsModal(){
    const notes = computeNotifications();
    const notesHtml = notes.length===0 ? `<div class="empty" style="padding:6px 0;">다가오는 일정 없음</div>`
      : notes.map(n=>`<div class="notif-row">${escapeHtml(n)}</div>`).join('');
    return `<div class="notif-pop" role="dialog" aria-label="알림">
      <div class="notif-pop-head"><span>알림</span><button class="modal-close" data-action="closeModal" aria-label="닫기">${icon('close')}</button></div>
      <div class="notif-pop-body">
        <div class="notif-pop-sec">다가오는 일정</div>
        ${notesHtml}
      </div>
    </div>`;
  }

  /* ---- Home: 과목별 박스 ---- */
  // 수학과/정보과학과/문과는 카테고리 단위 그대로 유지, 과학과만 지구과학/생명과학/화학/물리학 네 박스로 분할
  function addDday(){
    const nameEl = document.getElementById('ddayName');
    const dateEl = document.getElementById('ddayDate');
    const name = nameEl.value.trim();
    const date = dateEl.value;
    if(!name || !date) return;
    state.data.ddays = state.data.ddays || [];
    state.data.ddays.push({id:genId(), name, date, hidden:false, createdAt:Date.now()});
    state.ddayAddOpen = false;
    persist(); render();
  }
  function deleteDday(id){
    state.data.ddays = (state.data.ddays||[]).filter(d=>d.id!==id);
    persist(); render();
  }
  function toggleDdayHidden(id){
    const d = (state.data.ddays||[]).find(x=>x.id===id); if(!d) return;
    d.hidden = !d.hidden;
    persist(); render();
  }
  function toggleDdayAdd(){
    state.ddayAddOpen = !state.ddayAddOpen;
    render();
  }
  function renderDdayCard(){
    const list = (state.data.ddays||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    const rowsHtml = list.length===0
      ? `<div class="empty dday-empty">등록된 디데이가 없어.</div>`
      : list.map(d=>{
        const dueMid = new Date(d.date+'T00:00:00').getTime();
        const dLeft = Math.round((dueMid-todayMid)/86400000);
        const label = dLeft>0?`D-${dLeft}`:(dLeft===0?'D-DAY':`D+${Math.abs(dLeft)}`);
        return `<div class="dday-item">
          <div class="dday-item-name">${escapeHtml(d.name)}</div>
          <div class="dday-item-val ${d.hidden?'masked':''}">${d.hidden?'가려짐':label}</div>
          <button class="dday-eye" title="${d.hidden?'다시 보기':'가리기'}" data-action="toggleDdayHidden" data-id="${d.id}">${icon(d.hidden?'eyeOff':'eye')}</button>
          <button class="dday-del" title="삭제" data-action="deleteDday" data-id="${d.id}">${icon('trash')}</button>
        </div>`;
      }).join('');
    const open = state.ddayAddOpen;
    return `<div class="dday-card">
      <div class="dday-card-head-row">
        <div class="dday-card-head">디데이</div>
        <button class="dday-add-toggle ${open?'open':''}" data-action="toggleDdayAdd">
          디데이 추가 <span class="dday-add-chevron">${icon('chevron')}</span>
        </button>
      </div>
      ${rowsHtml}
      <div class="dday-add-panel ${open?'open':''}">
        <div class="dday-add-row">
          <input type="text" class="dday-add-input" id="ddayName" placeholder="이름 (예: 중간고사)">
          <input type="date" class="dday-add-date" id="ddayDate">
          <button class="btn-outline" data-action="addDday">추가</button>
        </div>
      </div>
    </div>`;
  }

  const PRIORITY_LABELS = {high:'상', mid:'중', low:'하'};
  const PRIORITY_RANK = {high:0, mid:1, low:2};
  function assignmentRowHtml(a, showCheckbox){
    // Classroom에서 긁어온 제목이 잘리거나 기한이 틀릴 때가 있어서 직접 고칠 수 있어야 함
    if(state.editingAssignment === a.id){
      return `<div class="asg-row asg-editing">
        <div class="asg-edit-form">
          <input type="text" class="add-input" id="asgEditTitle" value="${escapeHtml(a.title)}" placeholder="과제명">
          <div class="asg-edit-line">
            <input type="date" class="add-input" id="asgEditDate" value="${escapeHtml(a.dueDate||'')}">
            <input type="text" class="add-input" id="asgEditTag" value="${escapeHtml(a.tag||'')}" placeholder="관련 과목">
          </div>
          <div class="asg-edit-line">
            <button class="btn" data-action="saveAssignmentEdit" data-id="${a.id}">저장</button>
            <button class="btn-outline" data-action="cancelAssignmentEdit">취소</button>
          </div>
        </div>
      </div>`;
    }
    const dueMid = new Date(a.dueDate+'T00:00:00').getTime();
    const dLeft = Math.round((dueMid-todayMid)/86400000);
    const ddLabel = dLeft>0?`D-${dLeft}`:(dLeft===0?'D-DAY':`D+${Math.abs(dLeft)} 지남`);
    const ddClass = dLeft<0?'overdue':(dLeft<=2?'urgent':'');
    const priorityRow = (showCheckbox && !a.done) ? `<div class="asg-priority">
      <span class="asg-priority-label">가성비</span>
      ${['high','mid','low'].map(p=>`<button class="pri-btn ${a.priority===p?'active':''}" data-action="setAssignmentPriority" data-id="${a.id}" data-val="${p}">${PRIORITY_LABELS[p]}</button>`).join('')}
    </div>` : '';
    return `<div class="asg-row ${a.done?'done':''}" data-row-id="${a.id}">
      <button class="asg-check" data-action="toggleAssignment" data-id="${a.id}">${icon('check')}</button>
      <div class="asg-main">
        ${a.tag?`<div class="asg-tag">${escapeHtml(a.tag)}</div>`:''}
        <div class="asg-title">${a.link?`<a href="${escapeHtml(a.link)}" target="_blank" rel="noopener noreferrer" class="row-link">${escapeHtml(a.title)} ${icon('external')}</a>`:escapeHtml(a.title)}</div>
        ${priorityRow}
      </div>
      <div class="asg-due ${ddClass}">${ddLabel}</div>
      <button class="asg-del" title="수정" data-action="editAssignment" data-id="${a.id}">${icon('pencil')}</button>
      <button class="asg-del" title="삭제" data-action="deleteAssignment" data-id="${a.id}">${icon('trash')}</button>
    </div>`;
  }

  /* ---- Assignments ---- */
  function fmtShortDate(iso){
    const d = new Date(iso+'T00:00:00');
    return `${MONTHNAME[d.getMonth()]} ${d.getDate()}일(${DAYNAME[d.getDay()]})`;
  }

  // 마감일들을 가로 타임라인에 흩뿌려서 특정 날짜에 몰려있는지 한눈에 보이게 함
  // (peakDailyLoad와 같은 문제의식: 합계/평균만으로는 클러스터링이 안 보임)
  function renderDdayTimeline(assignments){
    const pending = assignments.filter(a=>!a.done);
    if(pending.length===0) return '';
    const dueTimes = pending.map(a=>new Date(a.dueDate+'T00:00:00').getTime());
    let maxDue = Math.max.apply(null, dueTimes.concat([todayMid]));
    const minSpan = 7*86400000; // 폭이 너무 좁으면(전부 임박) 점들이 뭉개지니 최소 폭 보장
    if(maxDue - todayMid < minSpan) maxDue = todayMid + minSpan;
    const span = maxDue - todayMid;

    const byDate = {};
    pending.forEach(a=>{ (byDate[a.dueDate] = byDate[a.dueDate] || []).push(a); });

    const clusters = Object.keys(byDate).map(dateStr=>{
      const dueMs = new Date(dateStr+'T00:00:00').getTime();
      const overdue = dueMs < todayMid;
      const pct = Math.max(0, Math.min(100, ((dueMs-todayMid)/span)*100));
      const items = byDate[dateStr];
      const shown = items.slice(0,4);
      const dotsHtml = shown.map(a=>`<div class="dday-dot ${overdue?'overdue':''}" title="${escapeHtml(fmtShortDate(dateStr))} · ${escapeHtml(a.title)}"></div>`).join('');
      const moreHtml = items.length>4 ? `<div class="dday-count">+${items.length-4}</div>` : '';
      return `<div class="dday-cluster" style="left:${pct}%;" title="${escapeHtml(fmtShortDate(dateStr))} · 과제 ${items.length}개">${dotsHtml}${moreHtml}</div>`;
    }).join('');

    return `<div class="dday-legend">점 = 그 날짜 마감인 과제 (겹치면 숫자로 표시) · <span class="dday-legend-dot"></span> 대기 중 · <span class="dday-legend-dot overdue"></span> 기한 지남</div>
    <div class="dday-timeline">
      <div class="dday-track"></div>
      <div class="dday-today" style="left:0%;"></div>
      ${clusters}
      <div class="dday-label start">오늘</div>
      <div class="dday-label end">${fmtShortDate(toISODate(new Date(maxDue)))}</div>
    </div>`;
  }

  function renderAssignmentsPage(){
    const sorted = state.data.assignments.filter(a=>!a.done).slice().sort((a,b)=>{
      if(state.asgSortMode==='priority'){
        const ra = PRIORITY_RANK[a.priority]??1, rb = PRIORITY_RANK[b.priority]??1;
        if(ra!==rb) return ra-rb;
      }
      return a.dueDate.localeCompare(b.dueDate);
    });
    const rows = sorted.map(a=>assignmentRowHtml(a,true)).join('');

    return `<div class="fade-in">
      <div class="page-head"><h1>과제</h1><button class="iconbtn" data-action="syncClassroom">${icon('arrowRight')} Classroom 동기화</button></div>
      ${renderDdayCard()}
      ${syncStatus?`<div class="empty" style="padding:0 0 14px;">${syncStatus}</div>`:syncHealthHtml()}
      ${renderDdayTimeline(sorted)}
      <div class="asg-form">
        <input type="text" class="title" id="asgTitle" placeholder="과제명">
        <input type="date" class="date" id="asgDate">
        <input type="text" class="tag" id="asgTag" placeholder="관련 과목">
        <button class="btn" data-action="addAssignment">추가</button>
      </div>
      ${sorted.length>0?`<div class="corner-tabs" style="margin-bottom:14px;">
        <button class="corner-tab ${state.asgSortMode==='due'?'active':''}" data-action="setAsgSortMode" data-mode="due">마감일순</button>
        <button class="corner-tab ${state.asgSortMode==='priority'?'active':''}" data-action="setAsgSortMode" data-mode="priority">가성비순</button>
      </div>`:''}
      ${sorted.length===0?`<div class="empty">등록된 과제가 없어.</div>`:rows}
    </div>`;
  }

  /* ---- Materials (자료/공지) ---- */
  function renderSettingsModal(){
    return `<div class="modal-overlay" data-action="closeModal">
      <div class="modal">
        <div class="modal-head"><h2>설정</h2><button class="modal-close" data-action="closeModal">${icon('close')}</button></div>
        <div class="modal-body">
          <div class="settings-group">
            <h3>GitHub 동기화 토큰</h3>
            <div class="desc">오직 <b>"Classroom 동기화"</b> 기능에서만 쓰여. 비공개 저장소의 동기화 파일(data/assignments-sync.json)을 읽어올 때만 사용돼. github.com/settings/personal-access-tokens/new 에서 dshs-organizer-data 저장소 하나만, Contents: Read-only 권한으로 발급받아줘.</div>
            <input type="password" id="githubTokenInput" placeholder="github_pat_..." autocomplete="off" spellcheck="false">
            <div class="settings-actions">
              <button class="btn-outline" data-action="saveGithubToken">저장</button>
              <button class="btn-outline" data-action="clearGithubToken">삭제</button>
              <span class="settings-status ${githubTokenStatus.startsWith('✗')?'err':''}">${githubTokenStatus}</span>
            </div>
          </div>

          <div class="settings-group">
            <h3>데이터</h3>
            <div class="desc">정기적으로 내보내기 백업을 해두는 걸 추천해.</div>
            <div class="settings-actions">
              <button class="btn-outline" data-action="exportData">내보내기</button>
              <button class="btn-outline" data-action="importTrigger">가져오기</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }

  /* ============ 유틸 ============ */
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function addAssignment(){
    const title = document.getElementById('asgTitle').value.trim();
    const date = document.getElementById('asgDate').value;
    const tag = document.getElementById('asgTag').value.trim();
    if(!title || !date){ return; }
    state.data.assignments.push({id:genId(), title, dueDate:date, tag, done:false, createdAt:Date.now(), source:'manual'});
    persist(); render();
  }
  function saveAssignmentEdit(id){
    const a = state.data.assignments.find(x=>x.id===id); if(!a) return;
    const t = document.getElementById('asgEditTitle');
    const d = document.getElementById('asgEditDate');
    const g = document.getElementById('asgEditTag');
    const title = t ? t.value.trim() : '';
    const date = d ? d.value : '';
    if(!title || !date) return;          // 제목·기한은 비울 수 없음
    a.title = title; a.dueDate = date; a.tag = g ? g.value.trim() : a.tag;
    state.editingAssignment = null;
    persist(); render();
  }
  function toggleAssignment(id){
    const a = state.data.assignments.find(x=>x.id===id); if(!a) return;
    a.done = !a.done; persist(); render();
  }
  function deleteAssignment(id){
    state.data.assignments = state.data.assignments.filter(x=>x.id!==id);
    persist(); render();
  }

  /* ============ 액션: 설정 ============ */
  let githubTokenStatus = '', syncStatus = '';
  // 완료 하나를 실수로 잘못 눌렀을 때 되돌릴 수 있도록 가장 최근 완료 한 건만 기억해둔다
  // (여러 단계 실행취소는 지원 안 함 — 알림 벨에서 "마지막 완료 취소"로 노출됨)
  // Classroom 동기화 상태 — 자동 동기화가 조용히 실패하는 걸 막기 위해 수동/자동 구분 없이 항상 기록
  let lastSyncCheckedAt = null; // Apps Script가 마지막으로 Gmail을 확인해서 파일을 쓴 시각 (upstream, payload.lastCheckedAt)
  let lastSyncError = ''; // 클라이언트의 가장 최근 fetch 시도가 실패한 이유 (성공하면 비움)
  function syncHealthHtml(){
    if(!getGithubToken()){
      return `<div class="sync-health">Classroom 자동 동기화가 꺼져 있어 — 설정에서 GitHub 토큰을 등록하면 켜져.</div>`;
    }
    if(!lastSyncCheckedAt){
      return lastSyncError
        ? `<div class="sync-health warn">Classroom 동기화 확인 실패 — ${escapeHtml(lastSyncError)}</div>`
        : `<div class="sync-health">아직 Classroom 동기화 확인 전이야.</div>`;
    }
    const hrs = (Date.now() - new Date(lastSyncCheckedAt).getTime())/3600000;
    const label = hrs<1 ? '방금' : hrs<24 ? `${Math.round(hrs)}시간 전` : `${Math.floor(hrs/24)}일 전`;
    const stale = hrs>24;
    return `<div class="sync-health ${stale||lastSyncError?'warn':''}">
      마지막 Classroom 확인: ${label}${stale?' — 24시간 넘게 새 내용이 없어. Apps Script 트리거나 GitHub 토큰이 살아있는지 확인해봐.':''}
      ${lastSyncError?` · 방금 시도 실패: ${escapeHtml(lastSyncError)}`:''}
    </div>`;
  }
  async function testGithubToken(){
    const token = getGithubToken();
    if(!token) return {ok:false, error:'토큰이 없어'};
    try{
      const res = await fetch(CLASSROOM_SYNC_API_URL + '&t=' + Date.now(), {
        cache:'no-store',
        headers:{ 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github.raw+json' }
      });
      if(res.status===401 || res.status===403 || res.status===404){
        return {ok:false, error:'404/403 — dshs-organizer-data 저장소 접근 권한이 없어. 토큰 만들 때 Repository access에서 dshs-organizer-data를 선택했는지, Permissions → Contents를 Read-only 이상으로 줬는지, Resource owner가 본인 계정인지 확인해줘.'};
      }
      if(!res.ok) return {ok:false, error:'HTTP '+res.status};
      const payload = await res.json();
      return {ok:true, assignments:(payload.assignments||[]).length, notices:(payload.notices||[]).length};
    }catch(err){
      return {ok:false, error:'네트워크 오류 — '+(err.message||'알 수 없음')};
    }
  }
  async function saveGithubToken(){
    const input = document.getElementById('githubTokenInput');
    const val = input ? input.value.trim() : '';
    if(!val){ githubTokenStatus = '토큰을 입력해줘.'; render(); return; }
    setGithubToken(val);
    githubTokenStatus = '저장했어 — 연결 확인 중...';
    render();
    const result = await testGithubToken();
    githubTokenStatus = result.ok
      ? `✓ 연결 성공 — 과제 ${result.assignments}개, 공지·자료 ${result.notices}개 확인됨.`
      : `✗ 연결 실패 — ${result.error}`;
    render();
    if(result.ok) syncClassroom(false);
  }
  function clearGithubToken(){ setGithubToken(''); githubTokenStatus = '삭제했어.'; render(); }

  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  async function syncClassroom(manual){
    const token = getGithubToken();
    if(!token){
      if(manual){ syncStatus = 'GitHub 토큰이 필요해 — 저장소가 비공개라서 그래. 설정에서 등록해줘.'; render(); }
      return;
    }
    if(manual){ syncStatus = '동기화 중...'; render(); }
    try{
      const res = await fetch(CLASSROOM_SYNC_API_URL + '&t=' + Date.now(), {
        cache:'no-store',
        headers:{ 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github.raw+json' }
      });
      if(res.status===401 || res.status===403 || res.status===404) throw new Error('토큰이 유효하지 않거나 dshs-organizer-data 저장소 접근 권한이 없어 — 설정에서 GitHub 토큰을 다시 확인해줘 (비공개 저장소는 권한 없으면 404로 응답함)');
      if(!res.ok) throw new Error('HTTP '+res.status);
      const payload = await res.json();
      if(payload.lastCheckedAt) lastSyncCheckedAt = payload.lastCheckedAt;
      lastSyncError = '';
      const incomingAsg = Array.isArray(payload.assignments) ? payload.assignments : [];
      const knownAsg = new Set(state.data.importedClassroomIds || []);
      let addedAsg = 0, skippedNoDate = 0;
      incomingAsg.forEach(item=>{
        if(!item || !item.id || knownAsg.has(item.id)) return;
        if(!item.dueDate || !DATE_RE.test(item.dueDate)){ skippedNoDate++; return; }
        state.data.assignments.push({
          id: genId(), title: (item.title || '제목 없음').trim(), dueDate: item.dueDate,
          estHours: (typeof item.estHours==='number' && item.estHours>0) ? item.estHours : null,
          tag: (item.tag || 'Classroom').trim(), done:false, createdAt: Date.now(), source:'classroom-sync',
          link: (typeof item.link==='string' && /^https?:\/\//.test(item.link)) ? item.link : null
        });
        state.data.importedClassroomIds.push(item.id);
        knownAsg.add(item.id); addedAsg++;
      });
      if(addedAsg>0) persist();
      if(manual) syncStatus = addedAsg>0
        ? `과제 ${addedAsg}개를 불러왔어${skippedNoDate>0?` (기한 불명확 ${skippedNoDate}개 제외)`:''}.`
        : '새로 불러올 항목이 없어.';
    }catch(err){
      lastSyncError = err.message || '오프라인이거나 알 수 없는 오류';
      if(manual) syncStatus = `동기화 실패 — ${lastSyncError}.`;
    }
    render();
  }

  /* ============ 내보내기/가져오기 ============ */
  function exportData(){
    const blob = new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`study-organizer-backup-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }
  function importDataFromFile(file){
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        const parsed = JSON.parse(e.target.result);
        state.data = {
          assignments: parsed.assignments || [],
          importedClassroomIds: parsed.importedClassroomIds || [],
          ddays: parsed.ddays || []
        };
        persist(); render();
      }catch(err){ alert('파일을 읽지 못했어. JSON 형식이 맞는지 확인해줘.'); }
    };
    reader.readAsText(file);
  }

  /* ============ 홈 박스 드래그 (물방울처럼 마우스로 움직이기) ============ */
  /* ============ 이벤트 위임 ============ */
  document.body.addEventListener('click', function(e){
    const el = e.target.closest('[data-action]'); if(!el) return;
    if(el.dataset.action==='closeModal' && el.classList.contains('modal-overlay') && e.target!==el) return;
    switch(el.dataset.action){
      case 'openSettings': githubTokenStatus=''; state.modal='settings'; renderOverlaysOnly(); break;
      case 'openNotifications': state.modal='notifications'; renderOverlaysOnly(); break;
      case 'closeModal': {
        // 알림 팝오버는 슬라이드 아웃 후에 닫는다
        const pop = document.querySelector('.notif-pop');
        if(state.modal==='notifications' && pop){
          pop.classList.add('notif-pop--leaving');
          setTimeout(()=>{ state.modal=null; renderOverlaysOnly(); }, 150);
        } else {
          state.modal=null; renderOverlaysOnly();
        }
        break;
      }
      case 'exportData': exportData(); break;
      case 'importTrigger': document.getElementById('importFile').click(); break;
      case 'addAssignment': addAssignment(); break;
      case 'addDday': addDday(); break;
      case 'deleteDday': deleteDday(el.dataset.id); break;
      case 'toggleDdayHidden': toggleDdayHidden(el.dataset.id); break;
      case 'toggleDdayAdd': toggleDdayAdd(); break;
      case 'toggleAssignment': {
        const id = el.dataset.id;
        const a = state.data.assignments.find(x=>x.id===id);
        const row = el.closest('.asg-row');
        if(a && !a.done && row && !row.classList.contains('asg-complete-anim')){
          row.classList.add('asg-complete-anim');
          setTimeout(()=>toggleAssignment(id), 520);
        } else {
          toggleAssignment(id);
        }
        break;
      }
      case 'deleteAssignment': deleteAssignment(el.dataset.id); break;
      case 'editAssignment': state.editingAssignment = el.dataset.id; render(); break;
      case 'cancelAssignmentEdit': state.editingAssignment = null; render(); break;
      case 'saveAssignmentEdit': saveAssignmentEdit(el.dataset.id); break;
      case 'setAssignmentPriority': {
        const a = state.data.assignments.find(x=>x.id===el.dataset.id);
        if(a){ a.priority = a.priority===el.dataset.val ? null : el.dataset.val; persist(); render(); }
        break;
      }
      case 'setAsgSortMode': state.asgSortMode = el.dataset.mode; render(); break;
      case 'saveGithubToken': saveGithubToken(); break;
      case 'clearGithubToken': clearGithubToken(); break;
      case 'syncClassroom': syncClassroom(true); break;
    }
  });

  document.getElementById('importFile').addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]) importDataFromFile(e.target.files[0]);
    e.target.value = '';
  });

  /* ============ 초기화 ============ */
  (function init(){
    const saved = loadData();
    if(saved){
      state.data = {
        assignments: saved.assignments || [],
        importedClassroomIds: saved.importedClassroomIds || [],
        ddays: saved.ddays || []
      };
    }
    render();
    syncClassroom(false);
  })();

})();
</script>
