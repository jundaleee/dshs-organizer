<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Jundal's Study Organizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    --bg:#0D1117; --bg-2:#10151D; --panel:#161C26; --panel-2:#1C2430;
    --border:#2A3244; --border-soft:#212938;
    --text:#E8ECF4; --text-dim:#8B96AA; --text-faint:#5B6578;
    --sans:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --math:#5B7FDE; --sci:#33B18C; --cs:#A374F2; --hum:#E3A23B;
    --u-new:#5B7FDE; --u-1:#33B18C; --u-2:#8FC93D; --u-3:#E3B23B; --u-4:#E38A3B; --u-5:#E35B5B;
    --radius:10px; --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(91,127,222,.08), transparent 40%),
      radial-gradient(circle at 85% 10%, rgba(163,116,242,.07), transparent 40%),
      var(--bg);
    color:var(--text); font-family:var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1100px;margin:0 auto;padding:18px 16px 90px;}
  ::selection{background:rgba(91,127,222,.35);}
  button,input,textarea{font-family:inherit;}
  a{color:inherit;}
  :focus-visible{outline:2px solid #7C9CF2;outline-offset:2px;border-radius:6px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 14px;border-bottom:1px solid var(--border-soft);margin-bottom:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .brand-mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--math),var(--cs));display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:12px;color:#fff;flex-shrink:0;}
  .brand-text{line-height:1.15;}
  .brand-text b{font-size:15.5px;letter-spacing:.01em;}
  .brand-text span{display:block;font-size:11px;color:var(--text-faint);font-family:var(--mono);}
  .topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .chip{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);background:var(--panel);border:1px solid var(--border);padding:5px 10px;border-radius:999px;white-space:nowrap;}
  .iconbtn{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:.15s;}
  .iconbtn:hover{color:var(--text);border-color:#3A465C;background:var(--panel-2);}

  .navrow{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .navbtn{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);padding:7px 15px;border-radius:8px;font-size:12.5px;cursor:pointer;}
  .navbtn.active{background:var(--panel-2);color:var(--text);border-color:#3A465C;font-weight:700;}

  .storage-warn{background:#2A2210;border:1px solid #55431A;color:#E3B23B;font-size:12.5px;padding:9px 13px;border-radius:8px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}

  .today-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
  .today-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .today-head h2{font-size:15px;margin:0;letter-spacing:.01em;}
  .today-head .linkbtn{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);cursor:pointer;background:none;border:none;padding:0;}
  .today-head .linkbtn:hover{color:var(--text);}
  .today-list{display:flex;flex-direction:column;gap:6px;}
  .p-row{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:8px 11px;}
  .p-row.linked{border-color:#3A465C;}
  .p-row .pn{font-family:var(--mono);font-size:11px;color:var(--text-faint);width:44px;flex-shrink:0;}
  .p-row .ps{font-size:13px;font-weight:600;flex:1;}
  .p-row .pt{font-size:11.5px;color:var(--text-dim);}

  .reco-panel,.asg-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
  .reco-panel h2,.asg-panel h2{font-size:15px;margin:0 0 4px;}
  .reco-sub{font-size:12px;color:var(--text-faint);margin-bottom:12px;}
  .reco-empty,.item-empty,.modal-empty{color:var(--text-faint);font-size:12.5px;text-align:center;padding:20px 0;}
  .reco-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
  .reco-item:last-child{border-bottom:none;}
  .reco-item:hover{background:var(--panel-2);border-radius:8px;}
  .reco-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .reco-main{flex:1;min-width:0;}
  .reco-path{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);}
  .reco-text{font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge{font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;font-weight:600;}

  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(max-width:560px){.cat-grid{grid-template-columns:1fr;}}
  .cat-tile{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;position:relative;overflow:hidden;transition:.15s;text-align:left;}
  .cat-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--tint);}
  .cat-tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tint);}
  .cat-tile h3{margin:0 0 4px;font-size:16px;}
  .cat-tile p{margin:0;font-size:12px;color:var(--text-dim);font-family:var(--mono);}
  .cat-tile .today-badge{position:absolute;right:14px;top:14px;font-family:var(--mono);font-size:10px;background:var(--tint);color:#0D1117;padding:3px 8px;border-radius:999px;font-weight:700;}

  .crumb{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--text-faint);margin-bottom:14px;}
  .crumb span.seg{cursor:pointer;padding:3px 2px;}
  .crumb span.seg:hover{color:var(--text);}
  .crumb span.seg.cur{color:var(--text);font-weight:600;cursor:default;}
  .crumb .sep{color:var(--text-faint);opacity:.5;}

  .tabrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .tab{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;}
  .tab:hover{color:var(--text);border-color:#3A465C;}
  .tab.active{background:var(--tint);border-color:var(--tint);color:#0B0E14;font-weight:700;}
  .tab .dot{width:6px;height:6px;border-radius:50%;background:var(--tint);flex-shrink:0;}
  .tab.active .dot{background:#0B0E14;}

  .info-box,.memo-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;}
  .info-box label,.memo-box label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-faint);font-family:var(--mono);margin-bottom:7px;}
  .info-box textarea,.memo-box textarea{width:100%;min-height:44px;resize:vertical;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:7px;color:var(--text);padding:9px 10px;font-size:13px;line-height:1.5;}
  .info-box textarea::placeholder,.memo-box textarea::placeholder{color:var(--text-faint);}

  .corners{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:820px){.corners{grid-template-columns:1fr;}}
  .corner{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;min-height:220px;}
  .corner-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .corner-glyph{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;color:#0B0E14;font-weight:700;}
  .corner-head h4{margin:0;font-size:13.5px;flex:1;}
  .corner-count{font-family:var(--mono);font-size:11px;color:var(--text-faint);}
  .add-row{display:flex;gap:6px;margin-bottom:10px;}
  .add-row input{flex:1;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:7px;color:var(--text);padding:7px 9px;font-size:12.5px;min-width:0;}
  .add-row input::placeholder{color:var(--text-faint);}
  .add-row button{background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);border-radius:7px;padding:0 12px;cursor:pointer;font-size:13px;font-weight:600;}
  .add-row button:hover{color:var(--text);}
  .item-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:340px;padding-right:2px;}
  .item{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:8px;padding:8px 9px;}
  .item-top{display:flex;align-items:flex-start;gap:7px;}
  .item-text{flex:1;font-size:12.8px;line-height:1.45;word-break:break-word;}
  .item-actions{display:flex;gap:4px;flex-shrink:0;}
  .icb{width:22px;height:22px;border-radius:6px;border:1px solid var(--border-soft);background:var(--panel);color:var(--text-dim);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icb:hover{color:var(--text);border-color:#3A465C;}
  .icb.ok:hover{color:#33B18C;border-color:#33B18C;}
  .icb.no:hover{color:#E35B5B;border-color:#E35B5B;}
  .icb.on{color:#E35B5B;border-color:#E35B5B;background:rgba(227,91,91,.1);}

  .meter{position:relative;height:5px;background:var(--border-soft);border-radius:3px;margin-top:7px;}
  .meter .fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;}
  .meter .tick{position:absolute;top:-2px;width:1px;height:9px;background:var(--border);}
  .item-meta{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px;flex-wrap:wrap;}
  .item-date{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);}
  .reps-row{display:flex;align-items:center;gap:6px;margin-top:5px;}
  .reps-row .reps-btn{font-family:var(--mono);font-size:10px;background:var(--panel);border:1px solid var(--border-soft);color:var(--text-dim);border-radius:5px;padding:2px 7px;cursor:pointer;}
  .reps-row .reps-count{font-family:var(--mono);font-size:10px;color:var(--text-faint);}

  .ot-box{background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);padding:14px;margin-top:14px;}
  .ot-head{font-size:13px;font-weight:600;}
  .ot-textarea{width:100%;min-height:76px;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:7px;color:var(--text);padding:9px;font-size:12.5px;margin:8px 0;}
  .ot-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .ot-row button{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;}
  .ot-status{font-family:var(--mono);font-size:11px;color:var(--text-faint);}
  .ot-note{font-size:10.5px;color:var(--text-faint);margin-top:7px;}

  .fab{position:fixed;right:18px;bottom:18px;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:12.5px;box-shadow:var(--shadow);display:flex;align-items:center;gap:7px;z-index:40;}
  .fab:hover{color:var(--text);border-color:#3A465C;}
  .modal-overlay{position:fixed;inset:0;background:rgba(6,8,12,.65);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:560px;width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:var(--shadow);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-soft);}
  .modal-head h3{margin:0;font-size:14.5px;}
  .modal-body{padding:10px 16px 16px;overflow-y:auto;}
  .modal-group{margin-bottom:14px;}
  .modal-group h5{font-size:11px;color:var(--text-faint);font-family:var(--mono);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.05em;}
  .settings-row{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .settings-row label{font-size:12px;color:var(--text-faint);font-family:var(--mono);}
  .settings-row input[type=password],.settings-row input[type=text]{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:7px;color:var(--text);padding:9px 10px;font-size:12.5px;width:100%;}
  .hint{font-size:11px;color:var(--text-faint);line-height:1.5;}
  .settings-actions{display:flex;gap:8px;}
  .settings-actions button{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 14px;cursor:pointer;font-size:12.5px;font-weight:600;}
  .settings-actions button.danger:hover{color:#E35B5B;border-color:#E35B5B;}
  .settings-status{font-family:var(--mono);font-size:11px;color:var(--sci);min-height:14px;}
  .rotation-row{margin-bottom:12px;}
  .rotation-label{font-size:12.5px;font-weight:600;margin-bottom:6px;}
  .rotation-status{font-weight:400;color:var(--text-dim);font-size:11.5px;}
  .rotation-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .rot-btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);border-radius:7px;padding:6px 11px;cursor:pointer;font-size:11.5px;}
  .rot-btn.active{background:var(--math);border-color:var(--math);color:#0B0E14;font-weight:700;}

  .tt-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px;}
  .tt-table{border-collapse:collapse;width:100%;min-width:560px;}
  .tt-table th{font-family:var(--mono);font-size:12px;color:var(--text-dim);padding:8px 6px;border-bottom:1px solid var(--border-soft);text-align:left;}
  .tt-table th.today{color:var(--math);}
  .tt-p{font-family:var(--mono);font-size:11px;color:var(--text-faint);padding:8px 6px;white-space:nowrap;border-bottom:1px solid var(--border-soft);}
  .tt-cell{border-bottom:1px solid var(--border-soft);padding:7px 8px;min-width:100px;vertical-align:top;}
  .tt-cell.today{background:rgba(91,127,222,.08);}
  .tt-cell.empty{color:var(--text-faint);}
  .tt-subj{font-size:12.5px;font-weight:600;}
  .tt-sub{font-size:10.5px;color:var(--text-dim);margin-top:2px;}

  .cap-banner{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;font-family:var(--mono);}
  .cap-banner.ok{background:rgba(51,177,140,.12);color:#33B18C;border:1px solid rgba(51,177,140,.3);}
  .cap-banner.over{background:rgba(227,91,91,.12);color:#E35B5B;border:1px solid rgba(227,91,91,.3);}
  .cap-input-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12.5px;color:var(--text-dim);}
  .cap-input-row input{width:64px;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:6px;color:var(--text);padding:5px 7px;}
  .asg-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .asg-form input{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:7px;color:var(--text);padding:8px 9px;font-size:12.5px;}
  .asg-form input.title{flex:2;min-width:160px;}
  .asg-form input.date{flex:1;min-width:130px;}
  .asg-form input.hours{width:80px;}
  .asg-form input.tag{flex:1;min-width:110px;}
  .asg-form button{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:0 14px;cursor:pointer;font-weight:600;font-size:12.5px;}
  .asg-list{display:flex;flex-direction:column;gap:8px;}
  .asg-item{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .asg-item.done{opacity:.45;}
  .asg-title{font-size:13px;font-weight:600;flex:1;min-width:140px;}
  .asg-item.done .asg-title{text-decoration:line-through;}
  .asg-meta{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);}
  .asg-tag{font-size:10.5px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:5px;padding:2px 7px;color:var(--text-dim);}

  .fade-in{animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .footer-note{text-align:center;color:var(--text-faint);font-size:11px;margin-top:26px;font-family:var(--mono);}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
(function(){
  "use strict";

  /* ============ 과목/교사 구조 ============ */
  const CATS = {
    math:{ label:"수학과", tint:"var(--math)", subjects:{
      math:{ label:"수학", teachers:["손중록","조유경","이상규"] }
    }},
    sci:{ label:"과학과", tint:"var(--sci)", subjects:{
      bio:{ label:"생명과학", teachers:["옥창규","김성진","문우현"] },
      earth:{ label:"지구과학", teachers:["배태윤","이윤아"] },
      phys:{ label:"물리학", teachers:["박준홍","김정석"] },
      chem:{ label:"화학", teachers:["우희정","이형준","이승재"] }
    }},
    cs:{ label:"정보과학과", tint:"var(--cs)", subjects:{
      cs:{ label:"정보과학", teachers:["윤수진"] }
    }},
    hum:{ label:"문과", tint:"var(--hum)", subjects:{
      kor:{ label:"국어", teachers:["정진실","주혜령"] },
      eng:{ label:"영어", teachers:["김윤주","이계화"] },
      soc:{ label:"사회", teachers:["김현심"] }
    }}
  };

  // 반복 풀이 기반 모델을 적용할 과목 (수학/물리 자료 기준: "많이 풀어라" 강조)
  const REPETITION_SUBJECTS = new Set(['math|math','sci|phys']);
  function isRepetitionSubject(c,s){ return REPETITION_SUBJECTS.has(c+'|'+s); }

  const TIMETABLE = {
    mon:[
      {p:1,subject:"물리학",rot:'sci|phys',role:'double',room:"611호"},
      {p:2,subject:"물리학",rot:'sci|phys',role:'double',room:"611호"},
      {p:3,subject:"영어",teacher:"이계화",room:"어학1실"},
      {p:4,subject:"수학",teacher:"조유경",room:"603호"},
      {p:5,subject:"화학",teacher:"이형준",room:"원격강의실"},
      {p:6,subject:"사회",teacher:"김현심",room:"703호"},
      {p:7,subject:"생명과학",teacher:"옥창규",room:"생명2실"},
      {p:8,label:"공강"}
    ],
    tue:[
      {p:1,subject:"사회",teacher:"김현심",room:"703호"},
      {p:2,subject:"국어",teacher:"정진실",room:"705호"},
      {p:3,subject:"국어",teacher:"정진실",room:"705호"},
      {p:4,subject:"지구과학",rot:'sci|earth',role:'single',room:"지학3실"},
      {p:5,subject:"수학",teacher:"손중록",room:"609호"},
      {p:6,subject:"수학",teacher:"손중록",room:"609호"},
      {p:7,label:"창의"},{p:8,label:"체험"},{p:9,label:"활동"}
    ],
    wed:[
      {p:1,subject:"사회",teacher:"김현심",room:"703호"},
      {p:2,subject:"수학",teacher:"이상규",room:"604호"},
      {p:3,subject:"수학",teacher:"이상규",room:"604호"},
      {p:4,subject:"물리학",rot:'sci|phys',role:'single',room:"611호"},
      {p:5,subject:"영어",teacher:"김윤주",room:"어학1실"},
      {p:6,subject:"국어",teacher:"주혜령",room:"705호"},
      {p:7,label:"체육",room:"체육관"}
    ],
    thu:[
      {p:1,subject:"정보과학",teacher:"윤수진",room:"정보실"},
      {p:2,subject:"정보과학",teacher:"윤수진",room:"정보실"},
      {p:3,label:"메이커",room:"메이커실"},
      {p:4,label:"메이커",room:"메이커실"},
      {p:5,label:"자율"},{p:6,label:"연구"},{p:7,label:"활동"},{p:8,label:"공강"},{p:9,label:"공강"}
    ],
    fri:[
      {p:1,subject:"영어",teacher:"김윤주",room:"어학1실"},
      {p:2,subject:"생명과학",teacher:"김성진",room:"생명1실"},
      {p:3,subject:"생명과학",teacher:"문우현",room:"생명1실"},
      {p:4,subject:"화학",teacher:"우희정",room:"원격강의실"},
      {p:5,subject:"지구과학",rot:'sci|earth',role:'double',room:"지학2실"},
      {p:6,subject:"지구과학",rot:'sci|earth',role:'double',room:"지학2실"},
      {p:7,subject:"화학",teacher:"이승재",room:"원격강의실"}
    ]
  };
  const DAYKEY = {1:'mon',2:'tue',3:'wed',4:'thu',5:'fri'};
  const DAYLABEL = {mon:'월',tue:'화',wed:'수',thu:'목',fri:'금'};
  const DAYNAME = ['일','월','화','수','목','금','토'];

  /* ============ 선생님 주간 로테이션 ============ */
  // 물리학·지구과학은 같은 과목을 두 선생님이 나눠 맡는데, 한 주는 A가 2타임/B가 1타임,
  // 다음 주는 반대로 바뀐다. 기준 주(아래 REFERENCE_MONDAY)에는 double 쪽이 2타임을 맡은 걸로 본다.
  const ROTATION_REFERENCE_MONDAY = new Date(2026,7,17); // 2026-08-17(월) 기준 시간표
  const ROTATIONS = {
    'sci|phys':  { double:'박준홍', single:'김정석', label:'물리학' },
    'sci|earth': { double:'이윤아', single:'배태윤', label:'지구과학' }
  };
  const ROTATION_OVERRIDE_KEY = 'organizer-rotation-overrides';
  function mondayOf(d){
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const day = x.getDay();
    x.setDate(x.getDate() + (day===0 ? -6 : 1-day));
    return x;
  }
  function weekIsSwapped(){
    const weeks = Math.round((mondayOf(now).getTime() - mondayOf(ROTATION_REFERENCE_MONDAY).getTime()) / (7*86400000));
    return ((weeks % 2) + 2) % 2 === 1;
  }
  function getRotationOverrides(){
    try{ return JSON.parse(localStorage.getItem(ROTATION_OVERRIDE_KEY) || '{}'); }catch(e){ return {}; }
  }
  function getRotationOverride(rotKey){ return getRotationOverrides()[rotKey] || null; }
  function setRotationOverride(rotKey, teacherOrNull){
    const o = getRotationOverrides();
    if(teacherOrNull) o[rotKey] = teacherOrNull; else delete o[rotKey];
    try{ localStorage.setItem(ROTATION_OVERRIDE_KEY, JSON.stringify(o)); }catch(e){}
  }
  function currentDoubleTeacher(rotKey){
    const cfg = ROTATIONS[rotKey]; if(!cfg) return null;
    const override = getRotationOverride(rotKey);
    if(override) return override;
    return weekIsSwapped() ? cfg.single : cfg.double;
  }
  function resolveRotTeacher(rotKey, role){
    const cfg = ROTATIONS[rotKey]; if(!cfg) return null;
    const dbl = currentDoubleTeacher(rotKey);
    if(role==='double') return dbl;
    return dbl===cfg.double ? cfg.single : cfg.double;
  }
  function entryTeacher(entry){
    if(entry.teacher) return entry.teacher;
    if(entry.rot && entry.role) return resolveRotTeacher(entry.rot, entry.role);
    return null;
  }

  const CORNERS = [
    {key:'review', label:'수업 내용 복습', glyph:'▣', color:'var(--math)'},
    {key:'self',   label:'자율 학습 필요', glyph:'◇', color:'var(--sci)'},
    {key:'tips',   label:'꿀팁 · 조언',   glyph:'✺', color:'var(--hum)'}
  ];

  const TEACHER_INDEX = {};
  Object.keys(CATS).forEach(c=>{
    Object.keys(CATS[c].subjects).forEach(s=>{
      CATS[c].subjects[s].teachers.forEach(t=>{
        (TEACHER_INDEX[t] = TEACHER_INDEX[t]||[]).push({cat:c,subj:s});
      });
    });
  });

  function tKey(c,s,t){ return c+'|'+s+'|'+t; }
  function defaultTeacherData(){ return {review:[],self:[],tips:[],completed:[],memo:'',info:''}; }
  function buildSkeleton(){
    const teachers = {};
    Object.keys(CATS).forEach(c=>{
      Object.keys(CATS[c].subjects).forEach(s=>{
        CATS[c].subjects[s].teachers.forEach(t=>{ teachers[tKey(c,s,t)] = defaultTeacherData(); });
      });
    });
    return { teachers, assignments:[], dailyCapacity:5 };
  }
  function genId(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  /* ============ 오늘 정보 ============ */
  const now = new Date();
  const todayKey = DAYKEY[now.getDay()] || null;
  const todayPeriods = todayKey ? TIMETABLE[todayKey] : [];
  const todayDateStr = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${DAYNAME[now.getDay()]})`;
  const todayMid = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const TODAY_TEACHERS = new Set(todayPeriods.map(entryTeacher).filter(Boolean));
  function hasClassToday(t){ return TODAY_TEACHERS.has(t); }

  /* ============ 저장소 (localStorage — 완전 독립 로컬 저장) ============ */
  const STORAGE_KEY = 'organizer-data-v2';
  const API_KEY_STORAGE_KEY = 'organizer-anthropic-key';
  let storageOK = true;
  (function testStorage(){
    try{
      const probe = '__organizer_probe__';
      localStorage.setItem(probe, '1');
      localStorage.removeItem(probe);
    }catch(e){ storageOK = false; }
  })();
  function loadData(){
    if(!storageOK) return null;
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function persist(){
    if(!storageOK) return;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }
    catch(e){ storageOK = false; render(); }
  }
  function getApiKey(){
    try{ return localStorage.getItem(API_KEY_STORAGE_KEY) || ''; }catch(e){ return ''; }
  }
  function setApiKey(key){
    try{
      if(key) localStorage.setItem(API_KEY_STORAGE_KEY, key);
      else localStorage.removeItem(API_KEY_STORAGE_KEY);
    }catch(e){}
  }

  /* ============ 상태 ============ */
  const state = {
    view:'home', cat:null, subj:null, teacher:null,
    data:buildSkeleton(), modal:null
  };
  function getTD(){ return state.data.teachers[tKey(state.cat,state.subj,state.teacher)]; }

  /* ============ 복습 우선순위 모델 ============ */
  const CURVE = [1,3,7,14,30];
  const STAGE_COLORS = ['var(--u-new)','var(--u-1)','var(--u-2)','var(--u-3)','var(--u-4)','var(--u-5)'];
  const STAGE_LABELS = ['신규','1차 복습','2차 복습','3차 복습','4차 복습','망각위험'];
  function urgency(item, repetitionMode){
    const days = Math.max(0, Math.floor((Date.now()-item.createdAt)/86400000));
    let stage;
    if(days<1) stage=0; else if(days<3) stage=1; else if(days<7) stage=2; else if(days<14) stage=3; else if(days<30) stage=4; else stage=5;
    let suffix='';
    if(repetitionMode && item.reps>0){
      const reduce = Math.floor(item.reps/2);
      if(reduce>0){ stage = Math.max(0, stage-reduce); suffix = ` · 풀이 ${item.reps}회 반영`; }
    }
    if(item.retry){ stage = 5; suffix = ' · 재교정 필요'; }
    const pct = Math.min(100, (days/30)*100);
    return {days, stage, color:STAGE_COLORS[stage], label:`D+${days} · ${STAGE_LABELS[stage]}${suffix}`, pct};
  }

  /* ============ 렌더 ============ */
  const app = document.getElementById('app');
  let otStatus = '';
  let settingsStatus = '';

  function render(){
    let html = renderTopbar();
    if(!storageOK) html += renderStorageWarn();
    html += renderNav();
    if(state.view==='home') html += renderHome();
    else if(state.view==='assignments') html += renderAssignmentsPage();
    else if(state.view==='timetable') html += renderTimetablePage();
    else html += renderTeacherPage();
    if(state.modal==='completed') html += renderCompletedModal();
    if(state.modal==='settings') html += renderSettingsModal();
    app.innerHTML = html;
    const apiKeyInput = document.getElementById('apiKeyInput');
    if(apiKeyInput) apiKeyInput.value = getApiKey();
  }

  function renderTopbar(){
    return `
    <div class="topbar">
      <div class="brand" data-action="goHome">
        <div class="brand-mark">JS</div>
        <div class="brand-text"><b>Jundal's Study Organizer</b><span>자기주도학습 워크벤치</span></div>
      </div>
      <div class="topbar-right">
        <span class="chip">${todayDateStr}</span>
        <button class="iconbtn" data-action="openSettings">⚙ 설정</button>
        <button class="iconbtn" data-action="exportData">⇩ 내보내기</button>
        <button class="iconbtn" data-action="importTrigger">⇧ 가져오기</button>
      </div>
    </div>`;
  }
  function renderNav(){
    return `<div class="navrow">
      <button class="navbtn ${state.view==='home'?'active':''}" data-action="goHome">홈</button>
      <button class="navbtn ${state.view==='assignments'?'active':''}" data-action="goAssignments">과제</button>

    </div>`;
  }
  function renderStorageWarn(){
    return `<div class="storage-warn">⚠ 이 브라우저에서는 로컬 저장이 안 돼(시크릿 모드이거나 저장 공간이 꽉 찼을 수 있어). 작업 후 꼭 <b>내보내기</b>로 백업해줘.</div>`;
  }

  function renderHome(){
    let stripHtml = '';
    if(todayPeriods.length===0){
      stripHtml = `<div class="reco-empty">주말이야. 등교일 시간표는 없어.</div>`;
    } else {
      stripHtml = `<div class="today-list">` + todayPeriods.map(p=>{
        const pTeacher = entryTeacher(p);
        return `<div class="p-row ${p.subject?'linked':''}">
          <div class="pn">${p.p}교시</div>
          <div class="ps">${p.subject||p.label}</div>
          <div class="pt">${pTeacher? pTeacher+(p.room?' · '+p.room:'') : (p.room||'')}</div>
        </div>`;
      }).join('') + `</div>`;
    }

    let queue = [];
    Object.keys(CATS).forEach(c=>{
      Object.keys(CATS[c].subjects).forEach(s=>{
        CATS[c].subjects[s].teachers.forEach(t=>{
          const td = state.data.teachers[tKey(c,s,t)];
          const rep = isRepetitionSubject(c,s);
          td.review.forEach(item=>{
            const u = urgency(item, rep);
            const today = hasClassToday(t);
            queue.push({c,s,t,item,u,today, score:u.days+(today?6:0)+(item.retry?50:0)});
          });
        });
      });
    });
    queue.sort((a,b)=>b.score-a.score);
    queue = queue.slice(0,8);

    let recoHtml = queue.length===0
      ? `<div class="reco-empty">아직 '수업 내용 복습'에 등록된 항목이 없어.</div>`
      : queue.map(q=>`<div class="reco-item" data-action="selectTeacher" data-cat="${q.c}" data-subj="${q.s}" data-teacher="${q.t}">
          <div class="reco-dot" style="background:${CATS[q.c].tint}"></div>
          <div class="reco-main">
            <div class="reco-path">${CATS[q.c].label} · ${CATS[q.c].subjects[q.s].label} · ${q.t}${q.today?' · 오늘 수업':''}</div>
            <div class="reco-text">${escapeHtml(q.item.text)}</div>
          </div>
          <div class="badge" style="background:${q.u.color};color:#0B0E14">${q.u.label}</div>
        </div>`).join('');

    // 과제 미니 패널
    const cap = state.data.dailyCapacity||5;
    const pending = state.data.assignments.filter(a=>!a.done).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
    let demand = 0;
    pending.forEach(a=>{
      const dueMid = new Date(a.dueDate+'T00:00:00').getTime();
      const dLeft = Math.round((dueMid-todayMid)/86400000);
      demand += a.estHours / Math.max(1,dLeft);
    });
    const over = demand>cap;
    const asgMini = pending.slice(0,4).map(a=>{
      const dueMid = new Date(a.dueDate+'T00:00:00').getTime();
      const dLeft = Math.round((dueMid-todayMid)/86400000);
      const ddLabel = dLeft>0?`D-${dLeft}`:(dLeft===0?'D-DAY':`D+${Math.abs(dLeft)} 지남`);
      const ddColor = dLeft>0?'var(--sci)':(dLeft===0?'var(--u-4)':'var(--u-5)');
      return `<div class="reco-item" data-action="goAssignments">
        <div class="reco-dot" style="background:${ddColor}"></div>
        <div class="reco-main"><div class="reco-text">${escapeHtml(a.title)}</div></div>
        <div class="badge" style="background:${ddColor};color:#0B0E14">${ddLabel}</div>
      </div>`;
    }).join('');

    const catTiles = Object.keys(CATS).map(c=>{
      const cat = CATS[c];
      const subjCount = Object.keys(cat.subjects).length;
      const teacherCount = Object.values(cat.subjects).reduce((a,s)=>a+s.teachers.length,0);
      const todayCount = Object.values(cat.subjects).reduce((a,s)=>a+s.teachers.filter(hasClassToday).length,0);
      return `<button class="cat-tile" style="--tint:${cat.tint}" data-action="selectCat" data-cat="${c}">
        ${todayCount>0?`<div class="today-badge">오늘 수업 ${todayCount}</div>`:''}
        <h3>${cat.label}</h3><p>과목 ${subjCount} · 선생님 ${teacherCount}</p>
      </button>`;
    }).join('');

    return `
    <div class="fade-in">
      <div class="today-panel">
        <div class="today-head"><h2>오늘 시간표</h2><button class="linkbtn" data-action="goTimetable">전체 시간표 →</button></div>
        ${stripHtml}
      </div>
      <div class="reco-panel">
        <h2>오늘의 추천 복습</h2>
        <div class="reco-sub">망각곡선(1·3·7·14·30일) + 오늘 수업 여부 + 재교정 플래그로 우선순위를 매겼어</div>
        ${recoHtml}
      </div>
      <div class="asg-panel">
        <div class="today-head"><h2>다가오는 과제</h2><button class="linkbtn" data-action="goAssignments">과제 관리 →</button></div>
        ${pending.length>0?`<div class="cap-banner ${over?'over':'ok'}">하루 평균 ${demand.toFixed(1)}시간 필요 / 가용 ${cap}시간 ${over?'— 초과, 일정 조정 필요':'— 여유 있음'}</div>`:''}
        ${pending.length===0?`<div class="reco-empty">등록된 과제가 없어</div>`:asgMini}
      </div>
      <div class="cat-grid">${catTiles}</div>
    </div>`;
  }

  function renderTimetablePage(){
    const days=['mon','tue','wed','thu','fri'];
    let maxP=0; days.forEach(d=>TIMETABLE[d].forEach(p=>{ if(p.p>maxP) maxP=p.p; }));
    let rows='';
    for(let p=1;p<=maxP;p++){
      rows += `<tr><td class="tt-p">${p}교시</td>` + days.map(d=>{

        const todayCls = d===todayKey?'today':'';

      <div class="tt-wrap"><table class="tt-table">
        <thead><tr><th></th>${days.map(d=>`<th class="${d===todayKey?'today':''}">${DAYLABEL[d]}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }

  function renderAssignmentsPage(){
    const cap = state.data.dailyCapacity||5;
    const sorted = state.data.assignments.slice().sort((a,b)=>{
      if(a.done!==b.done) return a.done?1:-1;
      return a.dueDate.localeCompare(b.dueDate);
    });
    let demand=0;
    const rows = sorted.map(a=>{
      const dueMid = new Date(a.dueDate+'T00:00:00').getTime();
      const dLeft = Math.round((dueMid-todayMid)/86400000);
      const ddLabel = dLeft>0?`D-${dLeft}`:(dLeft===0?'D-DAY':`D+${Math.abs(dLeft)} 지남`);
      const ddColor = dLeft>0?'var(--sci)':(dLeft===0?'var(--u-4)':'var(--u-5)');
      let perDayTxt='';
      if(!a.done){
        const perDay = a.estHours/Math.max(1,dLeft);

      }
      return `<div class="asg-item ${a.done?'done':''}">

        ${a.tag?`<span class="asg-tag">${escapeHtml(a.tag)}</span>`:''}
        <span class="asg-meta">${a.dueDate} · 총 ${a.estHours}h</span>
        ${perDayTxt}
        <span class="badge" style="background:${ddColor};color:#0B0E14">${ddLabel}</span>
        <div class="item-actions">
          <button class="icb ok" title="완료 토글" data-action="toggleAssignment" data-id="${a.id}">✓</button>
          <button class="icb no" title="삭제" data-action="deleteAssignment" data-id="${a.id}">×</button>
        </div>
      </div>`;
    }).join('');
    const over = demand>cap;

    return `<div class="fade-in">
      <div class="crumb"><span class="seg" data-action="goHome">홈</span><span class="sep">›</span><span class="seg cur">과제</span></div>
      <div class="cap-input-row">
        <span>하루 가용 학습시간</span>
        <input type="number" min="0.5" step="0.5" value="${cap}" data-role="capacity">
        <span>시간</span>
      </div>
      ${state.data.assignments.length>0?`<div class="cap-banner ${over?'over':'ok'}">현재 대기 과제 기준 하루 평균 <b>${demand.toFixed(1)}시간</b> 필요 (가용 ${cap}시간) ${over?`— 초과 ${(demand-cap).toFixed(1)}시간, 일부 과제 미루거나 시간 늘려야 함`:`— 여유 ${(cap-demand).toFixed(1)}시간`}</div>`:''}
      <div class="asg-panel" style="padding:14px;">
        <div class="asg-form">
          <input type="text" class="title" id="asgTitle" placeholder="과제명 (예: 물리 수행평가 보고서)">
          <input type="date" class="date" id="asgDate">
          <input type="number" class="hours" id="asgHours" step="0.5" min="0.5" placeholder="예상 h">
          <input type="text" class="tag" id="asgTag" placeholder="관련 과목(선택)">
          <button data-action="addAssignment">추가</button>
        </div>
        <div class="asg-list">${sorted.length===0?`<div class="item-empty">등록된 과제가 없어</div>`:rows}</div>
      </div>
    </div>`;
  }

  function renderTeacherPage(){
    const cat = CATS[state.cat];
    const subjTabs = Object.keys(cat.subjects).map(s=>{
      const active = s===state.subj?'active':'';
      const anyToday = cat.subjects[s].teachers.some(hasClassToday);
      return `<button class="tab ${active}" style="--tint:${cat.tint}" data-action="selectSubj" data-cat="${state.cat}" data-subj="${s}">${anyToday?'<span class="dot"></span>':''}${cat.subjects[s].label}</button>`;
    }).join('');

    let teacherTabs='', content='';
    if(state.subj){
      const subj = cat.subjects[state.subj];
      teacherTabs = subj.teachers.map(t=>{
        const active = t===state.teacher?'active':'';
        return `<button class="tab ${active}" style="--tint:${cat.tint}" data-action="selectTeacher" data-cat="${state.cat}" data-subj="${state.subj}" data-teacher="${t}">${hasClassToday(t)?'<span class="dot"></span>':''}${t} 선생님</button>`;
      }).join('');
      if(state.teacher) content = renderCorners();
    }

    const crumb = `<div class="crumb">
      <span class="seg" data-action="goHome">홈</span><span class="sep">›</span>
      <span class="seg ${!state.subj?'cur':''}" data-action="selectCat" data-cat="${state.cat}">${cat.label}</span>
      ${state.subj?`<span class="sep">›</span><span class="seg ${!state.teacher?'cur':''}" data-action="selectSubj" data-cat="${state.cat}" data-subj="${state.subj}">${cat.subjects[state.subj].label}</span>`:''}
      ${state.teacher?`<span class="sep">›</span><span class="seg cur">${state.teacher} 선생님</span>`:''}
    </div>`;

    return `<div class="fade-in">
      ${crumb}
      <div class="tabrow">${subjTabs}</div>
      ${state.subj?`<div class="tabrow">${teacherTabs}</div>`:''}
      ${content}
      <div class="footer-note">Jundal's Study Organizer · 데이터는 이 브라우저의 로컬 저장소에 저장돼</div>
    </div>
    ${state.teacher?`<button class="fab" data-action="openCompleted">☑ 완료 목록</button>`:''}`;
  }

  function renderCorners(){
    const td = getTD();
    const rep = isRepetitionSubject(state.cat, state.subj);

    const infoBox = `<div class="info-box">
      <label>ⓘ 수업 정보 — 담당 세부 내용 / 커리큘럼</label>
      <textarea data-role="info" data-cat="${state.cat}" data-subj="${state.subj}" data-teacher="${state.teacher}"
        placeholder="이 선생님이 어떤 세부 과목·단원을 가르치는지 적어둬">${escapeHtml(td.info)}</textarea>
    </div>`;
    const memoBox = `<div class="memo-box">
      <label>✎ 메모 — 부족한 점 / 기억할 것</label>
      <textarea data-role="memo" data-cat="${state.cat}" data-subj="${state.subj}" data-teacher="${state.teacher}"
        placeholder="부족했던 부분이나 다음에 기억해야 할 것을 적어둬">${escapeHtml(td.memo)}</textarea>
    </div>`;

    const corners = CORNERS.map(cfg=>{
      const list = td[cfg.key];
      const itemsHtml = list.length===0
        ? `<div class="item-empty">아직 항목이 없어</div>`
        : list.slice().sort((a,b)=>b.createdAt-a.createdAt).map(it=>renderItem(it,cfg.key,rep)).join('');
      return `<div class="corner">
        <div class="corner-head">
          <div class="corner-glyph" style="background:${cfg.color}">${cfg.glyph}</div>
          <h4>${cfg.label}</h4><div class="corner-count">${list.length}</div>
        </div>
        <div class="add-row">
          <input type="text" class="add-input" data-corner="${cfg.key}" placeholder="추가할 내용 입력 후 Enter">
          <button data-action="addItem" data-corner="${cfg.key}">추가</button>
        </div>
        <div class="item-list">${itemsHtml}</div>
      </div>`;
    }).join('');

    const otBox = `<div class="ot-box">
      <div class="ot-head">✦ OT 붙여넣기 → AI 자동 정리</div>
      <textarea class="ot-textarea" id="otInput" placeholder="선생님이 OT에서 말씀하신 내용을 그대로 붙여넣어봐. 복습·자율학습·팁으로 자동 분류해서 추가해줘."></textarea>
      <div class="ot-row">
        <button data-action="otParse">AI로 정리해서 추가</button>
        <span class="ot-status" id="otStatus">${otStatus}</span>
      </div>
      <div class="ot-note">※ Claude API 키가 필요해 — 우측 상단 <b>⚙ API 키</b>에서 등록해줘. 키는 이 브라우저에만 저장되고 내보내기 백업에는 포함되지 않아.</div>
    </div>`;

    return infoBox + memoBox + `<div class="corners">${corners}</div>` + otBox;
  }

  function renderItem(it, corner, rep){
    let metaHtml='';
    if(corner==='review'){
      const u = urgency(it, rep);
      const ticks = CURVE.map(d=>`<div class="tick" style="left:${Math.min(100,(d/30)*100)}%"></div>`).join('');
      const repsRow = rep ? `<div class="reps-row">
        <button class="reps-btn" data-action="incReps" data-id="${it.id}">+ 풀이</button>
        <span class="reps-count">풀이 ${it.reps||0}회</span>
      </div>` : '';
      metaHtml = `
      <div class="meter">${ticks}<div class="fill" style="width:${u.pct}%;background:${u.color}"></div></div>
      <div class="item-meta">
        <span class="item-date">${fmtDate(it.createdAt)}</span>
        <span class="badge" style="background:${u.color};color:#0B0E14">${u.label}</span>
      </div>
      ${repsRow}
      <div class="item-meta"><span></span><button class="icb ${it.retry?'on':''}" title="재교정 필요 표시" data-action="toggleRetry" data-id="${it.id}">🔁</button></div>`;
    } else {
      metaHtml = `<div class="item-meta"><span class="item-date">${fmtDate(it.createdAt)}</span></div>`;
    }
    return `<div class="item">
      <div class="item-top">
        <div class="item-text">${escapeHtml(it.text)}</div>
        <div class="item-actions">
          <button class="icb ok" title="완료" data-action="completeItem" data-corner="${corner}" data-id="${it.id}">✓</button>
          <button class="icb no" title="삭제" data-action="deleteItem" data-corner="${corner}" data-id="${it.id}">×</button>
        </div>
      </div>
      ${metaHtml}
    </div>`;
  }

  function renderCompletedModal(){
    const td = getTD();
    const groups = CORNERS.map(cfg=>{
      const items = td.completed.filter(c=>c.corner===cfg.key).sort((a,b)=>b.completedAt-a.completedAt);
      if(items.length===0) return '';
      const rows = items.map(it=>`<div class="item">
        <div class="item-top">
          <div class="item-text">${escapeHtml(it.text)}</div>
          <div class="item-actions">
            <button class="icb" title="복원" data-action="restoreItem" data-id="${it.id}">↺</button>
            <button class="icb no" title="영구삭제" data-action="deletePermanent" data-id="${it.id}">×</button>
          </div>
        </div>
        <div class="item-meta"><span class="item-date">완료: ${fmtDate(it.completedAt)}</span></div>
      </div>`).join('');
      return `<div class="modal-group"><h5>${cfg.label}</h5>${rows}</div>`;
    }).join('');
    return `<div class="modal-overlay" data-action="closeModal">
      <div class="modal">
        <div class="modal-head"><h3>완료된 항목 — ${state.teacher} 선생님</h3><button class="iconbtn" data-action="closeModal">닫기</button></div>
        <div class="modal-body">${td.completed.length===0?`<div class="modal-empty">아직 완료한 항목이 없어</div>`:groups}</div>
      </div>
    </div>`;
  }

  function renderSettingsModal(){
    const rotationRows = Object.keys(ROTATIONS).map(rotKey=>{
      const cfg = ROTATIONS[rotKey];
      const override = getRotationOverride(rotKey);
      const dbl = currentDoubleTeacher(rotKey);
      const sgl = dbl===cfg.double ? cfg.single : cfg.double;
      return `<div class="rotation-row">
        <div class="rotation-label">${cfg.label} <span class="rotation-status">— 이번 주 <b>${dbl}</b> 2타임 · ${sgl} 1타임 ${override?'(수동)':'(자동)'}</span></div>
        <div class="rotation-actions">
          <button class="rot-btn ${!override?'active':''}" data-action="setRotation" data-rot="${rotKey}" data-val="">자동</button>
          <button class="rot-btn ${override===cfg.double?'active':''}" data-action="setRotation" data-rot="${rotKey}" data-val="${cfg.double}">${cfg.double} 2타임</button>
          <button class="rot-btn ${override===cfg.single?'active':''}" data-action="setRotation" data-rot="${rotKey}" data-val="${cfg.single}">${cfg.single} 2타임</button>
        </div>
      </div>`;
    }).join('');

    return `<div class="modal-overlay" data-action="closeModal">
      <div class="modal">
        <div class="modal-head"><h3>설정</h3><button class="iconbtn" data-action="closeModal">닫기</button></div>
        <div class="modal-body">
          <div class="modal-group">
            <h5>Claude API 키</h5>
            <div class="settings-row">
              <label>ANTHROPIC API KEY</label>
              <input type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
              <div class="hint">OT 붙여넣기 자동 분류 기능에만 쓰여. console.anthropic.com에서 발급받은 키를 넣어줘. 이 브라우저의 로컬 저장소에만 저장되고, 내보내기 백업 파일에는 포함되지 않아 — 다른 기기에서는 다시 입력해야 해.</div>
            </div>
            <div class="settings-actions">
              <button data-action="saveApiKey">저장</button>
              <button class="danger" data-action="clearApiKey">삭제</button>
            </div>
            <div class="settings-status">${settingsStatus}</div>
          </div>
          <div class="modal-group">
            <h5>선생님 로테이션</h5>
            <div class="hint" style="margin-bottom:10px;">물리학·지구과학은 2타임 담당 선생님이 매주 바뀌어. 방학 등으로 자동 계산이 실제와 어긋나면 여기서 직접 맞춰줘.</div>
            ${rotationRows}
          </div>
        </div>
      </div>
    </div>`;
  }

  /* ============ 유틸 ============ */
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function fmtDate(ts){ const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} 등록`; }

  /* ============ 액션: 코너 항목 ============ */
  function addItem(corner, text){
    text = text.trim(); if(!text) return;
    const td = getTD();
    const item = {id:genId(), text, createdAt:Date.now()};
    if(corner==='review'){ item.reps=0; item.retry=false; }
    td[corner].push(item);
    persist(); render();
  }
  function completeItem(corner, id){
    const td = getTD();
    const idx = td[corner].findIndex(i=>i.id===id); if(idx<0) return;
    const [it] = td[corner].splice(idx,1);
    td.completed.push({...it, corner, completedAt:Date.now()});
    persist(); render();
  }
  function deleteItem(corner, id){
    const td = getTD();
    td[corner] = td[corner].filter(i=>i.id!==id);
    persist(); render();
  }
  function restoreItem(id){
    const td = getTD();
    const idx = td.completed.findIndex(i=>i.id===id); if(idx<0) return;
    const [it] = td.completed.splice(idx,1);
    delete it.completedAt; const corner = it.corner; delete it.corner;
    td[corner].push(it); persist(); render();
  }
  function deletePermanent(id){
    const td = getTD();
    td.completed = td.completed.filter(i=>i.id!==id);
    persist(); render();
  }
  function incReps(id){
    const td = getTD();
    const it = td.review.find(i=>i.id===id); if(!it) return;
    it.reps = (it.reps||0)+1; persist(); render();
  }
  function toggleRetry(id){
    const td = getTD();
    const it = td.review.find(i=>i.id===id); if(!it) return;
    it.retry = !it.retry; persist(); render();
  }

  /* ============ 액션: 과제 ============ */
  function addAssignment(){
    const title = document.getElementById('asgTitle').value.trim();
    const date = document.getElementById('asgDate').value;
    const hours = parseFloat(document.getElementById('asgHours').value);
    const tag = document.getElementById('asgTag').value.trim();
    if(!title || !date || !hours){ return; }
    state.data.assignments.push({id:genId(), title, dueDate:date, estHours:hours, tag, done:false, createdAt:Date.now()});
    persist(); render();
  }
  function toggleAssignment(id){
    const a = state.data.assignments.find(x=>x.id===id); if(!a) return;
    a.done = !a.done; persist(); render();
  }
  function deleteAssignment(id){
    state.data.assignments = state.data.assignments.filter(x=>x.id!==id);
    persist(); render();
  }

  /* ============ 액션: 설정(API 키) ============ */
  function saveApiKey(){
    const input = document.getElementById('apiKeyInput');
    const val = input ? input.value.trim() : '';
    if(!val){ settingsStatus = '키를 입력해줘.'; render(); return; }
    setApiKey(val);
    settingsStatus = '저장했어.';
    render();
  }
  function clearApiKey(){
    setApiKey('');
    settingsStatus = '삭제했어.';
    render();
  }

  /* ============ 액션: OT AI 정리 ============ */
  async function otParse(){
    const ta = document.getElementById('otInput');
    const statusEl = document.getElementById('otStatus');
    const text = ta.value.trim();
    if(!text) return;
    const apiKey = getApiKey();
    if(!apiKey){
      statusEl.textContent = 'API 키가 필요해 — 우측 상단 ⚙ API 키에서 먼저 등록해줘.';
      return;
    }
    statusEl.textContent = '정리 중...';
    try{
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model:'claude-sonnet-5',
          max_tokens:1000,
          messages:[{role:'user', content:
`다음은 학생이 수업 OT에서 들은 내용을 그대로 받아적은 텍스트야. 아래 JSON 형식으로만 출력해(다른 설명, 코드블록 금지):
{"review":["복습해야 할 수업 내용"],"self":["스스로 더 공부해야 할 항목"],"tips":["선생님이 언급한 팁/조언/유의사항"]}
각 배열 항목은 한국어 한 문장으로 간결하게. 해당 없으면 빈 배열.

원문:
${text}`}]
        })
      });
      if(!res.ok){
        const errBody = await res.json().catch(()=>({}));
        throw new Error((errBody.error && errBody.error.message) || `HTTP ${res.status}`);
      }
      const data = await res.json();
      const raw = (data.content||[]).map(b=>b.text||'').join('').trim();
      const clean = raw.replace(/^```json/i,'').replace(/```$/,'').trim();
      const parsed = JSON.parse(clean);
      const td = getTD();
      const t = Date.now();
      (parsed.review||[]).forEach(x=> td.review.push({id:genId(), text:x, createdAt:t, reps:0, retry:false}));
      (parsed.self||[]).forEach(x=> td.self.push({id:genId(), text:x, createdAt:t}));
      (parsed.tips||[]).forEach(x=> td.tips.push({id:genId(), text:x, createdAt:t}));
      otStatus = '';
      persist(); render();
    }catch(err){
      statusEl.textContent = `실패 — ${err.message || '알 수 없는 오류'}. API 키가 맞는지 확인하거나 직접 추가해줘.`;
    }
  }

  /* ============ 내보내기/가져오기 ============ */
  function exportData(){
    const blob = new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`study-organizer-backup-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }
  function importDataFromFile(file){
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        const parsed = JSON.parse(e.target.result);
        const skeleton = buildSkeleton();
        if(parsed.teachers || parsed.assignments || parsed.dailyCapacity){
          state.data = {
            teachers: Object.assign(skeleton.teachers, parsed.teachers||{}),
            assignments: parsed.assignments || [],
            dailyCapacity: parsed.dailyCapacity || 5
          };
        } else {
          // 구버전(평평한 teacher map) 백업 호환
          state.data = { teachers: Object.assign(skeleton.teachers, parsed), assignments:[], dailyCapacity:5 };
        }
        persist(); render();
      }catch(err){ alert('파일을 읽지 못했어. JSON 형식이 맞는지 확인해줘.'); }
    };
    reader.readAsText(file);
  }

  /* ============ 이벤트 위임 ============ */
  app.addEventListener('click', function(e){
    const el = e.target.closest('[data-action]'); if(!el) return;
    // 모달 배경(overlay) 클릭으로만 닫히게 하고, 모달 내부 클릭이 버블링돼서
    // 배경의 data-action에 잡히는 건 막는다 (내부 버튼은 자기 자신의 data-action으로 이미 처리됨)
    if(el.dataset.action==='closeModal' && el.classList.contains('modal-overlay') && e.target!==el) return;
    switch(el.dataset.action){
      case 'goHome': state.view='home'; state.cat=null; state.subj=null; state.teacher=null; state.modal=null; render(); break;
      case 'goAssignments': state.view='assignments'; state.modal=null; render(); break;
      case 'goTimetable': state.view='timetable'; state.modal=null; render(); break;
      case 'selectCat': state.view='teacher'; state.cat=el.dataset.cat; state.subj=null; state.teacher=null; state.modal=null; render(); break;
      case 'selectSubj': state.view='teacher'; state.cat=el.dataset.cat; state.subj=el.dataset.subj; state.teacher=null; state.modal=null; render(); break;
      case 'selectTeacher': state.view='teacher'; state.cat=el.dataset.cat; state.subj=el.dataset.subj; state.teacher=el.dataset.teacher; state.modal=null; render(); break;
      case 'addItem': { const input = el.parentElement.querySelector('.add-input'); addItem(el.dataset.corner, input.value); break; }
      case 'completeItem': completeItem(el.dataset.corner, el.dataset.id); break;
      case 'deleteItem': deleteItem(el.dataset.corner, el.dataset.id); break;
      case 'restoreItem': restoreItem(el.dataset.id); break;
      case 'deletePermanent': deletePermanent(el.dataset.id); break;
      case 'incReps': incReps(el.dataset.id); break;
      case 'toggleRetry': toggleRetry(el.dataset.id); break;
      case 'openCompleted': state.modal='completed'; render(); break;
      case 'openSettings': settingsStatus=''; state.modal='settings'; render(); break;
      case 'closeModal': state.modal=null; render(); break;
      case 'exportData': exportData(); break;
      case 'importTrigger': document.getElementById('importFile').click(); break;
      case 'addAssignment': addAssignment(); break;
      case 'toggleAssignment': toggleAssignment(el.dataset.id); break;
      case 'deleteAssignment': deleteAssignment(el.dataset.id); break;
      case 'otParse': otParse(); break;
      case 'saveApiKey': saveApiKey(); break;
      case 'clearApiKey': clearApiKey(); break;
      case 'setRotation': setRotationOverride(el.dataset.rot, el.dataset.val || null); render(); break;
    }
  });

  app.addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.classList.contains('add-input')){
      addItem(e.target.dataset.corner, e.target.value);
    }
  });

  let debTimer = null;
  app.addEventListener('input', function(e){
    if(e.target.dataset.role==='memo' || e.target.dataset.role==='info'){
      const role = e.target.dataset.role;
      const c=e.target.dataset.cat, s=e.target.dataset.subj, t=e.target.dataset.teacher, val=e.target.value;
      clearTimeout(debTimer);
      debTimer = setTimeout(()=>{ state.data.teachers[tKey(c,s,t)][role] = val; persist(); }, 400);
    } else if(e.target.dataset.role==='capacity'){
      const val = parseFloat(e.target.value)||5;
      clearTimeout(debTimer);
      debTimer = setTimeout(()=>{ state.data.dailyCapacity = val; persist(); render(); }, 500);
    }
  });

  document.getElementById('importFile').addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]) importDataFromFile(e.target.files[0]);
    e.target.value = '';
  });

  /* ============ 초기화 ============ */
  (function init(){
    const saved = loadData();
    if(saved){
      const skeleton = buildSkeleton();
      if(saved.teachers || saved.assignments || saved.dailyCapacity){
        state.data = {
          teachers: Object.assign(skeleton.teachers, saved.teachers||{}),
          assignments: saved.assignments || [],
          dailyCapacity: saved.dailyCapacity || 5
        };
      } else {
        state.data = { teachers: Object.assign(skeleton.teachers, saved), assignments:[], dailyCapacity:5 };
      }
    }
    render();
  })();

})();
</script>
</body>
</html>
