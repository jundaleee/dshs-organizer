<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Study Organizer</title>
<meta name="theme-color" content="#0B0B0E">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Organizer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    --bg:#0B0B0E;
    --glass:rgba(255,255,255,.08); --glass-strong:rgba(255,255,255,.15); --glass-press:rgba(255,255,255,.2);
    --border:rgba(255,255,255,.13); --border-strong:rgba(255,255,255,.22); --border-hi:rgba(255,255,255,.36);
    --text:#FFFFFF; --text-2:rgba(255,255,255,.76); --text-3:rgba(255,255,255,.52);
    --blue:#0A84FF; --red:#FF453A; --green:#30D158; --orange:#FF9F0A; --purple:#BF5AF2; --pink:#FF375F; --indigo:#5E5CE6; --teal:#64D2FF;
    --accent:var(--blue);
    --danger:var(--red); --good:var(--green);
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Pretendard Variable','Pretendard','Malgun Gothic',sans-serif;
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --blur:26px;
    --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 620px at 12% -8%, rgba(10,132,255,.20), transparent 60%),
      radial-gradient(ellipse 780px 680px at 105% 8%, rgba(191,90,242,.14), transparent 55%),
      radial-gradient(ellipse 700px 640px at 25% 108%, rgba(255,69,58,.08), transparent 58%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1;
  }
  ::selection{background:rgba(10,132,255,.35);}
  button,input,textarea{font-family:inherit;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}
  button{cursor:pointer;}

  /* ---- glass utility ---- */
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);
    backdrop-filter:blur(var(--blur)) saturate(1.7);
    border:1px solid var(--border);
    border-top-color:var(--border-hi);
  }

  /* ---- shell / nav ---- */
  .app-shell{display:flex;min-height:100vh;align-items:stretch;}
  .sidebar{width:236px;flex-shrink:0;margin:14px 0 14px 14px;padding:20px 12px;border-radius:var(--r-lg);position:sticky;top:14px;height:calc(100vh - 28px);overflow-y:auto;display:flex;flex-direction:column;}
  .sidebar-brand{padding:4px 10px 22px;display:flex;align-items:center;gap:9px;cursor:pointer;}
  .sidebar-brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--purple));flex-shrink:0;}
  .sidebar-brand b{font-size:14.5px;font-weight:600;letter-spacing:-.01em;}
  .nav-list{display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:11px;font-size:14px;color:var(--text-2);background:none;border:none;text-align:left;width:100%;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);position:relative;}
  .nav-icon{width:27px;height:27px;border-radius:8px;background:var(--nc,var(--blue));display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);}
  .nav-icon svg{opacity:1;}
  .nav-item:hover{background:var(--glass);color:var(--text);}
  .nav-item.active{background:var(--glass-strong);color:var(--text);font-weight:600;}
  .nav-item .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);}

  .bottom-nav{display:none;}
  .main{flex:1;min-width:0;}
  .main-inner{max-width:720px;margin:0 auto;padding:40px 32px 110px;}

  .topbar-mini{display:flex;justify-content:flex-end;margin-bottom:-8px;}
  .iconbtn{background:var(--glass);border:1px solid var(--border);color:var(--text-2);font-size:12.5px;padding:7px 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px;transition:all var(--dur) var(--ease);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));}
  .iconbtn:hover{color:var(--text);border-color:var(--border-strong);background:var(--glass-strong);}

  @media(max-width:979px){
    .sidebar{width:64px;padding:20px 8px;}
    .sidebar-brand{justify-content:center;padding:4px 0 20px;}
    .sidebar-brand b{display:none;}
    .nav-item{justify-content:center;padding:8px;}
    .nav-item .label{display:none;}
    .main-inner{padding:34px 22px 110px;}
  }
  @media(max-width:639px){
    .app-shell{display:block;}
    .sidebar{display:none;}
    .bottom-nav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:var(--r-lg);padding:8px 6px;justify-content:space-around;z-index:60;box-shadow:0 12px 32px rgba(0,0,0,.45);}
    .bottom-nav .nav-item{flex-direction:column;gap:3px;font-size:9.5px;padding:5px 4px;border-radius:12px;flex:1;min-width:0;}
    .bottom-nav .nav-icon{width:26px;height:26px;}
    .bottom-nav .nav-item .label{display:block;font-size:9.5px;}
    .main-inner{padding:24px 16px 110px;max-width:100%;}
  }

  /* ---- page header ---- */
  .page-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:30px;flex-wrap:wrap;}
  .page-head h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0;}
  .page-head .sub{font-size:13px;color:var(--text-3);}

  .home-date{font-size:13px;color:var(--text-3);margin-bottom:6px;}
  .home-greeting{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0 0 40px;}

  /* ---- home: 과목별 박스 (실제 할 일 텍스트 + 선생님 이름이 잘 보이도록 큼직하게) ---- */
  .box-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:24px;align-items:start;
  }
  .box-drag{position:relative;touch-action:none;will-change:transform;}
  .box-drag.dragging{z-index:5;}
  .box-float{
    animation:boxFloat var(--float-dur,7s) ease-in-out infinite;
    animation-delay:var(--float-delay,0s);
    will-change:transform;
  }
  .box-drag.dragging .box-float{animation-play-state:paused;}
  @keyframes boxFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-5px);}
  }
  @keyframes boxDrop{
    0%{transform:scale(1);} 35%{transform:scale(1.04);} 65%{transform:scale(.98);} 100%{transform:scale(1);}
  }
  .box-cell{
    min-height:150px;display:flex;flex-direction:column;
    background:var(--glass);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(1.8);
    backdrop-filter:blur(var(--blur)) saturate(1.8);
    border:1px solid var(--border);border-top-color:var(--border-hi);
    border-radius:20px;padding:16px 18px 12px;
    position:relative;overflow:hidden;color:var(--text);isolation:isolate;
    cursor:grab;transition:box-shadow var(--dur) var(--ease);
  }
  .box-cell button{cursor:pointer;}
  .box-drag.dragging .box-cell{cursor:grabbing;box-shadow:0 18px 40px rgba(0,0,0,.45);}
  .box-cell.drop-bounce{animation:boxDrop .34s ease;}
  .box-cell::after{content:'';position:absolute;top:-60%;right:-40%;width:85%;height:150%;background:var(--qg);opacity:.30;filter:blur(34px);border-radius:50%;pointer-events:none;z-index:0;}
  .box-head{position:relative;z-index:1;display:block;width:100%;background:none;border:none;padding:4px 6px;margin:-4px -6px 10px;text-align:left;color:var(--text);border-radius:10px;transition:background var(--dur) var(--ease);}
  .box-head:hover{background:var(--glass-strong);}
  .box-label{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.25;}
  .box-meta{font-size:11px;color:var(--text-3);margin-top:2px;}
  .box-tasks{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;}
  .box-task-row{display:flex;align-items:flex-start;gap:9px;min-width:0;cursor:grab;border-radius:7px;transition:opacity var(--dur) var(--ease);}
  .box-task-row.dragging-task{opacity:.35;}
  .box-task-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);flex-shrink:0;margin-top:1px;background:var(--glass);display:flex;align-items:center;justify-content:center;padding:0;transition:border-color var(--dur) var(--ease);}
  .box-task-check svg{width:11px;height:11px;opacity:0;transform:scale(.4);}
  .box-task-check:hover{border-color:var(--qc,var(--blue));}
  .box-task-main{min-width:0;flex:1;}
  .box-task-text{font-size:12.5px;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .box-task-tag{font-size:10px;color:var(--text-3);margin-top:1px;}
  .box-empty{font-size:11px;color:var(--text-3);}
  @media(max-width:639px){
    .box-grid{grid-template-columns:1fr;}
  }

  /* ---- 뽀모도로 타이머 ---- */
  .pomo-card{
    display:flex;align-items:center;gap:18px;position:relative;
    background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);backdrop-filter:blur(var(--blur)) saturate(1.7);
    border:1px solid var(--border);border-top-color:var(--border-hi);border-radius:var(--r-lg);
    padding:16px 20px;margin-bottom:28px;flex-wrap:wrap;
    transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
  }
  .pomo-card.drag-over{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.35) inset;}
  .pomo-drop-hint{
    position:absolute;inset:0;border-radius:inherit;z-index:5;
    display:flex;align-items:center;justify-content:center;
    background:rgba(10,132,255,.22);border:2px dashed var(--blue);
    color:#fff;font-weight:700;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .12s ease;
  }
  .pomo-card.drag-over .pomo-drop-hint{opacity:1;}
  @keyframes pomoLinked{0%{box-shadow:0 0 0 0 rgba(48,209,88,.55);}100%{box-shadow:0 0 0 16px rgba(48,209,88,0);}}
  .pomo-card.linked-flash{animation:pomoLinked .55s ease;}
  .pomo-ring{
    width:76px;height:76px;border-radius:50%;flex-shrink:0;
    background:conic-gradient(var(--pomo-c, var(--blue)) var(--deg,0deg), rgba(255,255,255,.12) 0);
    display:flex;align-items:center;justify-content:center;position:relative;transition:background .3s linear;
  }
  .pomo-ring.done{animation:pomoPulse 1s ease-in-out infinite;}
  @keyframes pomoPulse{0%,100%{box-shadow:0 0 0 0 rgba(48,209,88,.5);}50%{box-shadow:0 0 0 8px rgba(48,209,88,0);}}
  .pomo-ring::before{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--bg);}
  .pomo-display{position:relative;z-index:1;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
  .pomo-body{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px;}
  .pomo-select{width:100%;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:7px 13px;font-size:12.5px;}
  .pomo-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .pomo-preset{background:var(--glass);border:1px solid var(--border);color:var(--text-2);border-radius:var(--r-pill);padding:5px 12px;font-size:12px;font-weight:600;}
  .pomo-preset.active{background:var(--blue);border-color:var(--blue);color:#fff;}

  .section{margin-bottom:36px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px;}
  .section-title{font-size:12.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.055em;}
  .section-link{font-size:12.5px;color:var(--text-3);background:none;border:none;padding:0;}
  .section-link:hover{color:var(--text);}

  .empty{color:var(--text-3);font-size:13.5px;padding:18px 0;}

  .panel{border-radius:var(--r-md);padding:6px 16px;}

  /* ---- task rows ---- */
  .task-row{display:flex;align-items:flex-start;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);}
  .task-row:last-child{border-bottom:none;}
  .task-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);flex-shrink:0;margin-top:1px;background:var(--glass);display:flex;align-items:center;justify-content:center;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease);padding:0;}
  .task-check:hover{border-color:var(--blue);}
  .task-check svg{opacity:0;transform:scale(.4);transition:all var(--dur) var(--ease);}
  .task-row.done .task-check{background:var(--blue);border-color:var(--blue);}
  .task-row.done .task-check svg{opacity:1;transform:scale(1);}
  .task-body{flex:1;min-width:0;}
  .task-tag{font-size:12px;color:var(--text-3);margin-bottom:2px;}
  .task-text{font-size:14.5px;line-height:1.5;transition:color var(--dur) var(--ease);word-break:break-word;}
  .task-row.done .task-text{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--border-strong);}
  .task-badge{font-size:11px;color:var(--text-3);flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;}
  .task-del{width:22px;height:22px;border-radius:50%;border:none;background:none;color:var(--text-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--dur) var(--ease);}
  .task-row:hover .task-del{opacity:1;}
  .task-del:hover{color:var(--red);}

  /* ---- assignment rows ---- */
  .asg-row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--border);}
  .asg-row:last-child{border-bottom:none;}
  .asg-row.done{opacity:.4;}
  .asg-check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border-strong);flex-shrink:0;background:var(--glass);display:flex;align-items:center;justify-content:center;padding:0;transition:all var(--dur) var(--ease);}
  .asg-row.done .asg-check{background:var(--green);border-color:var(--green);}
  .asg-check svg{opacity:0;transform:scale(.4);transition:all var(--dur) var(--ease);}
  .asg-row.done .asg-check svg{opacity:1;transform:scale(1);}
  .asg-main{flex:1;min-width:0;}
  .asg-tag{font-size:12px;color:var(--text-3);}
  .asg-title{font-size:14.5px;margin-top:1px;word-break:break-word;}
  .asg-row.done .asg-title{text-decoration:line-through;text-decoration-color:var(--border-strong);}
  .asg-sub{font-size:12px;color:var(--text-3);margin-top:3px;}
  .asg-due{font-size:12.5px;color:var(--text-2);flex-shrink:0;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .asg-due.urgent{color:var(--orange);font-weight:600;}
  .asg-due.overdue{color:var(--red);font-weight:600;}
  .asg-del{width:24px;height:24px;border-radius:50%;border:none;background:none;color:var(--text-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--dur);}
  .asg-row:hover .asg-del{opacity:1;}
  .asg-del:hover{color:var(--red);}
  .asg-hours-input{width:100px;background:var(--glass);border:1px solid var(--orange);border-radius:var(--r-pill);color:var(--text);padding:6px 12px;font-size:12px;text-align:center;}
  .asg-priority{display:flex;align-items:center;gap:6px;margin-top:7px;}
  .asg-priority-label{font-size:11px;color:var(--text-3);}
  .pri-btn{background:var(--glass);border:1px solid var(--border);color:var(--text-3);border-radius:var(--r-pill);padding:3px 11px;font-size:11px;font-weight:600;}
  .pri-btn.active[data-val="high"]{background:var(--red);border-color:var(--red);color:#fff;}
  .pri-btn.active[data-val="mid"]{background:var(--blue);border-color:var(--blue);color:#fff;}
  .pri-btn.active[data-val="low"]{background:rgba(255,255,255,.22);border-color:var(--border-strong);color:var(--text);}

  .cap-line{font-size:13px;color:var(--text-2);padding:10px 4px 18px;border-bottom:1px solid var(--border);margin-bottom:6px;}
  .cap-line b{color:var(--text);font-weight:600;}
  .cap-line.over{color:var(--red);}
  .cap-line.over b{color:var(--red);}
  .sync-health{font-size:12px;color:var(--text-3);padding:0 0 14px;}
  .sync-health.warn{color:var(--orange);font-weight:600;}

  .balance-warn{font-size:12.5px;color:var(--orange);font-weight:600;line-height:1.55;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--r-md);padding:11px 15px;margin-bottom:28px;}

  /* ---- D-day 역산 타임라인 ---- */
  .dday-timeline{position:relative;height:92px;margin:4px 14px 28px;}
  .dday-track{position:absolute;left:0;right:0;bottom:26px;height:2px;background:var(--border);}
  .dday-today{position:absolute;bottom:20px;width:2px;height:14px;background:var(--blue);box-shadow:0 0 8px rgba(10,132,255,.7);}
  .dday-cluster{position:absolute;bottom:26px;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;transform:translateX(-50%);cursor:default;}
  .dday-dot{width:9px;height:9px;border-radius:50%;background:var(--orange);flex-shrink:0;border:1.5px solid var(--bg);box-shadow:0 0 0 1px var(--border);}
  .dday-dot.overdue{background:var(--red);}
  .dday-count{font-size:9.5px;color:var(--text-3);}
  .dday-label{position:absolute;bottom:0;font-size:10.5px;color:var(--text-3);white-space:nowrap;}
  .dday-label.start{left:0;color:var(--blue);font-weight:600;}
  .dday-label.end{right:0;}

  .asg-form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--border);align-items:center;}
  .asg-form input{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:9px 14px;font-size:13px;}
  .asg-form input.title{flex:2;min-width:180px;}
  .asg-form input.date{flex:1;min-width:130px;}
  .asg-form input.hours{width:88px;}
  .asg-form input.tag{flex:1;min-width:110px;}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:filter var(--dur) var(--ease),transform var(--dur) var(--ease);}
  .btn:hover{filter:brightness(1.12);}
  .btn:active{transform:scale(.97);}
  .btn-outline{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border-strong);color:var(--text);border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:all var(--dur) var(--ease);}
  .btn-outline:hover{background:var(--glass-strong);}
  .btn-outline:active{transform:scale(.97);}
  .btn-danger{background:var(--red);color:#fff;border:none;border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:filter var(--dur) var(--ease);}
  .btn-danger:hover{filter:brightness(1.12);}

  /* ---- schedule ---- */
  .sched-row{display:flex;align-items:center;gap:16px;padding:10px 6px;border-bottom:1px solid var(--border);font-size:14px;border-radius:10px;}
  .sched-row:last-child{border-bottom:none;}
  .sched-row .p{width:46px;color:var(--text-3);font-size:12.5px;flex-shrink:0;}
  .sched-row .s-main{flex:1;min-width:0;}
  .sched-row .s-teacher{font-size:12.5px;color:var(--text-3);margin-top:1px;}
  .sched-row.today{background:rgba(10,132,255,.14);padding-left:10px;padding-right:10px;margin:0 -10px;border-bottom:none;}
  .sched-row.today .s-main{font-weight:600;}
  .sched-row.clickable{cursor:pointer;transition:background var(--dur) var(--ease);}
  .sched-row.clickable:hover{background:var(--glass);padding-left:10px;padding-right:10px;margin:0 -10px;border-bottom-color:transparent;}
  .sched-row.clickable:hover .sched-add{opacity:1;}

      {p:2,subject:"국어",teacher:"정진실",room:"705호"},
      {p:3,subject:"국어",teacher:"정진실",room:"705호"},
      {p:4,subject:"지구과학",rot:'sci|earth',role:'single',room:"지학3실"},
      {p:5,subject:"수학",teacher:"손중록",room:"609호"},
      {p:6,subject:"수학",teacher:"손중록",room:"609호"},
      {p:7,label:"창의"},{p:8,label:"체험"},{p:9,label:"활동"}
    ],
    wed:[
      {p:1,subject:"사회",teacher:"김현심",room:"703호"},
      {p:2,subject:"수학",teacher:"이상규",room:"604호"},

    ],
    thu:[
      {p:1,subject:"정보과학",teacher:"윤수진",room:"정보실"},

      {p:5,subject:"지구과학",rot:'sci|earth',role:'double',room:"지학2실"},
      {p:6,subject:"지구과학",rot:'sci|earth',role:'double',room:"지학2실"},
      {p:7,subject:"화학",teacher:"이승재",room:"원격강의실"}
    ]
  };
  const DAYKEY = {1:'mon',2:'tue',3:'wed',4:'thu',5:'fri'};
  const DAYLABEL = {mon:'월',tue:'화',wed:'수',thu:'목',fri:'금'};
  const DAYNAME = ['일','월','화','수','목','금','토'];

  /* ============ 선생님 주간 로테이션 ============ */
  const ROTATION_REFERENCE_MONDAY = new Date(2026,7,17); // 2026-08-17(월) 기준 시간표
  const ROTATIONS = {
    'sci|phys':  { double:'박준홍', single:'김정석', label:'물리학' },
    'sci|earth': { double:'이윤아', single:'배태윤', label:'지구과학' }
  };
  const ROTATION_OVERRIDE_KEY = 'organizer-rotation-overrides';
  function mondayOf(d){
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const day = x.getDay();
    x.setDate(x.getDate() + (day===0 ? -6 : 1-day));
    return x;
  }
  function weekIsSwappedFor(date){
    const weeks = Math.round((mondayOf(date).getTime() - mondayOf(ROTATION_REFERENCE_MONDAY).getTime()) / (7*86400000));
    return ((weeks % 2) + 2) % 2 === 1;
  }
  function getRotationOverrides(){
    try{ return JSON.parse(localStorage.getItem(ROTATION_OVERRIDE_KEY) || '{}'); }catch(e){ return {}; }
  }
  function getRotationOverride(rotKey){ return getRotationOverrides()[rotKey] || null; }
  function setRotationOverride(rotKey, teacherOrNull){
    const o = getRotationOverrides();
    if(teacherOrNull) o[rotKey] = teacherOrNull; else delete o[rotKey];
    try{ localStorage.setItem(ROTATION_OVERRIDE_KEY, JSON.stringify(o)); }catch(e){}
  }
  function currentDoubleTeacherFor(rotKey, date){
    const cfg = ROTATIONS[rotKey]; if(!cfg) return null;
    const override = getRotationOverride(rotKey);
    if(override) return override;
    return weekIsSwappedFor(date) ? cfg.single : cfg.double;
  }
  function currentDoubleTeacher(rotKey){ return currentDoubleTeacherFor(rotKey, now); }
  function resolveRotTeacherFor(rotKey, role, date){
    const cfg = ROTATIONS[rotKey]; if(!cfg) return null;
    const dbl = currentDoubleTeacherFor(rotKey, date);
    if(role==='double') return dbl;
    return dbl===cfg.double ? cfg.single : cfg.double;
  }
  function entryTeacherFor(entry, date){
    if(entry.teacher) return entry.teacher;
    if(entry.rot && entry.role) return resolveRotTeacherFor(entry.rot, entry.role, date);
    return null;
  }
  function entryTeacher(entry){ return entryTeacherFor(entry, now); }

  const CORNERS = [
    {key:'review', label:'수업 복습'},
    {key:'self',   label:'자율 학습'},
    {key:'tips',   label:'꿀팁'}
  ];

  const TEACHER_LIST = [];
  Object.keys(CATS).forEach(c=>{
    Object.keys(CATS[c].subjects).forEach(s=>{
      CATS[c].subjects[s].teachers.forEach(t=>{
        TEACHER_LIST.push({cat:c, subj:s, teacher:t, key:c+'|'+s+'|'+t, catLabel:CATS[c].label, subjLabel:CATS[c].subjects[s].label});
      });
    });
  });

  function tKey(c,s,t){ return c+'|'+s+'|'+t; }
  function teacherKeyByName(name){ const x = TEACHER_LIST.find(t=>t.teacher===name); return x?x.key:null; }
  function splitTKey(key){ const [cat,subj,teacher]=key.split('|'); return {cat,subj,teacher}; }
  function defaultTeacherData(){ return {review:[],self:[],tips:[],completed:[],memo:'',info:''}; }

  function urgency(item, repetitionMode){
    const days = Math.max(0, Math.floor((Date.now()-item.createdAt)/86400000));
    let stage;
    if(days<1) stage=0; else if(days<3) stage=1; else if(days<7) stage=2; else if(days<14) stage=3; else if(days<30) stage=4; else stage=5;
    let suffix='';
    if(repetitionMode && item.reps>0){
      const reduce = Math.floor(item.reps/2);
      if(reduce>0){ stage = Math.max(0, stage-reduce); suffix = ` · 풀이 ${item.reps}회 반영`; }
    }
    if(item.retry){ stage = 5; suffix = ' · 재교정 필요'; }
    const pct = Math.min(100, (days/30)*100);
    return {days, stage, label:`D+${days} · ${STAGE_LABELS[stage]}${suffix}`, pct};
  }

  const BOXES = [

  // 박스마다 살짝 다르게 떠다니도록 key 기반으로 고정된 값을 뽑음 (매 렌더마다 안 바뀌게)
  function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }
  function boxFloatVars(key){
    const h = hashStr(key);
    const dur = 6.5 + (h%30)/10;
    const delay = -((h>>3)%100)/100*dur;
    const rot = (0.5 + ((h>>5)%6)/10) * (h%2 ? 1 : -1);
    return {dur, delay, rot};
  }

  // 과목별 학습 시간을 재는 기능이 없어서(체크 여부만 있음), "이번 주 완료 개수"를 시간 대신 프록시로 씀.

  function weekBoxCompletionCounts(){
    const weekStart = mondayOf(now).getTime();
    const counts = {};
    BOXES.forEach(b=>{ counts[b.key] = 0; });
    TEACHER_LIST.forEach(x=>{
      const box = BOXES.find(b=>b.cat===x.cat && (!b.subj || b.subj===x.subj));
      if(!box) return;
      const td = state.data.teachers[x.key];
      td.completed.forEach(it=>{
        if((it.corner==='review'||it.corner==='self') && it.completedAt>=weekStart) counts[box.key]++;
      });
    });
    (state.data.personal?.completed||[]).forEach(it=>{
      if(BOX_KEYS.has(it.boxKey) && it.completedAt>=weekStart) counts[it.boxKey]++;
    });
    return counts;
  }
  function renderBalanceWarning(){

    const neglected = BOXES.filter(b=>counts[b.key]===0);

  /* ---- 뽀모도로: 정해진 시간 안에 과제 하나를 끝내는 용도 ---- */
  const pomo = { running:false, remaining:25*60, total:25*60, target:null, intervalId:null };
  function pomoTargetLabel(){
    if(!pomo.target) return null;
    const t = pomo.target;
    if(t.type==='assignment'){
      const a = state.data.assignments.find(x=>x.id===t.id);
      return a ? a.title : null;
    }
    if(t.type==='personal'){
      const p = (state.data.personal?.tasks||[]).find(x=>x.id===t.id);
      return p ? p.text : null;
    }
    if(t.type==='teacher'){
      const td = state.data.teachers[t.key];
      const item = td && td[t.corner] && td[t.corner].find(x=>x.id===t.id);
      return item ? item.text : null;
    }
    return null;
  }
  function pomoCompleteLinked(){
    if(!pomo.target) return;
    const t = pomo.target;
    if(t.type==='assignment') toggleAssignment(t.id);
    else if(t.type==='personal') completePersonalTask(t.id);
    else if(t.type==='teacher') completeItem(t.key, t.corner, t.id);
    pomo.target = null;
    render();
  }
  function pomoFormat(sec){
    sec = Math.max(0, sec);
    const m = Math.floor(sec/60), s = sec%60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  function pomoTick(){
    pomo.remaining--;
    if(pomo.remaining<=0){
      pomo.remaining = 0;
      clearInterval(pomo.intervalId);
      pomo.running = false;
      render();
      return;
    }
    const dEl = document.getElementById('pomoDisplay');
    if(dEl) dEl.textContent = pomoFormat(pomo.remaining);
    const ring = document.getElementById('pomoRing');
    if(ring) ring.style.setProperty('--deg', ((1-pomo.remaining/pomo.total)*360)+'deg');
  }
  function pomoStart(){
    if(pomo.running) return;
    if(pomo.remaining<=0) pomo.remaining = pomo.total;
    pomo.running = true;
    pomo.intervalId = setInterval(pomoTick, 1000);
    render();
  }
  function pomoPause(){
    clearInterval(pomo.intervalId);
    pomo.running = false;
    render();
  }
  function pomoReset(){
    clearInterval(pomo.intervalId);
    pomo.running = false;
    pomo.remaining = pomo.total;
    render();
  }
  function pomoSetDuration(min){
    clearInterval(pomo.intervalId);
    pomo.running = false;
    pomo.total = min*60;
    pomo.remaining = pomo.total;
    render();
  }
  function renderPomoCard(){
    const pct = pomo.total>0 ? Math.max(0, Math.min(1, 1-pomo.remaining/pomo.total)) : 0;
    const done = pomo.remaining<=0 && pomo.total>0;

  /* ---- Assignments ---- */
  // 미완료 과제들의 예상 시간을 오늘~마감일에 균등 분배해서 날짜별로 쌓고, 가장 빡센 날을 찾음
  // (단순 평균은 과제가 여러 날에 흩어져 있든 하루에 몰려있든 똑같이 보여서 crunch를 못 잡음)
  function peakDailyLoad(assignments){
    const buckets = {};
    assignments.forEach(a=>{
      if(a.done || typeof a.estHours!=='number') return;
      const dLeft = Math.max(1, Math.round((new Date(a.dueDate+'T00:00:00').getTime()-todayMid)/86400000));
      const perDay = a.estHours/dLeft;
      for(let i=0;i<dLeft;i++){
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+i);
        const key = toISODate(d);
        buckets[key] = (buckets[key]||0) + perDay;
      }
    });
    let peakDate=null, peakHours=0;
    Object.keys(buckets).forEach(k=>{ if(buckets[k]>peakHours){ peakHours=buckets[k]; peakDate=k; } });
    return {peakDate, peakHours};
  }
  function fmtShortDate(iso){
    const d = new Date(iso+'T00:00:00');
    return `${MONTHNAME[d.getMonth()]} ${d.getDate()}일(${DAYNAME[d.getDay()]})`;
  }

  // 마감일들을 가로 타임라인에 흩뿌려서 특정 날짜에 몰려있는지 한눈에 보이게 함
  // (peakDailyLoad와 같은 문제의식: 합계/평균만으로는 클러스터링이 안 보임)
  function renderDdayTimeline(assignments){
    const pending = assignments.filter(a=>!a.done);
    if(pending.length===0) return '';
    const dueTimes = pending.map(a=>new Date(a.dueDate+'T00:00:00').getTime());
    let maxDue = Math.max.apply(null, dueTimes.concat([todayMid]));
    const minSpan = 7*86400000; // 폭이 너무 좁으면(전부 임박) 점들이 뭉개지니 최소 폭 보장
    if(maxDue - todayMid < minSpan) maxDue = todayMid + minSpan;
    const span = maxDue - todayMid;

    const byDate = {};
    pending.forEach(a=>{ (byDate[a.dueDate] = byDate[a.dueDate] || []).push(a); });

    const clusters = Object.keys(byDate).map(dateStr=>{
      const dueMs = new Date(dateStr+'T00:00:00').getTime();
      const overdue = dueMs < todayMid;
      const pct = Math.max(0, Math.min(100, ((dueMs-todayMid)/span)*100));
      const items = byDate[dateStr];
      const shown = items.slice(0,4);
      const dotsHtml = shown.map(a=>`<div class="dday-dot ${overdue?'overdue':''}" title="${escapeHtml(fmtShortDate(dateStr))} · ${escapeHtml(a.title)}"></div>`).join('');
      const moreHtml = items.length>4 ? `<div class="dday-count">+${items.length-4}</div>` : '';
      return `<div class="dday-cluster" style="left:${pct}%;" title="${escapeHtml(fmtShortDate(dateStr))} · 과제 ${items.length}개">${dotsHtml}${moreHtml}</div>`;
    }).join('');

    return `<div class="dday-timeline">
      <div class="dday-track"></div>
      <div class="dday-today" style="left:0%;"></div>
      ${clusters}
      <div class="dday-label start">오늘</div>
      <div class="dday-label end">${fmtShortDate(toISODate(new Date(maxDue)))}</div>
    </div>`;
  }

  function renderSchedulePage(){
    const days=['mon','tue','wed','thu','fri'];
    let maxP=0; days.forEach(d=>TIMETABLE[d].forEach(p=>{ if(p.p>maxP) maxP=p.p; }));

    const gridCells = [];
    for(let p=1;p<=maxP;p++){
      gridCells.push(`<div class="wcell" style="display:flex;align-items:center;color:var(--text-3);font-size:12px;">${p}교시</div>`);
      days.forEach(d=>{
        const e = TIMETABLE[d].find(x=>x.p===p);
        const todayCls = d===todayKey?'today':'';
        if(!e){ gridCells.push(`<div class="wcell empty ${todayCls}">—</div>`); return; }
        const label = e.subject||e.label;
        const t = entryTeacher(e);
        const tk = t ? teacherKeyByName(t) : null;
        gridCells.push(`<div class="wcell ${todayCls} ${tk?'clickable':''}" ${tk?`data-action="quickAdd" data-key="${tk}"`:''}><div class="subj">${label}</div>${t?`<div class="who">${t}</div>`:''}</div>`);
      });
    }
    const grid = `<div class="week-grid" style="grid-template-columns:52px repeat(5,1fr);">
      <div class="wcell whead"></div>
      ${days.map(d=>`<div class="wcell whead ${d===todayKey?'today':''}">${DAYLABEL[d]}</div>`).join('')}
      ${gridCells.join('')}
    </div>`;

    const stack = `<div class="week-stack">${days.map(d=>{
      const rows = TIMETABLE[d].map(e=>{
        const label = e.subject||e.label;
        const t = entryTeacher(e);

  /* ============ 유틸 ============ */
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function fmtDate(ts){ const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()}`; }

  /* ============ 액션: 코너 항목 ============ */
  function addItem(key, corner, text){
    text = text.trim(); if(!text) return;
    const td = getTD(key);
    const item = {id:genId(), text, createdAt:Date.now()};
    if(corner==='review'){ item.reps=0; item.retry=false; }
    td[corner].push(item);
    persist(); render();
  }
  function completeItem(key, corner, id){
    const td = getTD(key);
    const idx = td[corner].findIndex(i=>i.id===id); if(idx<0) return;
    const [it] = td[corner].splice(idx,1);
    td.completed.push({...it, corner, completedAt:Date.now()});
    persist(); render();
  }
  function deleteItem(key, corner, id){
    const td = getTD(key);
    td[corner] = td[corner].filter(i=>i.id!==id);
    persist(); render();
  }
  function restoreItem(key, id){
    const td = getTD(key);
    const idx = td.completed.findIndex(i=>i.id===id); if(idx<0) return;
    const [it] = td.completed.splice(idx,1);
    delete it.completedAt; const corner = it.corner; delete it.corner;
    td[corner].push(it); persist(); render();
  }
  function deletePermanent(key, id){
    const td = getTD(key);
    td.completed = td.completed.filter(i=>i.id!==id);
    persist(); render();
  }
  function incReps(key, id){
    const td = getTD(key);
    const it = td.review.find(i=>i.id===id); if(!it) return;
    it.reps = (it.reps||0)+1; persist(); render();
  }
  function toggleRetry(key, id){
    const td = getTD(key);
    const it = td.review.find(i=>i.id===id); if(!it) return;
    it.retry = !it.retry; persist(); render();
  }

  /* ============ 액션: 과제 ============ */
  function addAssignment(){
    const title = document.getElementById('asgTitle').value.trim();
    const date = document.getElementById('asgDate').value;
    const hours = parseFloat(document.getElementById('asgHours').value);
    const tag = document.getElementById('asgTag').value.trim();

  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  async function syncClassroom(manual){
    const token = getGithubToken();
    if(!token){
      if(manual){ syncStatus = 'GitHub 토큰이 필요해 — 저장소가 비공개라서 그래. 설정에서 등록해줘.'; render(); }
      return;
    }
    if(manual){ syncStatus = '동기화 중...'; render(); }
    try{
      const res = await fetch(CLASSROOM_SYNC_API_URL + '&t=' + Date.now(), {
        cache:'no-store',
        headers:{ 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github.raw+json' }
      });
      if(res.status===401 || res.status===403 || res.status===404) throw new Error('토큰이 유효하지 않거나 dshs-organizer-data 저장소 접근 권한이 없어 — 설정에서 GitHub 토큰을 다시 확인해줘 (비공개 저장소는 권한 없으면 404로 응답함)');
      if(!res.ok) throw new Error('HTTP '+res.status);
      const payload = await res.json();
      if(payload.lastCheckedAt) lastSyncCheckedAt = payload.lastCheckedAt;
      lastSyncError = '';
      const incomingAsg = Array.isArray(payload.assignments) ? payload.assignments : [];
      const incomingNotices = Array.isArray(payload.notices) ? payload.notices : [];
      const knownAsg = new Set(state.data.importedClassroomIds || []);
      const knownNotices = new Set(state.data.importedNoticeIds || []);
      let addedAsg = 0, skippedNoDate = 0, addedNotices = 0;
      incomingAsg.forEach(item=>{
        if(!item || !item.id || knownAsg.has(item.id)) return;
        if(!item.dueDate || !DATE_RE.test(item.dueDate)){ skippedNoDate++; return; }
        state.data.assignments.push({
          id: genId(), title: (item.title || '제목 없음').trim(), dueDate: item.dueDate,
          estHours: (typeof item.estHours==='number' && item.estHours>0) ? item.estHours : null,
          tag: (item.tag || 'Classroom').trim(), done:false, createdAt: Date.now(), source:'classroom-sync',
          link: (typeof item.link==='string' && /^https?:\/\//.test(item.link)) ? item.link : null
        });
        state.data.importedClassroomIds.push(item.id);
        knownAsg.add(item.id); addedAsg++;
      });
      incomingNotices.forEach(item=>{
        if(!item || !item.id || knownNotices.has(item.id)) return;
        state.data.notices.push({
          id: genId(), type: item.type==='material'?'material':'notice',
          title:(item.title||'').trim(), tag:(item.tag||'').trim(),
          postedAt: item.postedAt || new Date().toISOString(), snippet:(item.snippet||'').trim(),
          link: (typeof item.link==='string' && /^https?:\/\//.test(item.link)) ? item.link : null
        });
        state.data.importedNoticeIds.push(item.id);
        knownNotices.add(item.id); addedNotices++;
      });
      if(addedAsg>0 || addedNotices>0) persist();
      if(manual) syncStatus = (addedAsg>0||addedNotices>0)
        ? `과제 ${addedAsg}개, 공지·자료 ${addedNotices}개를 불러왔어${skippedNoDate>0?` (기한 불명확 ${skippedNoDate}개 제외)`:''}.`
        : '새로 불러올 항목이 없어.';
    }catch(err){
      lastSyncError = err.message || '오프라인이거나 알 수 없는 오류';
      if(manual) syncStatus = `동기화 실패 — ${lastSyncError}.`;
    }
    render();
  }

  /* ============ 홈 박스 드래그 (물방울처럼 마우스로 움직이기) ============ */
  const BOX_DRAG_RANGE = 90;
  let suppressNextClick = false;
  let boxDrag = null;
  document.body.addEventListener('pointerdown', function(e){
    if(e.button!=null && e.button!==0) return;
    const wrap = e.target.closest('.box-drag');
    if(!wrap || e.target.closest('button') || e.target.closest('.box-task-row')) return;
    const key = wrap.dataset.boxkey;
    const off = boxDragOffsets[key] || {x:0, y:0};
    boxDrag = { key, el:wrap, startX:e.clientX, startY:e.clientY, origX:off.x, origY:off.y, moved:false, pointerId:e.pointerId };
    wrap.classList.add('dragging');
    // setPointerCapture는 일부러 안 씀 — 캡처를 걸면 click 이벤트의 target이 wrap(래퍼)으로
    // 바뀌어서 안쪽 <button data-action>을 closest()로 못 찾게 됨. document.body에서
    // pointerId로 걸러 듣고 있어서 캡처 없이도 드래그 추적에는 문제 없음.
  });
  document.body.addEventListener('pointermove', function(e){
    if(!boxDrag || e.pointerId!==boxDrag.pointerId) return;
    const dx = e.clientX - boxDrag.startX, dy = e.clientY - boxDrag.startY;
    if(Math.abs(dx)>4 || Math.abs(dy)>4) boxDrag.moved = true;
    if(boxDrag.moved){
      const x = Math.max(-BOX_DRAG_RANGE, Math.min(BOX_DRAG_RANGE, boxDrag.origX+dx));
      const y = Math.max(-BOX_DRAG_RANGE, Math.min(BOX_DRAG_RANGE, boxDrag.origY+dy));
      boxDrag.el.style.transform = `translate(${x}px,${y}px)`;
    }
  });
  function endBoxDrag(e){
    if(!boxDrag || (e.pointerId!==undefined && e.pointerId!==boxDrag.pointerId)) return;
    boxDrag.el.classList.remove('dragging');
    if(boxDrag.moved){
      const dx = e.clientX - boxDrag.startX, dy = e.clientY - boxDrag.startY;
      const x = Math.max(-BOX_DRAG_RANGE, Math.min(BOX_DRAG_RANGE, boxDrag.origX+dx));
      const y = Math.max(-BOX_DRAG_RANGE, Math.min(BOX_DRAG_RANGE, boxDrag.origY+dy));
      boxDragOffsets[boxDrag.key] = {x, y};
      suppressNextClick = true;
      const cell = boxDrag.el.querySelector('.box-cell');
      if(cell){
        cell.classList.add('drop-bounce');
        cell.addEventListener('animationend', ()=>cell.classList.remove('drop-bounce'), {once:true});
      }
    }
    boxDrag = null;
  }
  document.body.addEventListener('pointerup', endBoxDrag);
  document.body.addEventListener('pointercancel', endBoxDrag);

      ? {type:'personal', id:row.dataset.dragId}
      : {type:'teacher', key:row.dataset.dragKey, corner:row.dataset.dragCorner, id:row.dataset.dragId};
    e.dataTransfer.setData('application/json', JSON.stringify(payload));
    e.dataTransfer.effectAllowed = 'copy';
    row.classList.add('dragging-task');
  });
  document.body.addEventListener('dragend', function(e){
    const row = e.target.closest('.box-task-row');
    if(row) row.classList.remove('dragging-task');
    document.querySelectorAll('.pomo-card.drag-over').forEach(c=>c.classList.remove('drag-over'));
  });
  document.body.addEventListener('dragover', function(e){
    const card = e.target.closest('.pomo-card');
    if(!card) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    card.classList.add('drag-over');
  });
  document.body.addEventListener('drop', function(e){
    const card = e.target.closest('.pomo-card');
    if(!card) return;
    e.preventDefault();
    card.classList.remove('drag-over');
    try{
      const data = JSON.parse(e.dataTransfer.getData('application/json'));
      if(data && data.type){
        pomo.target = data;
        render();
        const newCard = document.querySelector('.pomo-card');
        if(newCard){
          newCard.classList.add('linked-flash');
          newCard.addEventListener('animationend', ()=>newCard.classList.remove('linked-flash'), {once:true});
        }
      }
    }catch(err){}
  });

  /* ============ 이벤트 위임 ============ */
  document.body.addEventListener('click', function(e){
    if(suppressNextClick){ suppressNextClick = false; return; }
    const el = e.target.closest('[data-action]'); if(!el) return;
    if(el.dataset.action==='closeModal' && el.classList.contains('modal-overlay') && e.target!==el) return;
    switch(el.dataset.action){
      case 'goView': state.view=el.dataset.view; render(); break;
      case 'goCategory': {
        const cat = el.dataset.cat;
        const subj = el.dataset.subj;
        state.view = 'teachers';
        render();
        const target = (subj && document.querySelector(`.teacher-row[data-subj="${subj}"]`)) || document.getElementById('catgroup-' + cat);
        if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
        break;
      }
      case 'toggleTeacher': {
        const k = el.dataset.key;
        state.expandedTeacher = state.expandedTeacher===k ? null : k;
        state.cornerTab = 'review';
        render();
        break;
      }
      case 'setCornerTab': state.cornerTab = el.dataset.corner; render(); break;
      case 'addItem': { const input = el.parentElement.querySelector('.add-input'); addItem(el.dataset.key, el.dataset.corner, input.value); break; }
      case 'completeItem': completeItem(el.dataset.key, el.dataset.corner, el.dataset.id); break;
      case 'deleteItem': deleteItem(el.dataset.key, el.dataset.corner, el.dataset.id); break;
      case 'restoreItem': restoreItem(el.dataset.key, el.dataset.id); break;
      case 'deletePermanent': deletePermanent(el.dataset.key, el.dataset.id); break;
      case 'incReps': incReps(el.dataset.key, el.dataset.id); break;
      case 'toggleRetry': toggleRetry(el.dataset.key, el.dataset.id); break;
      case 'openCompleted': state.completedTeacherKey = el.dataset.key; state.modal='completed'; render(); break;
      case 'openCompletedPersonal': state.modal='completedPersonal'; render(); break;
      case 'restorePersonal': restorePersonalTask(el.dataset.id); break;
      case 'deletePersonalPermanent': deletePersonalPermanent(el.dataset.id); break;
      case 'quickAdd': state.quickAddKey = el.dataset.key; state.quickAddCorner = 'review'; state.modal = 'quickAdd'; render(); break;
      case 'setQuickAddCorner': state.quickAddCorner = el.dataset.corner; render(); break;
      case 'openSettings': settingsStatus=''; githubTokenStatus=''; state.modal='settings'; render(); break;
      case 'closeModal': state.modal=null; render(); break;
      case 'exportData': exportData(); break;
      case 'importTrigger': document.getElementById('importFile').click(); break;
      case 'addAssignment': addAssignment(); break;
      case 'toggleAssignment': toggleAssignment(el.dataset.id); break;
      case 'deleteAssignment': deleteAssignment(el.dataset.id); break;
      case 'setAssignmentPriority': {
        const a = state.data.assignments.find(x=>x.id===el.dataset.id);
        if(a){ a.priority = a.priority===el.dataset.val ? null : el.dataset.val; persist(); render(); }
        break;
      }
      case 'setAsgSortMode': state.asgSortMode = el.dataset.mode; render(); break;
      case 'pomoStart': pomoStart(); break;
      case 'pomoPause': pomoPause(); break;
      case 'pomoReset': pomoReset(); break;
      case 'pomoSetDuration': pomoSetDuration(parseInt(el.dataset.min,10)); break;
      case 'pomoCompleteLinked': pomoCompleteLinked(); break;
      case 'otParse': otParse(el.dataset.key); break;
      case 'classifyTasks': classifyTasks(); break;
      case 'addPersonal': {
        const input = document.getElementById('personalAddInput');
        const boxSel = document.getElementById('personalAddBox');
        addPersonalTask(input.value, boxSel ? boxSel.value : null);
        break;
      }
      case 'completePersonal': completePersonalTask(el.dataset.id); break;
      case 'deletePersonal': deletePersonalTask(el.dataset.id); break;
      case 'saveApiKey': saveApiKey(); break;
      case 'clearApiKey': clearApiKey(); break;
      case 'saveGithubToken': saveGithubToken(); break;
      case 'clearGithubToken': clearGithubToken(); break;
      case 'saveStudentName': saveStudentName(); break;
      case 'setRotation': setRotationOverride(el.dataset.rot, el.dataset.val || null); render(); break;
      case 'syncClassroom': syncClassroom(true); break;
      case 'plannerShift': {
        const d = new Date(state.plannerDate+'T00:00:00');
        d.setDate(d.getDate() + parseInt(el.dataset.delta,10));
        state.plannerDate = toISODate(d);
        render();
        break;
      }
      case 'plannerToday': state.plannerDate = todayISO; render(); break;
      case 'copyTemplate': {
        const t = getTemplates().find(x=>x.id===el.dataset.id);
        if(t){
          navigator.clipboard.writeText(t.content).then(()=>{
            templateCopyStatus = el.dataset.id;
            render();
            setTimeout(()=>{ if(templateCopyStatus===el.dataset.id){ templateCopyStatus=''; render(); } }, 1500);
          }).catch(()=>{});
        }
        break;
      }
      case 'addTemplate': {
        const input = document.getElementById('newTplName');
        const name = (input.value||'').trim();
        if(!name) break;
        const list = getTemplates();
        list.push({id:genId(), name, content:''});
        setTemplates(list);
        input.value = '';
        render();
        break;
      }
      case 'deleteTemplate': {
        setTemplates(getTemplates().filter(t=>t.id!==el.dataset.id));
        render();
        break;
      }
    }
  });

  document.body.addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    if(e.target.id==='personalAddInput'){
      const boxSel = document.getElementById('personalAddBox');
      addPersonalTask(e.target.value, boxSel ? boxSel.value : null);
    } else if(e.target.classList.contains('add-input')){
      addItem(e.target.dataset.key, e.target.dataset.corner, e.target.value);
    }
  });

  let debTimer = null;
  document.body.addEventListener('input', function(e){
    if(e.target.id==='pomoTargetSelect'){
      const v = e.target.value;
      if(!v){ pomo.target = null; }
      else {
        const parts = v.split(':');
        if(parts[0]==='assignment'){ pomo.target = {type:'assignment', id:parts[1]}; }
        else if(parts[0]==='personal'){ pomo.target = {type:'personal', id:parts[1]}; }
        else if(parts[0]==='teacher'){ pomo.target = {type:'teacher', key:parts[1], corner:parts[2], id:parts[3]}; }
      }
      render();
    } else if(e.target.dataset.role==='memo' || e.target.dataset.role==='info'){
      const role = e.target.dataset.role, key=e.target.dataset.key, val=e.target.value;
      clearTimeout(debTimer);
      debTimer = setTimeout(()=>{ state.data.teachers[key][role] = val; persist(); }, 400);
    } else if(e.target.dataset.role==='capacity'){
      const val = parseFloat(e.target.value)||5;
      clearTimeout(debTimer);
      debTimer = setTimeout(()=>{ state.data.dailyCapacity = val; persist(); render(); }, 500);
    } else if(e.target.dataset.role==='asgHours'){
      const id = e.target.dataset.id, val = parseFloat(e.target.value);
      clearTimeout(debTimer);
      debTimer = setTimeout(()=>{
        const a = state.data.assignments.find(x=>x.id===id);
        if(a && val>0){ a.estHours = val; persist(); render(); }
      }, 500);
    } else if(e.target.dataset.role==='templateName' || e.target.dataset.role==='templateContent'){
      const field = e.target.dataset.role==='templateName' ? 'name' : 'content';
      const id = e.target.dataset.id, val = e.target.value;
      clearTimeout(debTimer);
      debTimer = setTimeout(()=>{
        const list = getTemplates();
        const t = list.find(x=>x.id===id);
        if(t){ t[field] = val; setTemplates(list); }
      }, 400);
    }
  });

  document.getElementById('importFile').addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]) importDataFromFile(e.target.files[0]);
    e.target.value = '';
  });

  /* ============ 초기화 ============ */
  (function init(){
    const saved = loadData();
    if(saved){
      const skeleton = buildSkeleton();
      if(saved.teachers || saved.assignments || saved.dailyCapacity){
        state.data = {
          teachers: Object.assign(skeleton.teachers, saved.teachers||{}),
          assignments: saved.assignments || [],
          notices: saved.notices || [],
          dailyCapacity: saved.dailyCapacity || 5,
          importedClassroomIds: saved.importedClassroomIds || [],
          importedNoticeIds: saved.importedNoticeIds || [],
          personal: saved.personal || { tasks:[], completed:[] }
        };
      } else {
        state.data = { teachers: Object.assign(skeleton.teachers, saved), assignments:[], notices:[], dailyCapacity:5, importedClassroomIds:[], importedNoticeIds:[], personal:{tasks:[],completed:[]} };
      }
    }
    render();
    syncClassroom(false);
  })();

})();
</script>
</body>
</html>
