<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Study Organizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    --bg:#000000;
    --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.13); --glass-press:rgba(255,255,255,.18);
    --border:rgba(255,255,255,.11); --border-strong:rgba(255,255,255,.18); --border-hi:rgba(255,255,255,.32);
    --text:#F5F5F7; --text-2:rgba(245,245,247,.62); --text-3:rgba(245,245,247,.38);
    --blue:#0A84FF; --red:#FF453A; --green:#30D158; --orange:#FF9F0A; --purple:#BF5AF2; --pink:#FF375F; --indigo:#5E5CE6; --teal:#64D2FF;
    --accent:var(--blue);
    --danger:var(--red); --good:var(--green);
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Pretendard Variable','Pretendard','Malgun Gothic',sans-serif;
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --blur:26px;
    --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 620px at 12% -8%, rgba(10,132,255,.20), transparent 60%),
      radial-gradient(ellipse 780px 680px at 105% 8%, rgba(191,90,242,.14), transparent 55%),
      radial-gradient(ellipse 700px 640px at 25% 108%, rgba(255,69,58,.08), transparent 58%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1;
  }
  ::selection{background:rgba(10,132,255,.35);}
  button,input,textarea{font-family:inherit;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}
  button{cursor:pointer;}

  /* ---- glass utility ---- */
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);
    backdrop-filter:blur(var(--blur)) saturate(1.7);
    border:1px solid var(--border);
    border-top-color:var(--border-hi);
  }

  /* ---- shell / nav ---- */
  .app-shell{display:flex;min-height:100vh;align-items:stretch;}
  .sidebar{width:236px;flex-shrink:0;margin:14px 0 14px 14px;padding:20px 12px;border-radius:var(--r-lg);position:sticky;top:14px;height:calc(100vh - 28px);overflow-y:auto;display:flex;flex-direction:column;}
  .sidebar-brand{padding:4px 10px 22px;display:flex;align-items:center;gap:9px;cursor:pointer;}
  .sidebar-brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--purple));flex-shrink:0;}
  .sidebar-brand b{font-size:14.5px;font-weight:600;letter-spacing:-.01em;}
  .nav-list{display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:11px;font-size:14px;color:var(--text-2);background:none;border:none;text-align:left;width:100%;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);position:relative;}
  .nav-icon{width:27px;height:27px;border-radius:8px;background:var(--nc,var(--blue));display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);}
  .nav-icon svg{opacity:1;}
  .nav-item:hover{background:var(--glass);color:var(--text);}
  .nav-item.active{background:var(--glass-strong);color:var(--text);font-weight:600;}
  .nav-item .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);}

  .bottom-nav{display:none;}
  .main{flex:1;min-width:0;}
  .main-inner{max-width:720px;margin:0 auto;padding:40px 32px 110px;}

  .topbar-mini{display:flex;justify-content:flex-end;margin-bottom:-8px;}
  .iconbtn{background:var(--glass);border:1px solid var(--border);color:var(--text-2);font-size:12.5px;padding:7px 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px;transition:all var(--dur) var(--ease);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));}
  .iconbtn:hover{color:var(--text);border-color:var(--border-strong);background:var(--glass-strong);}

  @media(max-width:979px){
    .sidebar{width:64px;padding:20px 8px;}
    .sidebar-brand{justify-content:center;padding:4px 0 20px;}
    .sidebar-brand b{display:none;}
    .nav-item{justify-content:center;padding:8px;}
    .nav-item .label{display:none;}
    .main-inner{padding:34px 22px 110px;}
  }
  @media(max-width:639px){
    .app-shell{display:block;}
    .sidebar{display:none;}
    .bottom-nav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:var(--r-lg);padding:8px 6px;justify-content:space-around;z-index:60;box-shadow:0 12px 32px rgba(0,0,0,.45);}
    .bottom-nav .nav-item{flex-direction:column;gap:3px;font-size:9.5px;padding:5px 4px;border-radius:12px;flex:1;min-width:0;}
    .bottom-nav .nav-icon{width:26px;height:26px;}
    .bottom-nav .nav-item .label{display:block;font-size:9.5px;}
    .main-inner{padding:24px 16px 110px;max-width:100%;}
  }

  /* ---- page header ---- */
  .page-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:30px;flex-wrap:wrap;}
  .page-head h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0;}
  .page-head .sub{font-size:13px;color:var(--text-3);}

  .home-date{font-size:13px;color:var(--text-3);margin-bottom:6px;}
  .home-greeting{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0 0 40px;}

  .section{margin-bottom:36px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px;}
  .section-title{font-size:12.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.055em;}
  .section-link{font-size:12.5px;color:var(--text-3);background:none;border:none;padding:0;}
  .section-link:hover{color:var(--text);}

  .empty{color:var(--text-3);font-size:13.5px;padding:18px 0;}

  .panel{border-radius:var(--r-md);padding:6px 16px;}

  /* ---- task rows ---- */
  .task-row{display:flex;align-items:flex-start;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);}
  .task-row:last-child{border-bottom:none;}
  .task-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);flex-shrink:0;margin-top:1px;background:var(--glass);display:flex;align-items:center;justify-content:center;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease);padding:0;}
  .task-check:hover{border-color:var(--blue);}
  .task-check svg{opacity:0;transform:scale(.4);transition:all var(--dur) var(--ease);}
  .task-row.done .task-check{background:var(--blue);border-color:var(--blue);}
  .task-row.done .task-check svg{opacity:1;transform:scale(1);}
  .task-body{flex:1;min-width:0;}
  .task-tag{font-size:12px;color:var(--text-3);margin-bottom:2px;}
  .task-text{font-size:14.5px;line-height:1.5;transition:color var(--dur) var(--ease);word-break:break-word;}
  .task-row.done .task-text{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--border-strong);}
  .task-badge{font-size:11px;color:var(--text-3);flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;}
  .task-del{width:22px;height:22px;border-radius:50%;border:none;background:none;color:var(--text-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--dur) var(--ease);}
  .task-row:hover .task-del{opacity:1;}
  .task-del:hover{color:var(--red);}

  /* ---- assignment rows ---- */
  .asg-row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--border);}
  .asg-row:last-child{border-bottom:none;}
  .asg-row.done{opacity:.4;}
  .asg-check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border-strong);flex-shrink:0;background:var(--glass);display:flex;align-items:center;justify-content:center;padding:0;transition:all var(--dur) var(--ease);}
  .asg-row.done .asg-check{background:var(--green);border-color:var(--green);}
  .asg-check svg{opacity:0;transform:scale(.4);transition:all var(--dur) var(--ease);}
  .asg-row.done .asg-check svg{opacity:1;transform:scale(1);}
  .asg-main{flex:1;min-width:0;}
  .asg-tag{font-size:12px;color:var(--text-3);}
  .asg-title{font-size:14.5px;margin-top:1px;word-break:break-word;}
  .asg-row.done .asg-title{text-decoration:line-through;text-decoration-color:var(--border-strong);}
  .asg-sub{font-size:12px;color:var(--text-3);margin-top:3px;}
  .asg-due{font-size:12.5px;color:var(--text-2);flex-shrink:0;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .asg-due.urgent{color:var(--orange);font-weight:600;}
  .asg-due.overdue{color:var(--red);font-weight:600;}
  .asg-del{width:24px;height:24px;border-radius:50%;border:none;background:none;color:var(--text-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--dur);}
  .asg-row:hover .asg-del{opacity:1;}
  .asg-del:hover{color:var(--red);}
  .asg-hours-input{width:100px;background:var(--glass);border:1px solid var(--orange);border-radius:var(--r-pill);color:var(--text);padding:6px 12px;font-size:12px;text-align:center;}

  .cap-line{font-size:13px;color:var(--text-2);padding:10px 4px 18px;border-bottom:1px solid var(--border);margin-bottom:6px;}
  .cap-line b{color:var(--text);font-weight:600;}
  .cap-line.over{color:var(--red);}
  .cap-line.over b{color:var(--red);}

  .asg-form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--border);align-items:center;}
  .asg-form input{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:9px 14px;font-size:13px;}
  .asg-form input.title{flex:2;min-width:180px;}
  .asg-form input.date{flex:1;min-width:130px;}
  .asg-form input.hours{width:88px;}
  .asg-form input.tag{flex:1;min-width:110px;}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:filter var(--dur) var(--ease),transform var(--dur) var(--ease);}
  .btn:hover{filter:brightness(1.12);}
  .btn:active{transform:scale(.97);}
  .btn-outline{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border-strong);color:var(--text);border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:all var(--dur) var(--ease);}
  .btn-outline:hover{background:var(--glass-strong);}
  .btn-outline:active{transform:scale(.97);}
  .btn-danger{background:var(--red);color:#fff;border:none;border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:filter var(--dur) var(--ease);}
  .btn-danger:hover{filter:brightness(1.12);}

  /* ---- schedule ---- */
  .sched-row{display:flex;align-items:center;gap:16px;padding:10px 6px;border-bottom:1px solid var(--border);font-size:14px;border-radius:10px;}
  .sched-row:last-child{border-bottom:none;}
  .sched-row .p{width:46px;color:var(--text-3);font-size:12.5px;flex-shrink:0;}
  .sched-row .s-main{flex:1;min-width:0;}
  .sched-row .s-teacher{font-size:12.5px;color:var(--text-3);margin-top:1px;}
  .sched-row.today{background:rgba(10,132,255,.14);padding-left:10px;padding-right:10px;margin:0 -10px;border-bottom:none;}
  .sched-row.today .s-main{font-weight:600;}

  .week-grid{display:grid;grid-template-columns:52px repeat(5,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;}
  .week-grid .wcell{background:rgba(0,0,0,.4);padding:9px 8px;font-size:12px;min-height:52px;}
  .week-grid .whead{background:rgba(255,255,255,.03);font-size:12px;color:var(--text-3);font-weight:600;text-align:center;padding:9px 4px;}
  .week-grid .whead.today{color:var(--blue);}
  .week-grid .wcell.today{background:rgba(10,132,255,.14);}
  .week-grid .wcell .subj{font-weight:600;font-size:12.5px;}
  .week-grid .wcell .who{color:var(--text-3);font-size:11px;margin-top:2px;}
  .week-grid .wcell.empty{color:var(--text-3);}
  .week-stack{display:none;}
  @media(max-width:639px){
    .week-grid-wrap{display:none;}
    .week-stack{display:flex;flex-direction:column;gap:20px;}
    .week-day-block h3{font-size:13px;color:var(--text-2);margin:0 0 8px;font-weight:600;}
  }

  /* ---- teachers ---- */
  .teacher-group{margin-bottom:26px;}
  .teacher-group-label{font-size:12.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;padding:0 4px;}
  .teacher-row{border-bottom:1px solid var(--border);}
  .teacher-row:last-child{border-bottom:none;}
  .teacher-head{display:flex;align-items:center;gap:12px;padding:13px 4px;background:none;border:none;width:100%;text-align:left;color:var(--text);border-radius:10px;}
  .teacher-head:hover{background:var(--glass);}
  .teacher-name{font-size:15px;font-weight:500;flex:1;}
  .teacher-subj{font-size:12.5px;color:var(--text-3);}
  .teacher-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex-shrink:0;box-shadow:0 0 6px rgba(10,132,255,.7);}
  .teacher-chevron{color:var(--text-3);transition:transform var(--dur) var(--ease);flex-shrink:0;}
  .teacher-row.open .teacher-chevron{transform:rotate(90deg);}
  .teacher-detail{overflow:hidden;max-height:0;transition:max-height 260ms var(--ease);}
  .teacher-row.open .teacher-detail{max-height:4000px;}
  .teacher-detail-inner{padding:10px 4px 28px;}

  .field-label{font-size:12px;color:var(--text-3);margin-bottom:7px;display:flex;align-items:center;gap:6px;}
  .field-box{margin-bottom:16px;}
  .field-box textarea{width:100%;min-height:44px;resize:vertical;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);padding:11px 13px;font-size:13.5px;line-height:1.55;}
  .field-box textarea::placeholder{color:var(--text-3);}

  .corner-tabs{display:inline-flex;gap:2px;margin-bottom:16px;padding:3px;border-radius:var(--r-pill);background:rgba(255,255,255,.05);border:1px solid var(--border);}
  .corner-tab{background:none;border:none;padding:7px 14px;border-radius:var(--r-pill);font-size:12.5px;color:var(--text-2);transition:all var(--dur) var(--ease);}
  .corner-tab.active{color:var(--text);background:var(--glass-strong);font-weight:600;}
  .corner-tab .n{color:inherit;opacity:.6;font-weight:400;}

  .add-row{display:flex;gap:8px;margin-bottom:14px;}
  .add-row input{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:9px 15px;font-size:13px;min-width:0;}
  .add-row input::placeholder{color:var(--text-3);}

  .rep-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .rep-btn{font-size:11px;background:var(--glass);border:1px solid var(--border);color:var(--text-2);border-radius:var(--r-pill);padding:4px 11px;}
  .rep-count{font-size:11px;color:var(--text-3);}
  .retry-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--glass);color:var(--text-3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .retry-btn.on{color:#fff;border-color:var(--red);background:var(--red);}
  .meter{position:relative;height:4px;background:var(--border);border-radius:4px;margin-top:9px;max-width:220px;}
  .meter .fill{position:absolute;left:0;top:0;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--purple));}

  .ot-box{border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-top:26px;background:rgba(255,255,255,.03);}
  .ot-head{font-size:13.5px;font-weight:600;margin-bottom:10px;}
  .ot-textarea{width:100%;min-height:72px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);padding:11px 13px;font-size:13px;margin-bottom:10px;}
  .ot-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .ot-status{font-size:11.5px;color:var(--text-3);}
  .ot-note{font-size:11px;color:var(--text-3);margin-top:9px;line-height:1.5;}

  .completed-link{font-size:12.5px;color:var(--text-3);background:none;border:none;padding:0;margin-top:8px;}
  .completed-link:hover{color:var(--text);}

  /* ---- notices ---- */
  .notice-row{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);}
  .notice-row:last-child{border-bottom:none;}
  .notice-kind{font-size:10.5px;color:var(--purple);width:38px;flex-shrink:0;padding-top:1px;font-weight:600;}
  .notice-main{flex:1;min-width:0;}
  .notice-tag{font-size:12px;color:var(--text-3);}
  .notice-title{font-size:13.5px;margin-top:1px;}
  .notice-snippet{font-size:12.5px;color:var(--text-2);margin-top:3px;line-height:1.5;}
  .row-link{color:var(--blue);text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
  .row-link:hover{text-decoration:underline;}
  .row-link svg{opacity:.8;flex-shrink:0;}

  /* ---- AI classify box ---- */
  .ai-box{border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:26px;background:rgba(255,255,255,.03);}
  .ai-box .ai-head{font-size:13.5px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:7px;}
  .ai-box .ai-head svg{color:var(--purple);}
  .ai-box .ai-desc{font-size:11.5px;color:var(--text-3);margin-bottom:10px;line-height:1.55;}
  .ai-textarea{width:100%;min-height:64px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);padding:11px 13px;font-size:13px;margin-bottom:10px;}
  .ai-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .ai-status{font-size:11.5px;color:var(--text-3);}
  .btn-ai{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;border:none;border-radius:var(--r-pill);padding:9px 18px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:filter var(--dur) var(--ease);}
  .btn-ai:hover{filter:brightness(1.12);}

  /* ---- personal study ---- */
  .personal-note{font-size:12px;color:var(--text-3);margin-bottom:10px;}
  .task-subgroup{margin-bottom:20px;}
  .task-subgroup:last-child{margin-bottom:0;}
  .task-subgroup-label{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin:2px 0 4px;}

  /* ---- planner ---- */
  .date-nav{display:flex;align-items:center;gap:14px;margin-bottom:30px;}
  .date-nav button{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--glass);color:var(--text-2);display:flex;align-items:center;justify-content:center;}
  .date-nav button:hover{background:var(--glass-strong);color:var(--text);}
  .date-nav .dn-label{font-size:19px;font-weight:700;letter-spacing:-.01em;flex:1;}
  .date-nav .dn-today{font-size:12px;color:var(--text-2);background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);padding:6px 13px;width:auto;height:auto;}

  /* ---- settings modal ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;}
  .modal{background:rgba(28,28,32,.72);-webkit-backdrop-filter:blur(34px) saturate(1.8);backdrop-filter:blur(34px) saturate(1.8);border:1px solid var(--border-strong);border-top-color:var(--border-hi);border-radius:var(--r-lg);max-width:520px;width:100%;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}

  .modal-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--glass);color:var(--text-2);display:flex;align-items:center;justify-content:center;}
  .modal-close:hover{background:var(--glass-strong);color:var(--text);}
  .modal-body{padding:8px 22px 24px;overflow-y:auto;}
  .settings-group{padding:20px 0;border-bottom:1px solid var(--border);}
  .settings-group:last-child{border-bottom:none;}
  .settings-group h3{font-size:13px;font-weight:600;margin:0 0 4px;}
  .settings-group .desc{font-size:12px;color:var(--text-3);line-height:1.6;margin-bottom:12px;}
  .settings-group .desc b{color:var(--text-2);}
  .settings-group input[type=password],.settings-group input[type=text]{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:10px 15px;font-size:13px;margin-bottom:10px;}
  .settings-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .settings-status{font-size:11.5px;color:var(--green);margin-left:2px;}
  .rotation-row{margin-bottom:14px;}
  .rotation-row:last-child{margin-bottom:0;}
  .rotation-label{font-size:13px;font-weight:500;margin-bottom:3px;}
  .rotation-status{font-size:12px;color:var(--text-3);margin-bottom:8px;}
  .rotation-actions{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-pill);background:rgba(255,255,255,.05);border:1px solid var(--border);flex-wrap:wrap;}
  .rot-btn{background:none;border:none;color:var(--text-2);border-radius:var(--r-pill);padding:6px 13px;font-size:11.5px;transition:all var(--dur) var(--ease);}
  .rot-btn.active{background:var(--blue);color:#fff;font-weight:600;}

  .completed-modal .item{padding:11px 4px;border-bottom:1px solid var(--border);}
  .completed-modal .item:last-child{border-bottom:none;}
  .completed-modal .item-top{display:flex;align-items:flex-start;gap:10px;}
  .completed-modal .item-text{flex:1;font-size:13.5px;}
  .completed-modal .item-date{font-size:11px;color:var(--text-3);margin-top:4px;}

  .fade-in{animation:fadeIn 220ms var(--ease);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>

  <div id="sidebarSlot"></div>
  <main class="main"><div class="main-inner" id="app"></div></main>
</div>
<div id="bottomNavSlot"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
(function(){
  "use strict";

  /* ============ 과목/교사 구조 ============ */
  const CATS = {
    math:{ label:"수학과", subjects:{
      math:{ label:"수학", teachers:["손중록","조유경","이상규"] }
    }},
    sci:{ label:"과학과", subjects:{

      earth:{ label:"지구과학", teachers:["배태윤","이윤아"] },
      phys:{ label:"물리학", teachers:["박준홍","김정석"] },
      chem:{ label:"화학", teachers:["우희정","이형준","이승재"] }
    }},

      soc:{ label:"사회", teachers:["김현심"] }
    }}
  };

  const REPETITION_SUBJECTS = new Set(['math|math','sci|phys']);
  function isRepetitionSubject(c,s){ return REPETITION_SUBJECTS.has(c+'|'+s); }

  const TIMETABLE = {
    mon:[
      {p:1,subject:"물리학",rot:'sci|phys',role:'double',room:"611호"},
      {p:2,subject:"물리학",rot:'sci|phys',role:'double',room:"611호"},
      {p:3,subject:"영어",teacher:"이계화",room:"어학1실"},
      {p:4,subject:"수학",teacher:"조유경",room:"603호"},
      {p:5,subject:"화학",teacher:"이형준",room:"원격강의실"},
      {p:6,subject:"사회",teacher:"김현심",room:"703호"},

      {p:8,label:"공강"}
    ],
    tue:[
      {p:1,subject:"사회",teacher:"김현심",room:"703호"},
      {p:2,subject:"국어",teacher:"정진실",room:"705호"},
      {p:3,subject:"국어",teacher:"정진실",room:"705호"},
      {p:4,subject:"지구과학",rot:'sci|earth',role:'single',room:"지학3실"},
      {p:5,subject:"수학",teacher:"손중록",room:"609호"},
      {p:6,subject:"수학",teacher:"손중록",room:"609호"},
      {p:7,label:"창의"},{p:8,label:"체험"},{p:9,label:"활동"}
    ],
    wed:[
      {p:1,subject:"사회",teacher:"김현심",room:"703호"},
      {p:2,subject:"수학",teacher:"이상규",room:"604호"},
      {p:3,subject:"수학",teacher:"이상규",room:"604호"},
      {p:4,subject:"물리학",rot:'sci|phys',role:'single',room:"611호"},
      {p:5,subject:"영어",teacher:"김윤주",room:"어학1실"},
      {p:6,subject:"국어",teacher:"주혜령",room:"705호"},
      {p:7,label:"체육",room:"체육관"}
    ],
    thu:[
      {p:1,subject:"정보과학",teacher:"윤수진",room:"정보실"},
      {p:2,subject:"정보과학",teacher:"윤수진",room:"정보실"},
      {p:3,label:"메이커",room:"메이커실"},
      {p:4,label:"메이커",room:"메이커실"},
      {p:5,label:"자율"},{p:6,label:"연구"},{p:7,label:"활동"},{p:8,label:"공강"},{p:9,label:"공강"}
    ],
    fri:[
      {p:1,subject:"영어",teacher:"김윤주",room:"어학1실"},
      {p:2,subject:"생명과학",teacher:"김성진",room:"생명1실"},
      {p:3,subject:"생명과학",teacher:"문우현",room:"생명1실"},
      {p:4,subject:"화학",teacher:"우희정",room:"원격강의실"},
      {p:5,subject:"지구과학",rot:'sci|earth',role:'double',room:"지학2실"},
      {p:6,subject:"지구과학",rot:'sci|earth',role:'double',room:"지학2실"},
      {p:7,subject:"화학",teacher:"이승재",room:"원격강의실"}
    ]
  };
  const DAYKEY = {1:'mon',2:'tue',3:'wed',4:'thu',5:'fri'};
  const DAYLABEL = {mon:'월',tue:'화',wed:'수',thu:'목',fri:'금'};
  const DAYNAME = ['일','월','화','수','목','금','토'];

  /* ============ 선생님 주간 로테이션 ============ */
  const ROTATION_REFERENCE_MONDAY = new Date(2026,7,17); // 2026-08-17(월) 기준 시간표
  const ROTATIONS = {
    'sci|phys':  { double:'박준홍', single:'김정석', label:'물리학' },
    'sci|earth': { double:'이윤아', single:'배태윤', label:'지구과학' }
  };
  const ROTATION_OVERRIDE_KEY = 'organizer-rotation-overrides';
  function mondayOf(d){
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const day = x.getDay();
    x.setDate(x.getDate() + (day===0 ? -6 : 1-day));
    return x;
  }
  function weekIsSwappedFor(date){
    const weeks = Math.round((mondayOf(date).getTime() - mondayOf(ROTATION_REFERENCE_MONDAY).getTime()) / (7*86400000));
    return ((weeks % 2) + 2) % 2 === 1;
  }
  function getRotationOverrides(){
    try{ return JSON.parse(localStorage.getItem(ROTATION_OVERRIDE_KEY) || '{}'); }catch(e){ return {}; }
  }
  function getRotationOverride(rotKey){ return getRotationOverrides()[rotKey] || null; }
  function setRotationOverride(rotKey, teacherOrNull){
    const o = getRotationOverrides();
    if(teacherOrNull) o[rotKey] = teacherOrNull; else delete o[rotKey];
    try{ localStorage.setItem(ROTATION_OVERRIDE_KEY, JSON.stringify(o)); }catch(e){}
  }
  function currentDoubleTeacherFor(rotKey, date){
    const cfg = ROTATIONS[rotKey]; if(!cfg) return null;
    const override = getRotationOverride(rotKey);
    if(override) return override;
    return weekIsSwappedFor(date) ? cfg.single : cfg.double;
  }
  function currentDoubleTeacher(rotKey){ return currentDoubleTeacherFor(rotKey, now); }
  function resolveRotTeacherFor(rotKey, role, date){
    const cfg = ROTATIONS[rotKey]; if(!cfg) return null;
    const dbl = currentDoubleTeacherFor(rotKey, date);
    if(role==='double') return dbl;
    return dbl===cfg.double ? cfg.single : cfg.double;
  }
  function entryTeacherFor(entry, date){
    if(entry.teacher) return entry.teacher;
    if(entry.rot && entry.role) return resolveRotTeacherFor(entry.rot, entry.role, date);
    return null;
  }
  function entryTeacher(entry){ return entryTeacherFor(entry, now); }

  const CORNERS = [
    {key:'review', label:'수업 복습'},
    {key:'self',   label:'자율 학습'},
    {key:'tips',   label:'꿀팁'}
  ];

  const TEACHER_LIST = [];
  Object.keys(CATS).forEach(c=>{
    Object.keys(CATS[c].subjects).forEach(s=>{
      CATS[c].subjects[s].teachers.forEach(t=>{
        TEACHER_LIST.push({cat:c, subj:s, teacher:t, key:c+'|'+s+'|'+t, catLabel:CATS[c].label, subjLabel:CATS[c].subjects[s].label});
      });
    });
  });

  function tKey(c,s,t){ return c+'|'+s+'|'+t; }
  function splitTKey(key){ const [cat,subj,teacher]=key.split('|'); return {cat,subj,teacher}; }
  function defaultTeacherData(){ return {review:[],self:[],tips:[],completed:[],memo:'',info:''}; }
  function buildSkeleton(){
    const teachers = {};
    TEACHER_LIST.forEach(x=>{ teachers[x.key] = defaultTeacherData(); });
    return {
      teachers, assignments:[], notices:[], dailyCapacity:5,
      importedClassroomIds:[], importedNoticeIds:[],
      personal:{ tasks:[], completed:[] }
    };
  }
  function genId(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  /* ============ 오늘 정보 ============ */
  const now = new Date();
  const todayKey = DAYKEY[now.getDay()] || null;
  const todayPeriods = todayKey ? TIMETABLE[todayKey] : [];
  const DAYNAME_FULL = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  const MONTHNAME = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const todayDateStr = `${MONTHNAME[now.getMonth()]} ${now.getDate()}일 ${DAYNAME_FULL[now.getDay()]}`;
  const todayMid = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  function toISODate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  const todayISO = toISODate(now);
  const TODAY_TEACHERS = new Set(todayPeriods.map(entryTeacher).filter(Boolean));
  function hasClassToday(t){ return TODAY_TEACHERS.has(t); }
  function greetingWord(){
    const h = now.getHours();
    if(h<11) return '좋은 아침이야';
    if(h<17) return '좋은 오후야';
    return '좋은 저녁이야';
  }

  /* ============ 저장소 ============ */
  const STORAGE_KEY = 'organizer-data-v2';
  const API_KEY_STORAGE_KEY = 'organizer-anthropic-key';
  const GITHUB_TOKEN_STORAGE_KEY = 'organizer-github-token';
  const STUDENT_NAME_KEY = 'organizer-student-name';
  const CLASSROOM_SYNC_API_URL = 'https://api.github.com/repos/jundaleee/dshs-organizer/contents/data/assignments-sync.json?ref=claude/jundal-study-organizer-migration-3z0jb8';
  let storageOK = true;
  (function testStorage(){
    try{
      const probe = '__organizer_probe__';
      localStorage.setItem(probe, '1');
      localStorage.removeItem(probe);
    }catch(e){ storageOK = false; }
  })();
  function loadData(){
    if(!storageOK) return null;
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function persist(){
    if(!storageOK) return;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }
    catch(e){ storageOK = false; render(); }
  }
  function getApiKey(){ try{ return localStorage.getItem(API_KEY_STORAGE_KEY) || ''; }catch(e){ return ''; } }
  function setApiKey(key){
    try{ if(key) localStorage.setItem(API_KEY_STORAGE_KEY, key); else localStorage.removeItem(API_KEY_STORAGE_KEY); }catch(e){}
  }
  function getGithubToken(){ try{ return localStorage.getItem(GITHUB_TOKEN_STORAGE_KEY) || ''; }catch(e){ return ''; } }
  function setGithubToken(token){
    try{ if(token) localStorage.setItem(GITHUB_TOKEN_STORAGE_KEY, token); else localStorage.removeItem(GITHUB_TOKEN_STORAGE_KEY); }catch(e){}
  }
  function getStudentName(){ try{ return localStorage.getItem(STUDENT_NAME_KEY) || ''; }catch(e){ return ''; } }
  function setStudentName(name){
    try{ if(name) localStorage.setItem(STUDENT_NAME_KEY, name); else localStorage.removeItem(STUDENT_NAME_KEY); }catch(e){}
  }

  /* ============ 상태 ============ */
  const state = {
    view:'home', expandedTeacher:null, cornerTab:'review',
    modal:null, completedTeacherKey:null,
    plannerDate: todayISO,
    data:buildSkeleton()
  };
  function getTD(key){ return state.data.teachers[key]; }

  /* ============ 복습 우선순위 모델 ============ */
  const CURVE = [1,3,7,14,30];
  const STAGE_LABELS = ['신규','1차 복습','2차 복습','3차 복습','4차 복습','망각위험'];
  function urgency(item, repetitionMode){
    const days = Math.max(0, Math.floor((Date.now()-item.createdAt)/86400000));
    let stage;
    if(days<1) stage=0; else if(days<3) stage=1; else if(days<7) stage=2; else if(days<14) stage=3; else if(days<30) stage=4; else stage=5;
    let suffix='';
    if(repetitionMode && item.reps>0){
      const reduce = Math.floor(item.reps/2);
      if(reduce>0){ stage = Math.max(0, stage-reduce); suffix = ` · 풀이 ${item.reps}회 반영`; }
    }
    if(item.retry){ stage = 5; suffix = ' · 재교정 필요'; }
    const pct = Math.min(100, (days/30)*100);
    return {days, stage, label:`D+${days} · ${STAGE_LABELS[stage]}${suffix}`, pct};
  }

  /* ============ 아이콘 ============ */
  function icon(name){
    const p = {
      home:'<path d="M3 10.5 10 4l7 6.5"/><path d="M5 9v7h10V9"/>',
      tasks:'<path d="M4 6h1.5M4 10h1.5M4 14h1.5"/><path d="M8 6h8M8 10h8M8 14h5"/>',

      planner:'<rect x="3.5" y="4" width="13" height="12" rx="2"/><path d="M3.5 8h13M6.5 11h1M9.5 11h1M12.5 11h1M6.5 13.5h1M9.5 13.5h1"/>',
      settings:'<circle cx="10" cy="10" r="2.6"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5 5l1.4 1.4M13.6 13.6 15 15M15 5l-1.4 1.4M6.4 13.6 5 15"/>',
      check:'<path d="M4 8.5 7 11.5 12 5"/>',
      close:'<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
      trash:'<path d="M4 5.5h8M7 5.5V4h2v1.5M5 5.5l.5 6.5h5l.5-6.5"/>',
      chevron:'<path d="M6 4l4 4-4 4"/>',
      arrowLeft:'<path d="M9 4L5 8l4 4"/>',
      arrowRight:'<path d="M7 4l4 4-4 4"/>',
      retry:'<path d="M3.5 8a4.5 4.5 0 1 1 1.4 3.3M3.5 8V5M3.5 8h3"/>',
      external:'<path d="M8 5H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-3"/><path d="M11 4h5v5"/><path d="M9.5 10.5 16 4"/>',
      sparkle:'<path d="M10 3v3M10 14v3M3 10h3M14 10h3M5.5 5.5l2 2M12.5 12.5l2 2M14.5 5.5l-2 2M7.5 12.5l-2 2"/>'
    }[name] || '';
    return `<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  }

  const NAV_ITEMS = [
    {view:'home', label:'홈', icon:'home', color:'var(--blue)'},
    {view:'tasks', label:'할 일', icon:'tasks', color:'var(--green)'},
    {view:'assignments', label:'과제', icon:'assignments', color:'var(--orange)'},
    {view:'schedule', label:'시간표', icon:'schedule', color:'var(--purple)'},
    {view:'teachers', label:'선생님', icon:'teachers', color:'var(--pink)'},
    {view:'planner', label:'플래너', icon:'planner', color:'var(--indigo)'}

  /* ============ 렌더 ============ */
  function render(){
    const sidebarSlot = document.getElementById('sidebarSlot');
    const bottomNavSlot = document.getElementById('bottomNavSlot');
    sidebarSlot.innerHTML = renderSidebar();
    bottomNavSlot.innerHTML = renderBottomNav();

    const app = document.getElementById('app');
    let html = renderTopbarMini();
    if(!storageOK) html += `<div class="empty" style="color:var(--danger);">이 브라우저에서는 로컬 저장이 안 돼(시크릿 모드이거나 저장 공간이 꽉 찼을 수 있어). 작업 후 꼭 설정에서 내보내기로 백업해줘.</div>`;
    if(state.view==='home') html += renderHome();
    else if(state.view==='tasks') html += renderTasksPage();
    else if(state.view==='assignments') html += renderAssignmentsPage();
    else if(state.view==='schedule') html += renderSchedulePage();
    else if(state.view==='teachers') html += renderTeachersPage();
    else if(state.view==='planner') html += renderPlannerPage();
    app.innerHTML = html;

    document.querySelectorAll('.modal-overlay').forEach(el=>el.remove());
    if(state.modal==='settings') document.body.insertAdjacentHTML('beforeend', renderSettingsModal());
    else if(state.modal==='completed') document.body.insertAdjacentHTML('beforeend', renderCompletedModal());

    const apiKeyInput = document.getElementById('apiKeyInput');
    if(apiKeyInput) apiKeyInput.value = getApiKey();
    const githubTokenInput = document.getElementById('githubTokenInput');
    if(githubTokenInput) githubTokenInput.value = getGithubToken();
    const nameInput = document.getElementById('studentNameInput');
    if(nameInput) nameInput.value = getStudentName();
  }

  function renderSidebar(){
    const items = NAV_ITEMS.map(n=>`
      <button class="nav-item ${state.view===n.view?'active':''}" data-action="goView" data-view="${n.view}">
        <span class="nav-icon" style="--nc:${n.color}">${icon(n.icon)}</span><span class="label">${n.label}</span>
      </button>`).join('');
    return `<div class="sidebar glass">
      <div class="sidebar-brand" data-action="goView" data-view="home"><div class="mark"></div><b>Study Organizer</b></div>
      <div class="nav-list">${items}</div>
      <div class="sidebar-foot">
        <button class="nav-item" data-action="openSettings"><span class="nav-icon" style="--nc:rgba(255,255,255,.16)">${icon('settings')}</span><span class="label">설정</span></button>
      </div>
    </div>`;
  }
  function renderBottomNav(){
    const items = NAV_ITEMS.map(n=>`
      <button class="nav-item ${state.view===n.view?'active':''}" data-action="goView" data-view="${n.view}">
        <span class="nav-icon" style="--nc:${n.color}">${icon(n.icon)}</span><span class="label">${n.label}</span>
      </button>`).join('');
    return `<div class="bottom-nav glass">${items}</div>`;
  }
  function renderTopbarMini(){
    return `<div class="topbar-mini"><button class="iconbtn" data-action="openSettings">${icon('settings')} 설정</button></div>`;
  }

  /* ---- Home ---- */
  function renderHome(){
    const name = getStudentName();
    let reviewQueue = [];
    TEACHER_LIST.forEach(x=>{
      const td = state.data.teachers[x.key];
      const rep = isRepetitionSubject(x.cat,x.subj);
      td.review.forEach(item=>{
        const u = urgency(item, rep);
        const today = hasClassToday(x.teacher);
        reviewQueue.push({x, item, u, today, score:u.days+(today?6:0)+(item.retry?50:0)});
      });
    });
    reviewQueue.sort((a,b)=>b.score-a.score);
    const taskPreview = reviewQueue.slice(0,5);

    const tasksHtml = taskPreview.length===0
      ? `<div class="empty">오늘 예정된 복습이 없어.</div>`
      : taskPreview.map(q=>`<div class="task-row" data-key="${q.x.key}">
          <button class="task-check" data-action="completeItem" data-corner="review" data-key="${q.x.key}" data-id="${q.item.id}">${icon('check')}</button>
          <div class="task-body">
            <div class="task-tag">${q.x.subjLabel} · ${q.x.teacher}</div>
            <div class="task-text">${escapeHtml(q.item.text)}</div>
          </div>
          <div class="task-badge">${q.u.label.split(' · ')[0]}</div>
        </div>`).join('');

    const pending = state.data.assignments.filter(a=>!a.done).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
    const cap = state.data.dailyCapacity||5;
    let demand=0;
    pending.forEach(a=>{
      if(typeof a.estHours!=='number') return;
      const dLeft = Math.round((new Date(a.dueDate+'T00:00:00').getTime()-todayMid)/86400000);
      demand += a.estHours/Math.max(1,dLeft);
    });
    const over = demand>cap;
    const asgHtml = pending.length===0
      ? `<div class="empty">등록된 과제가 없어.</div>`
      : pending.map(a=>assignmentRowHtml(a,false)).join('');

    let scheduleHtml;
    if(todayPeriods.length===0){
      scheduleHtml = `<div class="empty">오늘은 등교일이 아니야.</div>`;
    } else {
      scheduleHtml = todayPeriods.map(p=>{
        const t = entryTeacher(p);
        return `<div class="sched-row">
          <div class="p">${p.p}교시</div>
          <div class="s-main">${p.subject||p.label}${t?`<div class="s-teacher">${t}${p.room?' · '+p.room:''}</div>`:(p.room?`<div class="s-teacher">${p.room}</div>`:'')}</div>
        </div>`;
      }).join('');
    }

    const notices = (state.data.notices||[]).slice().sort((a,b)=>(b.postedAt||'').localeCompare(a.postedAt||'')).slice(0,8);
    const noticesHtml = notices.length===0 ? '' : `
      <div class="section">
        <div class="section-head"><div class="section-title">공지 · 자료</div></div>
        <div class="personal-note">파란 링크가 있는 항목은 눌러서 바로 Classroom으로 이동해 (학교 계정 로그인 필요, 거기서 첨부파일 다운로드).</div>
        ${notices.map(n=>noticeRowHtml(n)).join('')}
      </div>`;

    const personalPreview = (state.data.personal?.tasks||[]).slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);
    const personalPreviewHtml = personalPreview.length===0
      ? `<div class="empty">개인 학습 항목이 없어.</div>`
      : personalPreview.map(it=>`<div class="task-row">
          <button class="task-check" data-action="completePersonal" data-id="${it.id}">${icon('check')}</button>
          <div class="task-body"><div class="task-text">${escapeHtml(it.text)}</div></div>
        </div>`).join('');

    return `<div class="fade-in">
      <div class="home-date">${todayDateStr}</div>
      <h1 class="home-greeting">${greetingWord()}${name?', '+escapeHtml(name):''}</h1>

      <div class="section">
        <div class="section-head"><div class="section-title">오늘 할 일</div><button class="section-link" data-action="goView" data-view="tasks">전체 보기</button></div>
        <div class="task-subgroup">
          <div class="task-subgroup-label">학교 복습</div>
          ${tasksHtml}
        </div>
        <div class="task-subgroup">
          <div class="task-subgroup-label">개인 학습</div>
          ${personalPreviewHtml}
        </div>
      </div>

      <div class="section">
        <div class="section-head"><div class="section-title">임박한 과제</div><button class="section-link" data-action="goView" data-view="assignments">전체 보기</button></div>
        ${pending.length>0?`<div class="cap-line ${over?'over':''}">하루 평균 <b>${demand.toFixed(1)}시간</b> 필요 · 가용 ${cap}시간 ${over?'— 초과':''}</div>`:''}
        ${asgHtml}
      </div>

      <div class="section">
        <div class="section-head"><div class="section-title">오늘 시간표</div><button class="section-link" data-action="goView" data-view="schedule">전체 보기</button></div>
        ${scheduleHtml}
      </div>

      ${noticesHtml}
    </div>`;
  }

  function assignmentRowHtml(a, showCheckbox){
    const dueMid = new Date(a.dueDate+'T00:00:00').getTime();
    const dLeft = Math.round((dueMid-todayMid)/86400000);
    const ddLabel = dLeft>0?`D-${dLeft}`:(dLeft===0?'D-DAY':`D+${Math.abs(dLeft)} 지남`);
    const ddClass = dLeft<0?'overdue':(dLeft<=2?'urgent':'');
    const hasHours = typeof a.estHours==='number';
    let sub = '';
    if(!a.done){
      if(hasHours){
        const perDay = a.estHours/Math.max(1,dLeft);
        sub = `<div class="asg-sub">총 ${a.estHours}h · 하루 ${perDay.toFixed(1)}h 필요</div>`;
      } else {
        sub = `<input type="number" class="asg-hours-input" step="0.5" min="0.5" placeholder="예상 h 입력" data-role="asgHours" data-id="${a.id}">`;
      }
    }
    return `<div class="asg-row ${a.done?'done':''}">
      <button class="asg-check" data-action="toggleAssignment" data-id="${a.id}">${icon('check')}</button>
      <div class="asg-main">
        ${a.tag?`<div class="asg-tag">${escapeHtml(a.tag)}</div>`:''}
        <div class="asg-title">${a.link?`<a href="${escapeHtml(a.link)}" target="_blank" rel="noopener noreferrer" class="row-link">${escapeHtml(a.title)} ${icon('external')}</a>`:escapeHtml(a.title)}</div>
        ${sub}
      </div>
      <div class="asg-due ${ddClass}">${ddLabel}</div>
      <button class="asg-del" title="삭제" data-action="deleteAssignment" data-id="${a.id}">${icon('trash')}</button>
    </div>`;
  }

  function noticeRowHtml(n){
    return `<div class="notice-row">
      <div class="notice-kind">${n.type==='material'?'자료':'공지'}</div>
      <div class="notice-main">
        <div class="notice-tag">${escapeHtml(n.tag||'')}</div>
        <div class="notice-title">${n.link?`<a href="${escapeHtml(n.link)}" target="_blank" rel="noopener noreferrer" class="row-link">${escapeHtml(n.title||'')} ${icon('external')}</a>`:escapeHtml(n.title||'')}</div>
        ${n.snippet?`<div class="notice-snippet">${escapeHtml(n.snippet)}</div>`:''}
      </div>
    </div>`;
  }

  /* ---- Tasks ---- */
  function renderTasksPage(){
    let review = [], self = [];
    TEACHER_LIST.forEach(x=>{
      const td = state.data.teachers[x.key];
      const rep = isRepetitionSubject(x.cat,x.subj);
      td.review.forEach(item=> review.push({x,item,u:urgency(item,rep)}));
      td.self.forEach(item=> self.push({x,item}));
    });
    review.sort((a,b)=>b.u.days-a.u.days);
    self.sort((a,b)=>b.item.createdAt-a.item.createdAt);

    const reviewHtml = review.length===0 ? `<div class="empty">복습할 항목이 없어.</div>` : review.map(q=>`
      <div class="task-row">
        <button class="task-check" data-action="completeItem" data-corner="review" data-key="${q.x.key}" data-id="${q.item.id}">${icon('check')}</button>
        <div class="task-body">
          <div class="task-tag">${q.x.subjLabel} · ${q.x.teacher}</div>
          <div class="task-text">${escapeHtml(q.item.text)}</div>
        </div>
        <div class="task-badge">${q.u.label.split(' · ')[0]}</div>
      </div>`).join('');

    const selfHtml = self.length===0 ? `<div class="empty">자율 학습 항목이 없어.</div>` : self.map(q=>`
      <div class="task-row">
        <button class="task-check" data-action="completeItem" data-corner="self" data-key="${q.x.key}" data-id="${q.item.id}">${icon('check')}</button>
        <div class="task-body">
          <div class="task-tag">${q.x.subjLabel} · ${q.x.teacher}</div>
          <div class="task-text">${escapeHtml(q.item.text)}</div>
        </div>
      </div>`).join('');

    const personal = (state.data.personal?.tasks||[]).slice().sort((a,b)=>b.createdAt-a.createdAt);
    const personalHtml = personal.length===0 ? `<div class="empty">개인 학습 항목이 없어.</div>` : personal.map(it=>`
      <div class="task-row">
        <button class="task-check" data-action="completePersonal" data-id="${it.id}">${icon('check')}</button>
        <div class="task-body"><div class="task-text">${escapeHtml(it.text)}</div></div>
        <button class="task-del" title="삭제" data-action="deletePersonal" data-id="${it.id}">${icon('trash')}</button>
      </div>`).join('');

    return `<div class="fade-in">
      <div class="page-head"><h1>할 일</h1></div>

      <div class="ai-box">
        <div class="ai-head">${icon('sparkle')} 무엇이든 붙여넣기 → 자동 분류</div>
        <div class="ai-desc">수업 내용, 할 일, 공부 계획을 자유롭게 적으면 학교 복습 · 자율 학습 · 개인 학습으로 알아서 나눠서 추가해줘. 특정 선생님 수업이면 자동으로 그 선생님한테 연결되고, 어느 과목인지 애매하면 개인 학습으로 들어가.</div>
        <textarea class="ai-textarea" id="taskClassifyInput" placeholder="예: 내일까지 물리 3단원 다시 풀어보기 / 수학 기출 5개 풀기 / 영어단어 100개 외우기"></textarea>
        <div class="ai-row">
          <button class="btn-ai" data-action="classifyTasks">${icon('sparkle')} AI로 분류해서 추가</button>
          <span class="ai-status" id="taskClassifyStatus">${taskClassifyStatus}</span>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><div class="section-title">수업 복습</div></div>
        ${reviewHtml}
      </div>
      <div class="section">
        <div class="section-head"><div class="section-title">자율 학습</div></div>
        ${selfHtml}
      </div>
      <div class="section">
        <div class="section-head"><div class="section-title">개인 학습</div></div>
        <div class="personal-note">특정 수업과 무관한 혼자 공부하는 것들. 여기 직접 추가하거나, 위 상자에 자연어로 적어서 자동 분류돼도 여기로 들어와.</div>
        <div class="add-row">
          <input type="text" class="add-input" id="personalAddInput" placeholder="추가할 내용 입력 후 Enter">
          <button class="btn-outline" data-action="addPersonal">추가</button>
        </div>
        ${personalHtml}
      </div>
    </div>`;
  }

  /* ---- Assignments ---- */
  function renderAssignmentsPage(){
    const cap = state.data.dailyCapacity||5;
    const sorted = state.data.assignments.slice().sort((a,b)=>{
      if(a.done!==b.done) return a.done?1:-1;
      return a.dueDate.localeCompare(b.dueDate);
    });
    let demand=0;
    sorted.forEach(a=>{
      if(a.done || typeof a.estHours!=='number') return;
      const dLeft = Math.round((new Date(a.dueDate+'T00:00:00').getTime()-todayMid)/86400000);
      demand += a.estHours/Math.max(1,dLeft);
    });
    const over = demand>cap;
    const rows = sorted.map(a=>assignmentRowHtml(a,true)).join('');

    return `<div class="fade-in">
      <div class="page-head"><h1>과제</h1><button class="iconbtn" data-action="syncClassroom">${icon('arrowRight')} Classroom 동기화</button></div>
      ${syncStatus?`<div class="empty" style="padding:0 0 14px;">${syncStatus}</div>`:''}
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);margin-bottom:18px;">
        <span>하루 가용 학습시간</span>
        <input type="number" min="0.5" step="0.5" value="${cap}" data-role="capacity" style="width:64px;background:var(--glass);border:1px solid var(--border);border-radius:999px;color:var(--text);padding:6px 10px;text-align:center;">
        <span>시간</span>
      </div>
      ${state.data.assignments.length>0?`<div class="cap-line ${over?'over':''}">대기 과제 기준 하루 평균 <b>${demand.toFixed(1)}시간</b> 필요 (가용 ${cap}시간) ${over?`— 초과 ${(demand-cap).toFixed(1)}시간`:`— 여유 ${(cap-demand).toFixed(1)}시간`}</div>`:''}
      <div class="asg-form">
        <input type="text" class="title" id="asgTitle" placeholder="과제명">
        <input type="date" class="date" id="asgDate">
        <input type="number" class="hours" id="asgHours" step="0.5" min="0.5" placeholder="예상 h">
        <input type="text" class="tag" id="asgTag" placeholder="관련 과목">
        <button class="btn" data-action="addAssignment">추가</button>
      </div>
      ${sorted.length===0?`<div class="empty">등록된 과제가 없어.</div>`:rows}
    </div>`;
  }

  /* ---- Schedule ---- */
  function renderSchedulePage(){
    const days=['mon','tue','wed','thu','fri'];
    let maxP=0; days.forEach(d=>TIMETABLE[d].forEach(p=>{ if(p.p>maxP) maxP=p.p; }));

    const gridCells = [];
    for(let p=1;p<=maxP;p++){
      gridCells.push(`<div class="wcell" style="display:flex;align-items:center;color:var(--text-3);font-size:12px;">${p}교시</div>`);
      days.forEach(d=>{
        const e = TIMETABLE[d].find(x=>x.p===p);
        const todayCls = d===todayKey?'today':'';
        if(!e){ gridCells.push(`<div class="wcell empty ${todayCls}">—</div>`); return; }
        const label = e.subject||e.label;
        const t = entryTeacher(e);
        gridCells.push(`<div class="wcell ${todayCls}"><div class="subj">${label}</div>${t?`<div class="who">${t}</div>`:''}</div>`);
      });
    }
    const grid = `<div class="week-grid" style="grid-template-columns:52px repeat(5,1fr);">
      <div class="wcell whead"></div>
      ${days.map(d=>`<div class="wcell whead ${d===todayKey?'today':''}">${DAYLABEL[d]}</div>`).join('')}
      ${gridCells.join('')}
    </div>`;

    const stack = `<div class="week-stack">${days.map(d=>{
      const rows = TIMETABLE[d].map(e=>{
        const label = e.subject||e.label;
        const t = entryTeacher(e);
        return `<div class="sched-row ${d===todayKey?'today':''}"><div class="p">${e.p}교시</div><div class="s-main">${label}${t?`<div class="s-teacher">${t}${e.room?' · '+e.room:''}</div>`:(e.room?`<div class="s-teacher">${e.room}</div>`:'')}</div></div>`;
      }).join('');
      return `<div class="week-day-block"><h3>${DAYLABEL[d]}요일</h3>${rows}</div>`;
    }).join('')}</div>`;

    return `<div class="fade-in">
      <div class="page-head"><h1>시간표</h1></div>
      <div class="week-grid-wrap" style="overflow-x:auto;">${grid}</div>
      ${stack}
    </div>`;
  }

  /* ---- Teachers ---- */

        const open = state.expandedTeacher===x.key;
        return `<div class="teacher-row ${open?'open':''}">
          <button class="teacher-head" data-action="toggleTeacher" data-key="${x.key}">
            ${hasClassToday(x.teacher)?'<span class="teacher-dot"></span>':'<span style="width:6px;"></span>'}
            <span class="teacher-name">${x.teacher}</span>
            <span class="teacher-subj">${x.subjLabel}</span>
            <span class="teacher-chevron">${icon('chevron')}</span>
          </button>
          <div class="teacher-detail">${open?renderTeacherDetail(x):''}</div>

      return `<div class="teacher-group">
        <div class="teacher-group-label">${CATS[c].label}</div>
        ${rows}
      </div>`;
    }).join('');

    return `<div class="fade-in">
      <div class="page-head"><h1>선생님</h1></div>
      ${groups}
    </div>`;
  }

  function renderTeacherDetail(x){
    const td = getTD(x.key);
    const rep = isRepetitionSubject(x.cat, x.subj);

    const tabsHtml = CORNERS.map(cfg=>`
      <button class="corner-tab ${tab===cfg.key?'active':''}" data-action="setCornerTab" data-corner="${cfg.key}">${cfg.label} <span class="n">${td[cfg.key].length}</span></button>
    `).join('');

    const list = td[tab];
    const itemsHtml = list.length===0
      ? `<div class="empty">아직 항목이 없어.</div>`

      </div>
      <div class="field-box">
        <div class="field-label">메모</div>
        <textarea data-role="memo" data-key="${x.key}" placeholder="부족했던 부분이나 기억할 것">${escapeHtml(td.memo)}</textarea>

        <button class="btn-outline" data-action="addItem" data-key="${x.key}" data-corner="${tab}">추가</button>
      </div>
      <div>${itemsHtml}</div>
      <button class="completed-link" data-action="openCompleted" data-key="${x.key}">완료 목록 (${td.completed.length}) →</button>

      <div class="ot-box">

        <textarea class="ot-textarea" id="otInput" placeholder="OT 내용, 수업 필기, 하고 싶은 말 뭐든 그대로 붙여넣으면 이 선생님의 복습·자율학습·팁으로 자동 분류해서 추가해줘."></textarea>
        <div class="ot-row">
          <button class="btn-ai" data-action="otParse" data-key="${x.key}">${icon('sparkle')} AI로 정리해서 추가</button>
          <span class="ot-status" id="otStatus">${otStatus}</span>
        </div>
        <div class="ot-note">Claude API 키가 필요해 — 설정에서 등록해줘. (선생님과 무관한 개인 공부는 "할 일" 탭 상단의 분류 상자를 써줘.)</div>
      </div>
    </div>`;

  function teacherItemHtml(it, corner, rep, key){
    let metaHtml = '';
    if(corner==='review'){
      const u = urgency(it, rep);
      const repsRow = rep ? `<div class="rep-row">
        <button class="rep-btn" data-action="incReps" data-key="${key}" data-id="${it.id}">+ 풀이</button>
        <span class="rep-count">풀이 ${it.reps||0}회</span>
        <button class="retry-btn ${it.retry?'on':''}" title="재교정 필요" data-action="toggleRetry" data-key="${key}" data-id="${it.id}">${icon('retry')}</button>
      </div>` : `<div class="rep-row"><button class="retry-btn ${it.retry?'on':''}" title="재교정 필요" data-action="toggleRetry" data-key="${key}" data-id="${it.id}">${icon('retry')}</button></div>`;
      metaHtml = `<div class="meter"><div class="fill" style="width:${u.pct}%"></div></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px;">
          <span class="task-badge">${u.label}</span>
        </div>
        ${repsRow}`;
    }
    return `<div class="task-row">
      <button class="task-check" data-action="completeItem" data-corner="${corner}" data-key="${key}" data-id="${it.id}">${icon('check')}</button>
      <div class="task-body">
        <div class="task-text">${escapeHtml(it.text)}</div>
        ${metaHtml}
      </div>
      <button class="task-del" title="삭제" data-action="deleteItem" data-corner="${corner}" data-key="${key}" data-id="${it.id}">${icon('trash')}</button>
    </div>`;
  }

  function renderCompletedModal(){
    const key = state.completedTeacherKey;
    const td = getTD(key);
    const x = TEACHER_LIST.find(t=>t.key===key);
    const groups = CORNERS.map(cfg=>{
      const items = td.completed.filter(c=>c.corner===cfg.key).sort((a,b)=>b.completedAt-a.completedAt);
      if(items.length===0) return '';
      const rows = items.map(it=>`<div class="item">
        <div class="item-top">

  /* ============ 액션: Classroom 자동 동기화 ============ */
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  async function syncClassroom(manual){
    const token = getGithubToken();
    if(!token){
      if(manual){ syncStatus = 'GitHub 토큰이 필요해 — 저장소가 비공개라서 그래. 설정에서 등록해줘.'; render(); }
      return;
    }
    if(manual){ syncStatus = '동기화 중...'; render(); }
    try{
      const res = await fetch(CLASSROOM_SYNC_API_URL + '&t=' + Date.now(), {
        cache:'no-store',
        headers:{ 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github.raw+json' }
      });
      if(res.status===401 || res.status===403) throw new Error('토큰이 유효하지 않거나 권한이 없어');
      if(!res.ok) throw new Error('HTTP '+res.status);
      const payload = await res.json();
      const incomingAsg = Array.isArray(payload.assignments) ? payload.assignments : [];
      const incomingNotices = Array.isArray(payload.notices) ? payload.notices : [];
      const knownAsg = new Set(state.data.importedClassroomIds || []);
      const knownNotices = new Set(state.data.importedNoticeIds || []);
      let addedAsg = 0, skippedNoDate = 0, addedNotices = 0;
      incomingAsg.forEach(item=>{
        if(!item || !item.id || knownAsg.has(item.id)) return;
        if(!item.dueDate || !DATE_RE.test(item.dueDate)){ skippedNoDate++; return; }
        state.data.assignments.push({
          id: genId(), title: (item.title || '제목 없음').trim(), dueDate: item.dueDate,
          estHours: (typeof item.estHours==='number' && item.estHours>0) ? item.estHours : null,
          tag: (item.tag || 'Classroom').trim(), done:false, createdAt: Date.now(), source:'classroom-sync',
          link: (typeof item.link==='string' && /^https?:\/\//.test(item.link)) ? item.link : null
        });
        state.data.importedClassroomIds.push(item.id);
        knownAsg.add(item.id); addedAsg++;
      });
      incomingNotices.forEach(item=>{
        if(!item || !item.id || knownNotices.has(item.id)) return;
        state.data.notices.push({
          id: genId(), type: item.type==='material'?'material':'notice',
          title:(item.title||'').trim(), tag:(item.tag||'').trim(),
          postedAt: item.postedAt || new Date().toISOString(), snippet:(item.snippet||'').trim(),
          link: (typeof item.link==='string' && /^https?:\/\//.test(item.link)) ? item.link : null
        });
        state.data.importedNoticeIds.push(item.id);
        knownNotices.add(item.id); addedNotices++;
      });
      if(addedAsg>0 || addedNotices>0) persist();
      if(manual) syncStatus = (addedAsg>0||addedNotices>0)
        ? `과제 ${addedAsg}개, 공지·자료 ${addedNotices}개를 불러왔어${skippedNoDate>0?` (기한 불명확 ${skippedNoDate}개 제외)`:''}.`
        : '새로 불러올 항목이 없어.';
      if(addedAsg>0 || addedNotices>0) render();
    }catch(err){
      if(manual) syncStatus = `동기화 실패 — ${err.message || '오프라인이거나 알 수 없는 오류'}.`;
    }
    if(manual) render();
  }

  /* ============ 내보내기/가져오기 ============ */
  function exportData(){
    const blob = new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`study-organizer-backup-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }
  function importDataFromFile(file){
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        const parsed = JSON.parse(e.target.result);
        const skeleton = buildSkeleton();
        if(parsed.teachers || parsed.assignments || parsed.dailyCapacity){
          state.data = {
            teachers: Object.assign(skeleton.teachers, parsed.teachers||{}),
            assignments: parsed.assignments || [],
            notices: parsed.notices || [],
            dailyCapacity: parsed.dailyCapacity || 5,
            importedClassroomIds: parsed.importedClassroomIds || [],
            importedNoticeIds: parsed.importedNoticeIds || [],
            personal: parsed.personal || { tasks:[], completed:[] }
          };
        } else {
          state.data = { teachers: Object.assign(skeleton.teachers, parsed), assignments:[], notices:[], dailyCapacity:5, importedClassroomIds:[], importedNoticeIds:[], personal:{tasks:[],completed:[]} };
        }
        persist(); render();
      }catch(err){ alert('파일을 읽지 못했어. JSON 형식이 맞는지 확인해줘.'); }
    };
    reader.readAsText(file);
  }

  /* ============ 이벤트 위임 ============ */
  document.body.addEventListener('click', function(e){
    const el = e.target.closest('[data-action]'); if(!el) return;
    if(el.dataset.action==='closeModal' && el.classList.contains('modal-overlay') && e.target!==el) return;
    switch(el.dataset.action){
      case 'goView': state.view=el.dataset.view; render(); break;
      case 'toggleTeacher': {
        const k = el.dataset.key;
        state.expandedTeacher = state.expandedTeacher===k ? null : k;
        state.cornerTab = 'review';
        render();
        break;
      }
      case 'setCornerTab': state.cornerTab = el.dataset.corner; render(); break;
      case 'addItem': { const input = el.parentElement.querySelector('.add-input'); addItem(el.dataset.key, el.dataset.corner, input.value); break; }
      case 'completeItem': completeItem(el.dataset.key, el.dataset.corner, el.dataset.id); break;
      case 'deleteItem': deleteItem(el.dataset.key, el.dataset.corner, el.dataset.id); break;
      case 'restoreItem': restoreItem(el.dataset.key, el.dataset.id); break;
      case 'deletePermanent': deletePermanent(el.dataset.key, el.dataset.id); break;
      case 'incReps': incReps(el.dataset.key, el.dataset.id); break;
      case 'toggleRetry': toggleRetry(el.dataset.key, el.dataset.id); break;
      case 'openCompleted': state.completedTeacherKey = el.dataset.key; state.modal='completed'; render(); break;
      case 'openSettings': settingsStatus=''; githubTokenStatus=''; state.modal='settings'; render(); break;
      case 'closeModal': state.modal=null; render(); break;
      case 'exportData': exportData(); break;
      case 'importTrigger': document.getElementById('importFile').click(); break;
      case 'addAssignment': addAssignment(); break;
      case 'toggleAssignment': toggleAssignment(el.dataset.id); break;
      case 'deleteAssignment': deleteAssignment(el.dataset.id); break;
      case 'otParse': otParse(el.dataset.key); break;
      case 'classifyTasks': classifyTasks(); break;
      case 'addPersonal': { const input = document.getElementById('personalAddInput'); addPersonalTask(input.value); break; }
      case 'completePersonal': completePersonalTask(el.dataset.id); break;
      case 'deletePersonal': deletePersonalTask(el.dataset.id); break;
      case 'saveApiKey': saveApiKey(); break;
      case 'clearApiKey': clearApiKey(); break;
      case 'saveGithubToken': saveGithubToken(); break;
      case 'clearGithubToken': clearGithubToken(); break;
      case 'saveStudentName': saveStudentName(); break;
      case 'setRotation': setRotationOverride(el.dataset.rot, el.dataset.val || null); render(); break;
      case 'syncClassroom': syncClassroom(true); break;
      case 'plannerShift': {
        const d = new Date(state.plannerDate+'T00:00:00');
        d.setDate(d.getDate() + parseInt(el.dataset.delta,10));
        state.plannerDate = toISODate(d);
        render();
        break;
      }
      case 'plannerToday': state.plannerDate = todayISO; render(); break;
    }
  });

  document.body.addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    if(e.target.id==='personalAddInput'){
      addPersonalTask(e.target.value);
    } else if(e.target.classList.contains('add-input')){
      addItem(e.target.dataset.key, e.target.dataset.corner, e.target.value);
    }
  });

  let debTimer = null;
  document.body.addEventListener('input', function(e){
    if(e.target.dataset.role==='memo' || e.target.dataset.role==='info'){
      const role = e.target.dataset.role, key=e.target.dataset.key, val=e.target.value;
      clearTimeout(debTimer);
      debTimer = setTimeout(()=>{ state.data.teachers[key][role] = val; persist(); }, 400);
    } else if(e.target.dataset.role==='capacity'){
      const val = parseFloat(e.target.value)||5;
      clearTimeout(debTimer);
      debTimer = setTimeout(()=>{ state.data.dailyCapacity = val; persist(); render(); }, 500);
    } else if(e.target.dataset.role==='asgHours'){
      const id = e.target.dataset.id, val = parseFloat(e.target.value);
      clearTimeout(debTimer);
      debTimer = setTimeout(()=>{
        const a = state.data.assignments.find(x=>x.id===id);
        if(a && val>0){ a.estHours = val; persist(); render(); }
      }, 500);
    }
  });

  document.getElementById('importFile').addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]) importDataFromFile(e.target.files[0]);
    e.target.value = '';
  });

  /* ============ 초기화 ============ */
  (function init(){
    const saved = loadData();
    if(saved){
      const skeleton = buildSkeleton();
      if(saved.teachers || saved.assignments || saved.dailyCapacity){
        state.data = {
          teachers: Object.assign(skeleton.teachers, saved.teachers||{}),
          assignments: saved.assignments || [],
          notices: saved.notices || [],
          dailyCapacity: saved.dailyCapacity || 5,
          importedClassroomIds: saved.importedClassroomIds || [],
          importedNoticeIds: saved.importedNoticeIds || [],
          personal: saved.personal || { tasks:[], completed:[] }
        };
      } else {
        state.data = { teachers: Object.assign(skeleton.teachers, saved), assignments:[], notices:[], dailyCapacity:5, importedClassroomIds:[], importedNoticeIds:[], personal:{tasks:[],completed:[]} };
      }
    }
    render();
    syncClassroom(false);
  })();

})();
</script>
</body>
</html>
